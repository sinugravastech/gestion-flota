  /* ---------------- El editor del formulario ---------------- */
  /* El borrador: una copia de lo que se puede cambiar, con lo que el formato
     no traiga puesto como es hoy (campos, respuestas y colores) */
  copiar(f) {
    const campos = {};
    this.CAMPOS.forEach(c => { campos[c[0]] = Object.assign({ mostrar: true, obligatorio: Boolean(c[2]) }, (f.campos || {})[c[0]]); });
    return JSON.parse(JSON.stringify({ codigo: f.codigo, version: f.version, fecha_creacion: f.fecha_creacion, supervisor: f.supervisor,
      tipos: f.tipos, campos, secciones: f.secciones,
      opciones: Array.isArray(f.opciones) && f.opciones.length ? f.opciones : this.OPCIONES,
      colores: Object.assign({}, this.COLORES, f.colores) }));
  },
  sucio() { return Boolean(this.borrador && this.formato && estable(this.borrador) !== estable(this.copiar(this.formato))); },
  campo(k) { return ((this.borrador || {}).campos || {})[k] || { mostrar: true, obligatorio: false }; },
  sec(id) { return this.borrador.secciones.find(s => s.id === id); },
  opc(id) { return this.borrador.opciones.find(o => o.id === id); },
  nuevoId: pref => pref + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
  rgba(hex, a) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '')), n = m ? parseInt(m[1], 16) : 0x64748b;
    return 'rgba(' + [n >> 16, (n >> 8) & 255, n & 255].join(',') + ',' + a + ')';
  },
  /* Los tonos que salen de los colores del formato, igual que en el
     formulario y en el PDF (§F): más oscuro, o con otra luz (0 negro,
     1 blanco) conservando el tono */
  rgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim()), n = m ? parseInt(m[1], 16) : 0x20449a;
    return [n >> 16, (n >> 8) & 255, n & 255];
  },
  hex: c => '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''),
  oscurecer(hex, k) { return this.hex(this.rgb(hex).map(v => v * (1 - k))); },
  tinte(hex, luz, sat) {
    const [r, g, b] = this.rgb(hex).map(v => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l0 = (mx + mn) / 2;
    const tono = !d ? 0 : mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    const s = (d ? d / (1 - Math.abs(2 * l0 - 1)) : 0) * (sat == null ? 1 : sat);
    const c = (1 - Math.abs(2 * luz - 1)) * s, x = c * (1 - Math.abs(tono % 2 - 1)), m = luz - c / 2;
    const t = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][Math.floor(tono) % 6];
    return this.hex(t.map(v => (v + m) * 255));
  },
  /* Qué tanto se lee la letra blanca sobre un color: lo ideal es 4,5 o más;
     con menos de 3 ya cuesta leerla */
  contraste(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
    if (!m) return 21;
    const n = parseInt(m[1], 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 1.05 / (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] + 0.05);
  },
  /* Lo que conviene saber de cómo quedó el formato. Son avisos: igual se puede guardar. */
  avisosFormato(b) {
    const l = [], ve = k => b.campos[k] && b.campos[k].mostrar, pide = k => ve(k) && b.campos[k].obligatorio;
    if (!ve('placa')) l.push('Sin placa, el preoperacional no queda en la ficha de ningún vehículo y su kilometraje no llega a Cambios de aceite.');
    else if (!pide('placa')) l.push('La placa no es obligatoria: si el conductor no la escoge, ese preoperacional no queda en la ficha de ningún vehículo.');
    if (!ve('documento') && !ve('nombre')) l.push('Sin documento ni nombre, no queda quién hizo el preoperacional.');
    else if (!pide('documento') && !pide('nombre')) l.push('El conductor no es obligatorio: puede llegar un preoperacional sin saber quién lo hizo.');
    if (!ve('fecha')) l.push('Sin fecha, cada preoperacional queda con la fecha del día en que se envía.');
    if (!b.opciones.some(o => o.cuenta === 'novedad' || o.cuenta === 'grave')) l.push('Ninguna respuesta cuenta como novedad: el sistema nunca va a marcar novedades.');
    if (this.contraste(b.colores.principal) < 3) l.push('Con ese color principal, la letra blanca de los botones y de la banda casi no se va a leer.');
    if (this.contraste(b.colores.oscuro) < 3) l.push('Con ese color oscuro, los bordes y las etiquetas del PDF casi no se van a ver.');
    b.opciones.filter(o => this.contraste(o.color) < 2.5)
      .forEach(o => l.push('El color de «' + (o.nombre || o.boton) + '» es muy claro: en el PDF su letra blanca casi no se va a leer.'));
    return l;

            '<input class="inp" data-pe-item="' + attr(it.id) + '" data-s="' + attr(s.id) + '" value="' + attr(it.texto) + '" placeholder="Texto del ítem"' + dis + '>' +
            boton('preopMover', 'arriba', 'Subir', ' data-d="-1"' + (j === 0 ? ' disabled' : ''), s.id, it.id) +
            boton('preopMover', 'abajo', 'Bajar', ' data-d="1"' + (j === s.items.length - 1 ? ' disabled' : ''), s.id, it.id) +
            boton('preopQuitarItem', 'x', 'Quitar el ítem', '', s.id, it.id) + '</div>').join('') +
          (puede ? '<div class="agregar"><span class="link" data-act="preopAgregarItem" data-s="' + attr(s.id) + '">' + Icon('plus', '', 12) + ' Agregar ítem</span></div>' : '') : '') +
        '</div>';
    }).join('');
    const items = UI.card('Ítems de verificación', '<p class="txt-3 fs12" style="margin-bottom:12px">' + b.secciones.length + ' secciones · ' + total +
        ' ítems · cada uno se califica con ' + esc(ops.map(o => o.boton || '?').join(', ')) + '</p>' + secciones +
      (puede ? '<button class="btn btn-sm" data-act="preopAgregarSec">' + Icon('plus', '', 12) + 'Agregar sección</button>' : ''));
    /* Guardar solo se prende cuando hay algo que guardar */
    const sucio = this.sucio();
    const barra = '<div class="barra-guardar"><span id="peSucio" style="display:' + (sucio ? 'inline-flex' : 'none') + ';align-items:center;gap:8px;margin-right:auto">' +
        '<span class="txt-3 fs12">Hay cambios sin guardar</span><button class="btn btn-ghost" data-act="preopDescartar">Descartar cambios</button></span>' +
      '<a class="btn" href="' + attr(this.enlace()) + '" target="_blank" rel="noopener">' + Icon('externo', '', 14) + 'Ver el formulario</a>' +
      (puede ? '<button class="btn btn-primary" id="peGuardar" data-act="preopGuardar" title="Se prende cuando cambie algo"' + (sucio ? '' : ' disabled') + '>' +
        Icon('save', '', 14) + 'Guardar cambios</button>' : '') + '</div>';
    const html = arriba + (puede ? '' : '<div class="alert a-info mb16">' + Icon('info') + '<div>Su cuenta puede ver el formulario, pero no cambiarlo.</div></div>') +
      '<div id="preopEd"><div id="peAvisos"></div><div class="grid g23"><div>' + datos + campos + colores + '</div><div>' + respuestas + items + '</div></div>' + barra + '</div>';
    return {
      titulo, sub, html,
      despues: () => {
        const raiz = $('#preopEd');
        raiz.addEventListener('input', e => this.escribir(e.target));
        raiz.addEventListener('change', e => this.escribir(e.target));
        this.pintarSucio();
      }
    };
  },
  /* Lo que se escribe o se marca queda de una vez en el borrador */
  escribir(t) {
    const b = this.borrador, d = t.dataset;
    if (!b) return;
    if (d.pe) b[d.pe] = t.value;
    else if (d.peTipo) b.tipos = t.checked ? ORDEN.filter(x => x === d.peTipo || b.tipos.includes(x)) : b.tipos.filter(x => x !== d.peTipo);
    else if (d.peCampo) {
      const c = b.campos[d.peCampo] = Object.assign({ mostrar: true, obligatorio: false }, b.campos[d.peCampo]);
      c[d.peQue] = t.checked;
      /* Obligatorio quiere decir que se muestra; sin mostrarse no puede ser obligatorio */
      if (d.peQue === 'mostrar' && !t.checked) c.obligatorio = false;
      if (d.peQue === 'obligatorio' && t.checked) c.mostrar = true;
      t.closest('.campo-ed').querySelectorAll('input').forEach(x => { x.checked = Boolean(c[x.dataset.peQue]); });
    } else if (d.peSec) {
      const s = this.sec(d.peSec);
      if (s) s.titulo = t.value;
    } else if (d.peItem) {
      const s = this.sec(d.s), it = s && s.items.find(x => x.id === d.peItem);
      if (it) it.texto = t.value;
    } else if (d.peOp) {
      const o = this.opc(d.o);
      if (!o) return;
      o[d.peOp] = t.value;
      $('#peOpPrev').innerHTML = this.previaOpciones(b.opciones);
      $('#peOpLey').textContent = b.opciones.map(x => (x.boton || '?') + ' = ' + (x.nombre || '…')).join(' · ');
    } else if (d.peCol || d.peColhex) {
      /* El color se escoge en el cuadro o se escribe (#1d4ed8); los dos van juntos */
      const k = d.peCol || d.peColhex, v = t.value.trim().toLowerCase();
      if (!/^#[0-9a-f]{6}$/.test(v)) return;
      b.colores[k] = v;
      const otro = d.peCol ? $('[data-pe-colhex="' + k + '"]') : $('[data-pe-col="' + k + '"]');
      if (otro) otro.value = v;
      const muestra = $('#peColVars');
      if (muestra) muestra.setAttribute('style', this.varsColores(b.colores));
    } else return;
    this.pintarSucio();
  },
  async guardar(el) {
    const b = this.borrador;
    if (!b || el.disabled) return;
    if (!this.sucio()) { Toast.show('No hay cambios para guardar.'); return; }
    const f = JSON.parse(JSON.stringify(b));
    ['codigo', 'version', 'fecha_creacion', 'supervisor'].forEach(k => { f[k] = String(f[k] || '').trim(); });
    f.secciones.forEach(s => { s.titulo = this.tituloSec(s).trim(); s.items.forEach(it => { it.texto = String(it.texto || '').trim(); }); });
    const mal = f.secciones.filter(s => !s.titulo || !s.items.length || s.items.some(it => !it.texto));
    f.opciones.forEach(o => { o.boton = String(o.boton || '').trim(); o.nombre = String(o.nombre || '').trim(); });
    const botones = f.opciones.map(o => o.boton.toLowerCase()), hex = c => /^#[0-9a-f]{6}$/i.test(c || '');
    if (!f.codigo || !f.version) { Toast.show('Escriba el código y la versión del formato.', 'err'); return; }
    if (!f.tipos.length) { Toast.show('Marque al menos un tipo de unidad que llene el formulario.', 'err'); return; }
    if (!f.secciones.length) { Toast.show('El formulario necesita al menos una sección con ítems.', 'err'); return; }
    if (f.opciones.length < 2 || f.opciones.length > 5) { Toast.show('Deje entre 2 y 5 respuestas.', 'err'); return; }
    if (f.opciones.some(o => !o.boton || !o.nombre)) { Toast.show('A cada respuesta escríbale lo que dice el botón y lo que quiere decir.', 'err'); return; }
    if (new Set(botones).size !== botones.length) { Toast.show('Hay dos respuestas con el mismo botón: cámbiele el texto a una.', 'err'); return; }
    if (!f.opciones.every(o => hex(o.color)) || !['principal', 'oscuro', 'acento'].every(k => hex(f.colores[k]))) {
      Toast.show('Hay un color que no es válido. Escójalo en el cuadro de color.', 'err'); return;
    }
    if (mal.length) {
      mal.forEach(s => this.abiertas.add(s.id));
      Router.pintar(true);
      Toast.show('Hay secciones sin título o sin ítems, o ítems sin texto. Escríbalos o quítelos antes de guardar.', 'err');
      return;
    }
    const antes = el.innerHTML;
    el.disabled = true;
    el.innerHTML = '<span class="spin"></span>Guardando…';
    try {
      await Nube.guardarFilas('preop_formato', [Object.assign({ id: 'vehiculos' }, f)], 'id');
      await this.traerFormato();
      this.borrador = null;
      this.olvidar();
      Toast.show('Guardado. El formulario de los conductores ya quedó así.');
      Router.pintar(true);
    } catch (e) {
      el.disabled = false;
      el.innerHTML = antes;
      /* Sin el paso 008 la nube no tiene dónde guardar las respuestas y los colores */
      const falta008 = /opciones|colores/.test(e.message || '') && (e.codigo === 'PGRST204' || /column/i.test(e.message || ''));
      Toast.show(falta008 ? 'No se pudo guardar: falta correr el paso 008 en Supabase.' : 'No se pudo guardar: ' + esc(e.message), 'err');
    }
  }
};

Object.assign(Vistas, {

Object.assign(Acciones, {
  verPreop(el) { Preop.ver(el.dataset.p); },
  pdfPreop(el) { Preop.pdf(el.dataset.p, false); },
  imprimirPreop(el) { Preop.pdf(el.dataset.p, true); },
  comprobarPreop(el) { Preop.comprobar(el.dataset.p, el); },
  filtroPreop(el) { Preop.filtro.periodo = el.dataset.v; Router.pintar(true); },
  preopRecargar() { Preop.olvidar(); Router.pintar(true); },
  preopReintentar() { Preop.errorFormato = null; Router.pintar(true); },
  async copiarEnlacePreop() {
    const url = Preop.enlace();
    try {
      await navigator.clipboard.writeText(url);
      Toast.show('Enlace copiado: <b>' + esc(url) + '</b>. Péguelo en el chat de los conductores.');
    } catch (e) {
      Toast.show('No se pudo copiar solo. El enlace es: <b>' + esc(url) + '</b>', 'warn');
    }
  },
  /* Imprime el PDF que se está viendo. Si el navegador no deja, se abre aparte para imprimirlo desde ahí. */
  imprimirVisor(el) {
    const f = el.tagName === 'IFRAME' ? el : el.closest('.modal').querySelector('iframe.visor-pdf');
    if (!f) return;
    try {
      f.contentWindow.focus();
      f.contentWindow.print();
    } catch (e) {
      window.open(f.src, '_blank');
    }
  },
  eliminarPreop(el) {
    const p = Preop.buscar(el.dataset.p);
    if (!p) return;
    Modal.abrir({
      titulo: 'Eliminar este preoperacional', sub: esc(Preop.titulo(p)), sinFoco: true,
      cuerpo: '<div class="alert a-err">' + Icon('warn') + '<div><b>Se borra con su PDF, su firma y su lectura de kilometraje en Cambios de aceite.</b> ' +
        'No se puede deshacer. Sirve para quitar uno de prueba o uno enviado por error.</div></div>',
      pie: '<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-danger" data-act="confirmarEliminarPreop" data-p="' + attr(p.id) + '">' +
        Icon('trash', '', 14) + 'Eliminar</button>'
    });
  },
  async confirmarEliminarPreop(el) {
    const id = el.dataset.p;
    if (el.disabled) return;
    el.disabled = true;
    try {
      await Nube.borrarFilas('preoperacionales', [id]);
    } catch (e) {
      el.disabled = false;
      Toast.show('No se pudo eliminar: ' + esc(e.message), 'err');
      return;
    }
    /* Los archivos se quitan en la cola del depósito, que reintenta sola. La
       lectura ya la borró la nube; aquí se quita de una vez. */
    ['inspeccion.pdf', 'firma.jpg'].forEach(n => Nube.quitar('preoperacional:' + id + ':' + n));
    Datos.lecturas = (Datos.lecturas || []).filter(l => l.id !== 'preop-' + id);
    Modal.cerrarTodo();
    Preop.olvidar();
    Toast.show('Se eliminó el preoperacional.');
    Router.pintar(true);
  },
  preopAbrir(el) {
    const s = el.dataset.s;
    if (Preop.abiertas.has(s)) Preop.abiertas.delete(s); else Preop.abiertas.add(s);
    Router.pintar(true);
  },
  preopMover(el) {
    const s = Preop.sec(el.dataset.s), i = s ? s.items.findIndex(x => x.id === el.dataset.i) : -1, j = i + (+el.dataset.d);
    if (i < 0 || j < 0 || j >= s.items.length) return;
    s.items.splice(j, 0, s.items.splice(i, 1)[0]);
    Router.pintar(true);
  },
  preopQuitarItem(el) {
    const s = Preop.sec(el.dataset.s);
    if (!s) return;
    s.items = s.items.filter(x => x.id !== el.dataset.i);
    Router.pintar(true);
  },
  preopAgregarItem(el) {
    const s = Preop.sec(el.dataset.s), id = Preop.nuevoId('i');
    if (!s) return;
    s.items.push({ id, texto: '' });
    Preop.abiertas.add(s.id);
    Router.pintar(true);
    const inp = $('[data-pe-item="' + id + '"]');
    if (inp) inp.focus();
  },
  preopAgregarSec() {
    const id = Preop.nuevoId('s');
    Preop.borrador.secciones.push({ id, titulo: '', items: [{ id: Preop.nuevoId('i'), texto: '' }] });
    Preop.abiertas.add(id);
    Router.pintar(true);
    const inp = $('[data-pe-sec="' + id + '"]');
    if (inp) { inp.focus(); inp.scrollIntoView({ block: 'center' }); }
  },
  preopQuitarSec(el) {
    const s = Preop.sec(el.dataset.s);
    if (!s) return;
    if (!s.items.length) { Acciones.confirmarQuitarSec(el); return; }
    Modal.abrir({
      titulo: 'Quitar la sección', sub: esc(Preop.tituloSec(s) || 'Sin título'), sinFoco: true,
      cuerpo: '<p class="txt-2">Se quita con sus ' + s.items.length + ' ítems. Los preoperacionales ya enviados no cambian, y nada se guarda hasta que pulse «Guardar cambios».</p>',
      pie: '<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-danger" data-act="confirmarQuitarSec" data-s="' + attr(s.id) + '">' +
        Icon('trash', '', 14) + 'Quitar la sección</button>'
    });
  },
  confirmarQuitarSec(el) {
    Preop.borrador.secciones = Preop.borrador.secciones.filter(s => s.id !== el.dataset.s);
    Modal.cerrarTodo();
    Router.pintar(true);
  },
  preopDescartar() {
    Preop.borrador = null;
    Preop.abiertas = null;
    Router.pintar(true);
  },
  preopGuardar(el) { Preop.guardar(el); },
  preopOpMover(el) {
    const ops = Preop.borrador.opciones, i = ops.findIndex(o => o.id === el.dataset.o), j = i + (+el.dataset.d);
    if (i < 0 || j < 0 || j >= ops.length) return;
    ops.splice(j, 0, ops.splice(i, 1)[0]);
    Router.pintar(true);
  },
  preopOpQuitar(el) {
    const b = Preop.borrador;
    if (b.opciones.length <= 2) return;
    b.opciones = b.opciones.filter(o => o.id !== el.dataset.o);
    Router.pintar(true);
  },
  preopOpAgregar() {
    const b = Preop.borrador, id = Preop.nuevoId('o');
    if (b.opciones.length >= 5) return;
    b.opciones.push({ id, boton: '', nombre: '', color: '#64748b', cuenta: 'novedad' });
    Router.pintar(true);
    const inp = $('[data-pe-op="boton"][data-o="' + id + '"]');
    if (inp) inp.focus();
  },
  preopColoresBase() {
    Preop.borrador.colores = Object.assign({}, Preop.COLORES);
    Router.pintar(true);
  }
});

  /* La conexión es la de la plataforma (NUBE, en §N), con la llave pública:

  const miles = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const Local = {

      const d = new Date(new Date(ts).getTime() - 5 * 3600000);
      if (isNaN(d)) return '';
      const h = d.getUTCHours();
      return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear() + ' ' +

  const pide = k => { const c = campo(k); return c.mostrar && c.obligatorio; };

  /* Las respuestas de cada ítem (los botones) y los colores también salen del
     formato. «cuenta» dice qué es cada respuesta: bien, novedad, novedad grave
     o no aplica. Los colores de siempre son los de SINUGRAVAS. */
  const OPCIONES_BASE = [
    { id: 'B', boton: 'B', nombre: 'Bueno', color: '#16a34a', cuenta: 'bien' },
    { id: 'R', boton: 'R', nombre: 'Regular', color: '#ea580c', cuenta: 'novedad' },
    { id: 'M', boton: 'M', nombre: 'Malo', color: '#dc2626', cuenta: 'grave' },
    { id: 'N/A', boton: 'N/A', nombre: 'No aplica', color: '#7c3aed', cuenta: 'no_aplica' }
  ];
  const COLORES_BASE = { principal: '#20449a', oscuro: '#193680', acento: '#e8830e' };
  const opcionesDe = f => (f && Array.isArray(f.opciones) && f.opciones.length ? f.opciones : OPCIONES_BASE);
  const coloresDe = f => Object.assign({}, COLORES_BASE, (f && f.colores) || {});
  const hexRgb = h => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(h || '').trim()), n = m ? parseInt(m[1], 16) : 0x20449a;
    return [n >> 16, (n >> 8) & 255, n & 255];
  };
  const hexDe = c => '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const oscurecer = (h, k) => hexDe(hexRgb(h).map(v => v * (1 - k)));
  const rgba = (h, a) => 'rgba(' + hexRgb(h).join(',') + ',' + a + ')';
  /* El mismo color con otra luz (0 negro, 1 blanco): conserva el tono y la
     saturación (sat la baja), así los azules claros siguen siendo de la marca */
  const tinte = (h, luz, sat) => {
    const [r, g, b] = hexRgb(h).map(v => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l0 = (mx + mn) / 2;
    const tono = !d ? 0 : mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    const s = (d ? d / (1 - Math.abs(2 * l0 - 1)) : 0) * (sat == null ? 1 : sat);
    const c = (1 - Math.abs(2 * luz - 1)) * s, x = c * (1 - Math.abs(tono % 2 - 1)), m = luz - c / 2;
    const t = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][Math.floor(tono) % 6];
    return hexDe(t.map(v => (v + m) * 255));
  };
  const unidad = id => D.unidades.find(u => u.id === id);
  const conductor = id => D.conductores.find(c => c.id === id);
  const claseDe = u => u.clase || TIPOS[u.tipo] || 'Vehículo';
  /* En el sistema, un conductor sin cédula queda con «—» */
  const cedulaDe = c => (c && c.cedula && c.cedula !== '—' ? c.cedula : '');
  /* «1000000001» → «1.000.000.001» */
  const cedulaTxt = c => (/^\d+$/.test(c || '') ? miles(c) : c || '');
  /* «THX523» → «THX 523», como se ve en el sistema */
  const placaTxt = p => (/^[A-Z]{3}\d{3}$/.test(p || '') ? p.slice(0, 3) + ' ' + p.slice(3) : p || '');
  /* «1026800.5» → «1.026.800,5» */
  const kmTxt = v => { const [a, b] = String(v).split('.'); return miles(a) + (b ? ',' + b : ''); };
  /* «Conductor de Prueba» → «CP»: la primera y la última palabra, sin «de», «la»… */
  const iniciales = n => {
    const p = String(n || '').split(/\s+/).filter(x => x && !/^(de|del|la|las|los|y)$/i.test(x));
    return (p.length > 1 ? p[0].charAt(0) + p[p.length - 1].charAt(0) : p.length ? p[0].slice(0, 2) : '').toUpperCase();
  };
  /* El número de cada sección sale de su orden; si el título trae uno, se quita */
  const tituloDe = s => String(s.titulo || '').replace(/^\s*\d+\s*[.)-]\s*/, '');
  const opcion = id => opcionesDe(D.formato).find(o => o.id === id);
  const esNovedad = id => { const o = opcion(id); return Boolean(o && (o.cuenta === 'novedad' || o.cuenta === 'grave')); };
  /* «sábado, 24 de octubre de 2026» y «22 oct» (con el año si no es este) */
  const fechaLarga = iso => { const d = new Date(iso + 'T12:00:00'); return DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear(); };
  const fechaCorta = iso => {
    const d = new Date(iso + 'T12:00:00');
    return d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3) + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
  };
  const BOTON = ['Siguiente: verificación ›', 'Siguiente: firma ›', 'Enviar preoperacional'];
  let tocado = false, paso = 1;

  function opciones(sel, primera, lista) {
    sel.innerHTML = '<option value="">' + esc(primera) + '</option>' +
      lista.map(o => '<option value="' + esc(o.v) + '">' + esc(o.t) + '</option>').join('');
  }

  /* ==========================================================================
     PASO 1: vehículo y conductor
     ========================================================================== */
  function pintarFormulario() {
    const f = D.formato, col = coloresDe(f), raiz = document.documentElement.style;
    /* Los colores del formato: los claros salen del principal, con su mismo tono */
    raiz.setProperty('--azul', col.principal);
    raiz.setProperty('--azul-osc', col.oscuro);
    raiz.setProperty('--naranja', col.acento);
    raiz.setProperty('--azul-prof', oscurecer(col.oscuro, 0.25));
    raiz.setProperty('--azul-cl', tinte(col.principal, 0.898));
    raiz.setProperty('--azul-cl2', tinte(col.principal, 0.957));
    raiz.setProperty('--azul-linea', tinte(col.principal, 0.84, 0.8));
    raiz.setProperty('--azul-ring', rgba(col.principal, 0.14));
    $('apCod').textContent = f.codigo + ' · v' + f.version;

    opciones($('placa'), D.unidades.length ? 'Seleccionar placa…' : 'No hay vehículos registrados', D.unidades.map(u => ({ v: u.id, t: u.placa })));
    opciones($('tipoVeh'), 'Seleccionar…', [...new Set(D.unidades.map(claseDe))].map(c => ({ v: c, t: c })));
    /* El conductor se escoge por el nombre; si el nombre no se muestra, por la cédula */
    const porNombre = campo('nombre').mostrar, cs = D.conductores, sin = cs.length ? '' : 'No hay conductores registrados';
    opciones($('cond'), sin || 'Seleccionar…', cs.map(c => ({ v: c.id, t: porNombre ? c.nombre : cedulaTxt(cedulaDe(c)) || 'Sin cédula · ' + c.nombre })));
    opciones($('catLic'), '—', CATEGORIAS.map(k => ({ v: k, t: k })));

    /* Lo que se muestra y lo obligatorio (con *), como quedó en el sistema */
    const ver = k => campo(k).mostrar, et = k => CAMPOS[k].nombre + (pide(k) ? ' *' : '');
    ['placa', 'kilometraje', 'licencia', 'categoria', 'vigencia', 'observaciones'].forEach(k => {
      $(CAMPOS[k].caja).hidden = !ver(k);
      $(CAMPOS[k].lb).textContent = et(k);
    });
    /* El tipo sale de la placa; se pregunta solo si la placa no se muestra */
    $('cTipo').hidden = !ver('tipo') || ver('placa');
    $('lbTipo').textContent = et('tipo');
    $('cCond').hidden = !ver('nombre') && !ver('documento');
    $('lbCond').textContent = porNombre ? et('nombre') : et('documento');
    const mini = ['licencia', 'categoria', 'vigencia'].filter(ver).length;
    $('condMini').hidden = !mini;
    $('tjVeh').hidden = !ver('placa') && !ver('tipo') && !ver('kilometraje');
    $('tjCond').hidden = $('cCond').hidden && !mini;
    $('nCond').textContent = $('tjVeh').hidden ? '1' : '2';

    const hoy = Fecha.hoy();
    $('fecha').min = Fecha.sumar(hoy, -60);
    $('fecha').max = Fecha.sumar(hoy, 1);
    $('fecha').value = hoy;
    $('lbFecha').textContent = et('fecha');
    $('fechaCambiar').hidden = !ver('fecha');
    $('cFecha').hidden = true;
    pintarFecha();

    $('supLinea').hidden = !f.supervisor;
    $('supNom').textContent = f.supervisor || '';
    $('supAv').textContent = iniciales(f.supervisor) || 'SV';
    pintarLista();
    elegirPlaca('');
    elegirConductor('');
  }

  function pintarFecha() {
    const t = fechaLarga(campo('fecha').mostrar && $('fecha').value ? $('fecha').value : Fecha.hoy());
    $('fechaTxt').textContent = t.charAt(0).toUpperCase() + t.slice(1);
  }

  /* El tipo del vehículo: el de la placa escogida o, si no hay placa, el que se escoja */
  function tipoActual() {
    if (campo('placa').mostrar) { const u = unidad($('placa').value); return u ? claseDe(u) : ''; }
    return campo('tipo').mostrar ? $('tipoVeh').value : '';
  }

  function elegirPlaca(id) {
    const u = unidad(id), caja = $('vehRes');
    caja.hidden = !u;
    if (u) {
      caja.innerHTML = '<span class="placa">' + esc(placaTxt(u.placa)) + '</span><div><b>' + esc(claseDe(u)) + '</b><span>' +
        (u.km != null ? 'Último kilometraje: ' + kmTxt(u.km) + ' km' + (u.km_fecha ? ' · ' + fechaCorta(u.km_fecha) : '') : 'Todavía no tiene kilometraje registrado') + '</span></div>';
    }
    ayudaKm();
    pintarSub();
  }

  /* Debajo del kilometraje: cuánto subió desde la última lectura */
  function ayudaKm() {
    const u = campo('placa').mostrar ? unidad($('placa').value) : null, v = $('km').value.trim(), a = $('kmAyuda');
    a.hidden = !(u && u.km != null && v !== '' && !isNaN(Number(v)));
    if (a.hidden) return;
    const dif = Number(v) - Number(u.km);
    a.className = 'ayuda' + (dif < 0 || dif > 5000 ? ' mal' : '');
    a.textContent = dif < 0 ? 'Es menor que la última lectura (' + kmTxt(u.km) + ' km). Revíselo.'
      : dif > 5000 ? miles(dif) + ' km más que la última lectura. Revise que esté bien.' : miles(dif) + ' km más que la última lectura.';
  }

  /* Al escoger el conductor se llena todo lo suyo */
  function elegirConductor(id) {
    const c = conductor(id), caja = $('condRes');
    $('cond').value = c ? id : '';
    caja.hidden = !c;
    if (c) {
      const vence = c.licencia_vence;
      caja.innerHTML = '<span class="av">' + esc(iniciales(c.nombre)) + '</span><div class="cond-t"><b>' + esc(c.nombre) + '</b>' +
        (campo('documento').mostrar && cedulaDe(c) ? '<span>CC ' + esc(cedulaTxt(cedulaDe(c))) + '</span>' : '') + '</div>' +
        (vence ? (vence < Fecha.hoy() ? '<span class="pill mal">Licencia vencida</span>' : '<span class="pill ok">Licencia vigente</span>') : '');
    }
    $('licencia').value = cedulaDe(c);
    const cat = c && c.categoria ? String(c.categoria).toUpperCase() : '';
    if (cat && ![...$('catLic').options].some(o => o.value === cat)) $('catLic').add(new Option(cat, cat));
    $('catLic').value = cat;
    $('vigLic').value = c && c.licencia_vence ? c.licencia_vence : '';
    pintarSub();
  }

  /* Debajo de SINUGRAVAS: la placa y el conductor, desde el paso 2 */
  function pintarSub() {
    const u = campo('placa').mostrar ? unidad($('placa').value) : null, c = conductor($('cond').value);
    const t = [u ? placaTxt(u.placa) : '', c ? c.nombre : ''].filter(Boolean).join(' · ');
    $('apSub').textContent = paso > 1 && t ? t : 'Inspección preoperacional';
  }

  /* ==========================================================================
     PASO 2: la verificación, por secciones que se abren y se cierran
     ========================================================================== */
  function pintarLista() {
    const ops = opcionesDe(D.formato);
    Object.keys(ST).forEach(k => { delete ST[k]; });
    Object.keys(NOTAS).forEach(k => { delete NOTAS[k]; });
    $('secciones').innerHTML = (D.formato.secciones || []).map((s, i) => {
      (s.items || []).forEach(it => { ST[it.id] = null; });
      return '<div class="sec' + (i === 0 ? ' abierta' : '') + '">' +
        '<button type="button" class="sec-h"><span class="n">' + (i + 1) + '</span><span class="t">' + (i + 1) + '. ' + esc(tituloDe(s)) + '</span>' +
          '<span class="cta"></span></button>' +
        '<div class="sec-b">' + (s.items || []).map((it, j) => '<div class="it">' +
          '<div class="it-t"><span>' + (i + 1) + '.' + (j + 1) + '</span>' + esc(it.texto) + '</div>' +
          '<div class="res" style="grid-template-columns:repeat(' + ops.length + ',1fr)">' + ops.map(o => '<button type="button" data-i="' + esc(it.id) +
            '" data-v="' + esc(o.id) + '" style="--c:' + esc(o.color) + '" aria-label="' + esc(o.nombre) + '">' + esc(o.boton) + '</button>').join('') + '</div>' +
          '<div class="nota" hidden><small>¿Qué se ve?</small><input data-nota="' + esc(it.id) + '" maxlength="300" placeholder="Escriba qué se ve (opcional)" autocomplete="off"></div>' +
        '</div>').join('') + '</div></div>';
    }).join('');
    contar();
  }

  const completa = sec => [...sec.querySelectorAll('.res')].every(r => r.querySelector('button.on'));

  function responder(b) {
    const id = b.dataset.i, val = b.dataset.v, it = b.closest('.it'), sec = b.closest('.sec'), antes = completa(sec);
    it.querySelectorAll('.res button').forEach(x => x.classList.remove('on'));
    ST[id] = ST[id] === val ? null : val;
    if (ST[id]) b.classList.add('on');
    /* En una novedad se puede escribir qué se ve */
    it.querySelector('.nota').hidden = !esNovedad(ST[id]);
    tocado = true;
    contar();
    /* Al terminar una sección se pasa sola a la siguiente (si no queda una nota por escribir) */
    if (!antes && completa(sec) && !esNovedad(ST[id])) setTimeout(() => siguienteSeccion(sec), 280);
  }

  /* Baja hasta algo, sin que lo tape el encabezado */
  function llevarA(el) {
    const y = el.getBoundingClientRect().top + window.scrollY - document.querySelector('.ap-h').offsetHeight - 10;
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  }

  function siguienteSeccion(sec) {
    sec.classList.remove('abierta');
    const todas = [...document.querySelectorAll('#secciones .sec')];
    const sig = todas.slice(todas.indexOf(sec) + 1).concat(todas).find(s => !completa(s));
    if (sig) { sig.classList.add('abierta'); llevarA(sig); }
  }

  /* Lleva al primer ítem sin marcar, con su sección abierta */
  function irAlQueFalta() {
    const r = [...document.querySelectorAll('#secciones .res')].find(x => !x.querySelector('button.on'));
    if (!r) return;
    r.closest('.sec').classList.add('abierta');
    llevarA(r.closest('.it'));
  }

  /* Los contadores de cada sección, de arriba y de abajo */
  function contar() {
    const total = Object.keys(ST).length, hechos = Object.values(ST).filter(Boolean).length;
    document.querySelectorAll('#secciones .sec').forEach((s, i) => {
      const n = s.querySelectorAll('.res').length, k = s.querySelectorAll('.res button.on').length, lista = n > 0 && k === n;
      s.classList.toggle('lista', lista);
      s.querySelector('.n').textContent = lista ? '✓' : String(i + 1);
      s.querySelector('.cta').textContent = k + ' de ' + n;
    });
    $('pasoCnt').textContent = hechos + ' de ' + total;
    $('barraAvN').textContent = hechos + ' de ' + total + ' ítems';
    pintarPasos();
  }

  /* ==========================================================================
     PASO 3: revisar y firmar
     ========================================================================== */
  function pintarResumen() {
    const ops = opcionesDe(D.formato), n = {}, nov = [];
    Object.keys(ST).forEach(k => { if (ST[k]) n[ST[k]] = (n[ST[k]] || 0) + 1; });
    (D.formato.secciones || []).forEach((s, i) => (s.items || []).forEach((it, j) => {
      if (esNovedad(ST[it.id])) nov.push({ num: (i + 1) + '.' + (j + 1), t: it.texto, o: opcion(ST[it.id]), nota: (NOTAS[it.id] || '').trim() });
    }));
    const u = campo('placa').mostrar ? unidad($('placa').value) : null;
    const pill = (o, txt) => '<span class="pill" style="background:' + rgba(o.color, 0.13) + ';color:' + oscurecer(o.color, 0.35) + '">' + esc(txt) + '</span>';
    const sinMarcar = Object.values(ST).filter(v => !v).length;
    $('resumen').innerHTML = '<div class="resu">' + (u ? '<span class="placa peq">' + esc(placaTxt(u.placa)) + '</span>' : '') + '<b>Así queda</b></div>' +
      '<div class="chips">' + ops.filter(o => n[o.id]).map(o => pill(o, n[o.id] + ' ' + String(o.nombre).toLowerCase())).join('') +
        (sinMarcar ? '<span class="pill" style="background:#eef1f4;color:#4e5d6b">' + sinMarcar + ' sin marcar</span>' : '') + '</div>' +
      '<div class="novs">' + (nov.length ? nov.map(x => '<div class="nv"><span>' + x.num + '</span><em>' + esc(x.t) +
          (x.nota ? '<small>' + esc(x.nota) + '</small>' : '') + '</em>' + pill(x.o, x.o.nombre) + '</div>').join('')
        : '<div class="sin-nov">Sin novedades: ningún ítem quedó como novedad.</div>') + '</div>';
    const c = conductor($('cond').value);
    $('firmaNom').textContent = c ? c.nombre : '';
  }

  /* ==========================================================================
     Los pasos: la barra de arriba, el botón de abajo y el «atrás» del celular.
     Desde el paso 2 hay una entrada propia en el historial: el «atrás» del
     celular vuelve un paso en vez de salir de la página.
     ========================================================================== */
  let trampa = false;
  function pintarPasos() {
    const total = Object.keys(ST).length, hechos = Object.values(ST).filter(Boolean).length;
    const av = paso === 1 ? 45 : paso === 2 ? (total ? Math.round(hechos / total * 100) : 0) : (Firma.hay() ? 85 : 45);
    document.querySelectorAll('.pasos-b button').forEach((b, i) => {
      b.className = i + 1 < paso ? 'on' : i + 1 === paso ? 'medio' : '';
      b.style.setProperty('--av', av + '%');
    });
  }

  function irPaso(n) {
    paso = n;
    ['paso1', 'paso2', 'paso3'].forEach((p, i) => { $(p).hidden = i + 1 !== n; });
    $('pasoTxt').innerHTML = '<b>Paso ' + n + ' de 3</b> · ' + ['Vehículo y conductor', 'Verificación', 'Revisar y firmar'][n - 1];
    $('btnAtras').hidden = n === 1;
    $('btnSig').textContent = BOTON[n - 1];
    $('barraAv').hidden = n !== 2;
    if (n === 3) { pintarResumen(); setTimeout(() => Firma.medir(), 0); }
    pintarSub();
    pintarPasos();
    window.scrollTo(0, 0);
    if (n > 1 && !trampa) { history.pushState({ preop: 'paso' }, ''); trampa = true; }
  }

  async function siguiente() {
    if (paso === 1) { if (validarPaso1()) irPaso(2); return; }
    if (paso === 2) {
      const total = Object.keys(ST).length, faltan = Object.values(ST).filter(v => !v).length;
      if (faltan && await dialogo('Faltan ítems por marcar', '<p>Faltan ' + faltan + ' de ' + total + ' ítems. ¿Los revisa o sigue así?</p>', ['Revisar', 'Seguir así']) !== 1) {
        irAlQueFalta();
        return;
      }
      irPaso(3);
      return;
    }
    enviar();
  }
  /* ==========================================================================
     FIRMA. Se guarda cada trazo: si el celular cambia de tamaño (al bajar por
     la página aparece y se esconde la barra del navegador), la firma no se
     borra. Sale como JPEG, que pesa poco: tinta azul sobre blanco, como queda
     en el PDF.
     ========================================================================== */
  const Firma = {
    trazos: [], actual: null, ancho: 0, alto: 130,
    iniciar() {
      const cv = this.cv = $('canvasC');
      this.medir();
      cv.addEventListener('pointerdown', e => {
        e.preventDefault();
        try { cv.setPointerCapture(e.pointerId); } catch (x) { /* nada */ }
        this.actual = [this.punto(e)];
        this.trazos.push(this.actual);
        $('hintC').style.opacity = '0';
        tocado = true;
        this.dibujar();
      });
      cv.addEventListener('pointermove', e => {
        if (!this.actual) return;
        e.preventDefault();
        const varios = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
        (varios.length ? varios : [e]).forEach(x => this.actual.push(this.punto(x)));
        this.dibujar();
      });
      const fin = () => { this.actual = null; };
      cv.addEventListener('pointerup', fin);
      cv.addEventListener('pointercancel', fin);
      let t;
      window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => this.medir(), 150); });
    },
    punto(e) {
      const r = this.cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
    },
    /* Solo se rehace si cambió el ancho */
    medir() {
      const w = this.cv.parentElement.clientWidth;
      if (!w || w === this.ancho) return;
      const dpr = window.devicePixelRatio || 1;
      this.ancho = w;
      this.cv.width = Math.round(w * dpr);
      this.cv.height = Math.round(this.alto * dpr);
      this.cv.style.width = w + 'px';
      this.cv.style.height = this.alto + 'px';
      this.dibujar();
    },
    trazar(ctx, w, h, grosor) {
      ctx.strokeStyle = '#20449a';
      ctx.lineWidth = grosor;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      this.trazos.forEach(tr => {
        ctx.beginPath();
        tr.forEach((p, i) => { if (i) ctx.lineTo(p[0] * w, p[1] * h); else ctx.moveTo(p[0] * w, p[1] * h); });
        if (tr.length === 1) ctx.lineTo(tr[0][0] * w + 0.1, tr[0][1] * h);
        ctx.stroke();
      });
    },
    dibujar() {
      if (!this.ancho) return;
      const ctx = this.cv.getContext('2d'), k = this.cv.width / this.ancho;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, this.cv.width, this.cv.height);
      ctx.setTransform(k, 0, 0, k, 0, 0);

  /* ==========================================================================

  function nuevoId() {

  /* ==========================================================================

          y += h;

      });

      y += 2.6;

      // OBSERVACIONES: si son largas, siguen en la hoja siguiente
      if (ver('observaciones')) {

      if (e.firma) {

        try { doc.addImage(e.firma.url, 'JPEG', f1 + (fw - w) / 2, y + 3 + (21 - h) / 2, w, h); } catch (x) { /* sin firma */ }
      }
      dc(TI); doc.setLineWidth(0.22); doc.line(f1, ly, f1 + fw, ly); doc.line(f2, ly, f2 + fw, ly);
      bold(8); tc(TI);
      doc.text(linea(v.nombre || 'Conductor', fw), f1 + fw / 2, ly + 4.2, { align: 'center' });
      doc.text(linea(v.supervisor || 'Supervisor', fw), f2 + fw / 2, ly + 4.2, { align: 'center' });
      normal(6.8); tc(GC);
      doc.text(T('Conductor' + (v.documento ? ' · CC ' + cedulaTxt(v.documento) : '') + (e.firma ? ' · firmó en el celular' : ' · sin firma')), f1 + fw / 2, ly + 7.4, { align: 'center' });
      doc.text(T('Revisado por · firma y fecha al imprimir'), f2 + fw / 2, ly + 7.4, { align: 'center' });
      y = ly + 10;
      cerrarMarco();
      y += 2.6;

      // TRAZABILIDAD: dónde y cuándo llegó
      const u = ev.ubicacion, cel = ev.hora ? Fecha.colombia(ev.hora) : '';
      const traz = [['Recibido en el sistema', recibido],
        ['Hora en el celular', !cel ? '-' : cel.slice(0, 10) === recibido.slice(0, 10) ? cel.slice(11) : cel],

        ['Ubicación', u ? Number(u.lat).toFixed(5) + ', ' + Number(u.lng).toFixed(5) + (u.precision ? ' (± ' + u.precision + ' m)' : '') : 'Sin ubicación (no dio el permiso)'],
        ['Envío', e.id]];

      traz.forEach((c, i) => {
        const tx = ml + (i % 3) * cw3, ty = y + Math.floor(i / 3) * 8.2;
        bold(6); tc(O); doc.text(T(c[0].toUpperCase()), tx + 2, ty + 3);
        normal(7.4); tc(TI); doc.text(linea(c[1], cw3 - 4), tx + 2, ty + 6.6);
      });

      // En cada hoja: el número de la página y el pie con la trazabilidad
      const hojas = doc.getNumberOfPages(), pie = T(recibido + (e.ip ? ' · IP ' + e.ip : '') + ' · Envío ' + e.id.slice(0, 8));
      for (let p = 1; p <= hojas; p++) {
        doc.setPage(p);
        bold(7.5); tc(DK); doc.text(p + ' de ' + hojas, W - mr - 2.4, 9 + 15 + 3.4, { align: 'right' });
        dc(LN); doc.setLineWidth(0.22); doc.line(ml, 284, W - mr, 284);
        bold(6.4); tc(DK); doc.text('Recibido en el sistema', ml, 287.4);
        const x = ml + doc.getTextWidth('Recibido en el sistema ');
        normal(6.4); tc(GC); doc.text(pie, x, 287.4);
        doc.text(T('Generado por el Sistema de Gestión de Flota de SINUGRAVAS S.A.S. · flota.sinugravas.com'), ml, 290.6);
        bold(7); tc(DK); doc.text(T('Página ' + p + ' de ' + hojas), W - mr, 290.6, { align: 'right' });

    nombre: e => 'INSPECCION_' + (e.vista.placa || 'SIN-PLACA') + '_' + e.vista.fecha + '.pdf'
  };

  const aBase64 = bytes => {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
  const deBase64 = b64 => { const s = atob(b64), b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };
  async function sha256(bytes) {
    const h = await crypto.subtle.digest('SHA-256', bytes);
    return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join('');
  }

  /* ==========================================================================
     LA COLA del celular. Cada envío pasa por tres pasos y se guarda en el
     celular después de cada uno, así nada se pierde si se va la señal:
       enviar → el sistema lo recibe (con hora del servidor e IP)
       pdf    → se arma el PDF con esa hora
       subir  → suben la firma y el PDF, y el sistema los confirma
     ========================================================================== */
  const PDFS = new Map();   // los PDF ya armados, para descargarlos sin volver a armarlos
  const Cola = {
    CLAVE: 'preop.pendientes',
    lista: [],
    corriendo: null,
    otraVez: false,
    cargar() { this.lista = (Local.leer(this.CLAVE, []) || []).filter(e => e && e.id && e.p && e.vista); },
    guardar() { return Local.poner(this.CLAVE, this.lista); },
    agregar(e) { this.lista.push(e); this.guardar(); Avisos.pintar(); },
    quitar(id) { this.lista = this.lista.filter(e => e.id !== id); this.guardar(); },

    /* Una sola pasada a la vez. Si piden otra mientras tanto, se hace al final
       y quien la pidió espera hasta ahí */
    procesar() {
      if (this.corriendo) { this.otraVez = true; return this.corriendo; }
      this.corriendo = (async () => {
        do {
          this.otraVez = false;
          Avisos.pintar();
          await this.pasada();
        } while (this.otraVez);
      })().finally(() => { this.corriendo = null; Avisos.pintar(); });
      return this.corriendo;
    },
    async pasada() {
      for (const e of this.lista.slice()) {
        try {
          e.error = '';
          await this.uno(e);
        } catch (err) {
          e.error = err.red ? 'sin señal' : err.message;
          e.intentos = (e.intentos || 0) + 1;
          /* Pasados tres días, el sistema ya no deja subir los archivos */
          if (e.etapa !== 'enviar' && Date.now() - e.creado > 3 * 86400000) { this.quitar(e.id); continue; }
          this.guardar();
        }
      }
    },

    async uno(e) {
      if (e.etapa === 'enviar') {
        const p = Object.assign({ id: e.id }, e.p);
        if (e.intentos) p.evidencia = Object.assign({}, p.evidencia, { sin_senal: 'true' });
        const r = await Nube.rpc('preop_enviar', { p }, 30000);
        if (!r || !r.ok) {
          this.quitar(e.id);
          Pantalla.rechazado(e, (r && r.motivo) || 'El sistema no lo recibió.');
          return;
        }
        e.recibido = r.recibido;
        e.ip = r.ip || '';
        e.etapa = 'pdf';
        this.guardar();
        Pantalla.avanzo(e);
      }
      if (e.etapa === 'pdf') {
        const bytes = await Pdf.generar(e);
        PDFS.set(e.id, bytes);
        e.hash = await sha256(bytes);
        e.pdf = aBase64(bytes);
        e.etapa = 'subir';
        this.guardar();
        Pantalla.avanzo(e);
      }
      if (e.etapa === 'subir') {
        let fallo = null;
        try {
          if (e.firma && !e.firmaArriba) {
            await Nube.subir('preoperacional/' + e.id + '/firma.jpg', deBase64(e.firma.url.split(',')[1]), 'image/jpeg');
            e.firmaArriba = true;
            this.guardar();
          }
          await Nube.subir('preoperacional/' + e.id + '/inspeccion.pdf', deBase64(e.pdf), 'application/pdf');
        } catch (err) {
          if (err.red) throw err;
          fallo = err;   // quizá ya se había confirmado antes: se pregunta abajo
        }
        const r = await Nube.rpc('preop_archivos', { p_id: e.id, p_pdf_hash: e.hash }, 30000);
        if (!r || !r.ok) throw fallo || new Error((r && r.motivo) || 'No se confirmaron los archivos');
        e.etapa = 'listo';
        this.quitar(e.id);
        Pantalla.avanzo(e);
      }
    }
  };

  /* El aviso de arriba cuando hay envíos que no han terminado */
  const Avisos = {
    pintar() {
      const l = Cola.lista, caja = $('pendientes');
      caja.hidden = !l.length;
      if (!l.length) return;
      const quien = l.map(e => esc(e.vista.placa ? placaTxt(e.vista.placa) : 'Sin placa') + ' del ' + Fecha.dmy(e.vista.fecha)).join(', ');
      const solo = l.every(e => e.etapa !== 'enviar');
      $('pendTxt').innerHTML = '<b>' + (l.length === 1 ? 'Un preoperacional' : l.length + ' preoperacionales') + ' sin terminar de enviar</b> (' + quien + '). ' +
        (solo ? 'Ya llegó al sistema; falta subir el PDF. ' : 'Quedó guardado en este celular. ') +
        'Se envía solo apenas haya señal: con esta página abierta, o la próxima vez que la abra.';
      $('pendBtn').disabled = !!Cola.corriendo;
      $('pendBtn').textContent = Cola.corriendo ? 'Enviando…' : 'Reintentar';
    }
  };

  /* ==========================================================================
     Pantallas: cargando, el formulario (en tres pasos) y «enviado»
     ========================================================================== */
  const Pantalla = {
    actual: 'cargando',
    envio: null,   // el envío que se muestra en «enviado»
    ver(cual) {
      this.actual = cual;
      const form = cual === 'form';
      $('cargando').hidden = cual !== 'cargando';
      $('cargaError').hidden = cual !== 'error';
      $('listo').hidden = cual !== 'listo';
      $('pasos').hidden = !form;
      $('barra').hidden = !form;
      $('apFila').hidden = cual === 'listo';
      ['paso1', 'paso2', 'paso3'].forEach((p, i) => { $(p).hidden = !form || i + 1 !== paso; });
      document.body.classList.toggle('blanco', cual === 'listo');
      if (!form) $('apSub').textContent = 'Inspección preoperacional';
    },
    mostrar(e) {
      this.envio = e;
      const llego = e.etapa !== 'enviar', v = e.vista, R = e.p.respuestas || {}, ops = opcionesDe({ opciones: v.opciones });
      const nov = Object.keys(R).filter(k => { const o = ops.find(x => x.id === R[k]); return o && (o.cuenta === 'novedad' || o.cuenta === 'grave'); }).length;
      $('listoIc').className = 'ok-ic' + (llego ? '' : ' esp');
      $('listoIc').innerHTML = llego ? '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' : '📤';
      $('listoTit').textContent = llego ? 'Preoperacional enviado' : 'Quedó guardado en el celular';
      $('listoTxt').textContent = llego ? 'Quedó registrado en el Sistema de Gestión de Flota.'
        : (e.error && e.error !== 'sin señal' ? 'El sistema no lo recibió todavía (' + e.error + '). ' : 'No hay señal en este momento. ') +
          'Se envía solo apenas se pueda: con esta página abierta, o la próxima vez que la abra.';
      const filas = [];
      if (v.placa) filas.push(['Vehículo', '<span class="placa peq">' + esc(placaTxt(v.placa)) + '</span>']);
      else if (v.tipo) filas.push(['Vehículo', esc(v.tipo)]);
      filas.push(['Fecha', esc(Fecha.dmy(v.fecha))]);
      if (v.nombre) filas.push(['Conductor', esc(v.nombre)]);
      filas.push(['Resultado', nov ? nov + (nov === 1 ? ' novedad' : ' novedades') : 'Sin novedades']);
      if (llego) filas.push(['Recibido', esc(Fecha.colombia(e.recibido).replace(/^\S+ /, '')) + ' · hora del sistema']);
      $('listoDatos').innerHTML = filas.map(f => '<div class="fila"><span>' + f[0] + '</span><b>' + f[1] + '</b></div>').join('');
      const falta = llego && e.etapa !== 'listo';
      $('listoNota').hidden = !falta;
      $('listoNota').textContent = falta ? 'El PDF termina de subir al sistema apenas haya señal.' : '';
      const bytes = PDFS.get(e.id) || (e.pdf ? deBase64(e.pdf) : null), a = $('listoPdf');
      if (a.href && a.href.startsWith('blob:')) URL.revokeObjectURL(a.href);
      a.hidden = !bytes;
      if (bytes) {
        a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        a.download = Pdf.nombre(e);

      window.scrollTo(0, 0);
    },
    /* Un envío avanzó: si es el que está en pantalla, se actualiza; si no, un aviso */
    avanzo(e) {
      if (this.actual === 'listo' && this.envio && this.envio.id === e.id) { this.mostrar(e); return; }
      if (e.etapa === 'listo' && e.id !== enviandoId) showToast('✅ Se envió el preoperacional ' + (e.vista.placa ? 'de ' + placaTxt(e.vista.placa) + ' ' : '') + 'del ' + Fecha.dmy(e.vista.fecha));
    },
    rechazado(e, motivo) {
      if (e.id === enviandoId) { motivoRechazo = motivo; return; }
      if (this.actual === 'listo' && this.envio && this.envio.id === e.id) this.ver('form');
      aviso('No se pudo enviar el preoperacional ' + (e.vista.placa ? 'de ' + placaTxt(e.vista.placa) + ' ' : '') + 'del ' + Fecha.dmy(e.vista.fecha), motivo);
    }
  };

  // TOAST
  function showToast(msg, type) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'show' + (type === 'err' ? ' err' : '');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ''; }, 5000);
  }

  function dialogo(titulo, cuerpo, botones) {
    return new Promise(listo => {
      const bd = document.createElement('div');
      bd.className = 'dlg-bd';
      bd.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><h3>' + esc(titulo) + '</h3>' + cuerpo + '<div class="dlg-btns">' +
        botones.map((b, i) => '<button type="button" class="' + (i === botones.length - 1 ? 'pri' : '') + '" data-r="' + i + '">' + esc(b) + '</button>').join('') +
        '</div></div>';
      bd.addEventListener('click', ev => {
        const b = ev.target.closest('[data-r]');
        if (!b && ev.target !== bd) return;
        bd.remove();
        listo(b ? +b.dataset.r : -1);
      });
      document.body.appendChild(bd);
      bd.querySelector('button.pri').focus();

  }
  const aviso = (titulo, texto) => dialogo(titulo, '<p>' + esc(texto) + '</p>', ['Entendido']);

  /* ==========================================================================
     Revisar antes de seguir y antes de enviar
     ========================================================================== */
  /* Lo obligatorio del paso 1. Si falta algo, se dice qué y se lleva ahí. */
  function validarPaso1() {
    const falta = (k, el, txt) => {
      if (paso !== 1) irPaso(1);
      showToast('⚠️ ' + (txt || 'Falta: ' + CAMPOS[k].nombre), 'err');
      setTimeout(() => { if (el) el.focus(); }, 60);
      return false;
    };
    if (pide('placa') && !$('placa').value) return falta('placa', $('placa'));
    if (pide('tipo') && !tipoActual()) return campo('placa').mostrar ? falta('placa', $('placa')) : falta('tipo', $('tipoVeh'));
    if (campo('fecha').mostrar) {
      const f = $('fecha').value, hoy = Fecha.hoy();
      if (!f && pide('fecha')) { $('cFecha').hidden = false; return falta('fecha', $('fecha')); }
      if (f && (f > Fecha.sumar(hoy, 1) || f < Fecha.sumar(hoy, -60))) { $('cFecha').hidden = false; return falta('fecha', $('fecha'), 'La fecha de inspección no es válida'); }
    }
    if (campo('kilometraje').mostrar) {

      if (!v && pide('kilometraje')) return falta('kilometraje', km);
    }
    if ((pide('documento') || pide('nombre')) && !$('cond').value) return falta(campo('nombre').mostrar ? 'nombre' : 'documento', $('cond'));
    if (pide('licencia') && !$('licencia').value.trim()) return falta('licencia', $('licencia'));
    if (pide('categoria') && !$('catLic').value) return falta('categoria', $('catLic'));
    if (pide('vigencia') && !$('vigLic').value) return falta('vigencia', $('vigLic'));
    return true;
  }

  function validar() {
    if (!validarPaso1()) return false;
    if (pide('observaciones') && !$('obs').value.trim()) { showToast('⚠️ Falta: Observaciones', 'err'); $('obs').focus(); return false; }
    return true;
  }

  /* Lo que puede ser un error. Se avisa, pero el conductor decide si envía */
  function avisos() {
    const l = [];
    const total = Object.keys(ST).length, faltan = Object.values(ST).filter(v => !v).length;
    if (faltan) l.push(faltan === total ? 'No ha marcado ningún ítem de la verificación.' : 'Faltan ' + faltan + ' de ' + total + ' ítems por marcar.');
    if (!Firma.hay()) l.push('No ha firmado.');
    const u = campo('placa').mostrar ? unidad($('placa').value) : null, km = $('km').value.trim();
    if (u && u.km != null && km !== '' && campo('kilometraje').mostrar) {
      const nuevo = Number(km), ultimo = Number(u.km), cuando = u.km_fecha ? ' el ' + Fecha.dmy(u.km_fecha) : '';
      if (nuevo < ultimo) l.push('El kilometraje (' + kmTxt(km) + ') es menor que el último registrado para ' + placaTxt(u.placa) + ': ' + kmTxt(u.km) + ' km' + cuando + '.');
      else if (nuevo - ultimo > 5000) l.push('El kilometraje (' + kmTxt(km) + ') está ' + miles(nuevo - ultimo) + ' km por encima del último registrado para ' + placaTxt(u.placa) + ' (' + kmTxt(u.km) + ' km' + cuando + ').');
    }
    const vig = $('vigLic').value, f = campo('fecha').mostrar && $('fecha').value ? $('fecha').value : Fecha.hoy();
    if (vig && vig < f && campo('vigencia').mostrar) l.push('La licencia de conducción aparece vencida desde el ' + Fecha.dmy(vig) + '.');
    if (campo('fecha').mostrar && f !== Fecha.hoy()) l.push('La fecha de la inspección (' + Fecha.dmy(f) + ') no es la de hoy.');
    return l;
  }

  // ENVIAR
  let enviandoId = null, motivoRechazo = null;
  async function enviar() {
    if (enviandoId || !validar()) return;
    const av = avisos();
    if (av.length && await dialogo('Antes de enviar, revise', '<ul>' + av.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>', ['Revisar', 'Enviar así']) !== 1) return;
    const btn = $('btnSig');
    btn.disabled = true;
    $('btnAtras').disabled = true;
    btn.textContent = 'Enviando…';
    enviandoId = nuevoId();
    motivoRechazo = null;
    try {
      const [ubic, cel] = await Promise.all([Ubicacion.obtener(8000), celular()]);
      const ver = k => campo(k).mostrar, f = D.formato;
      /* Lo que no se muestra no se manda: sin placa ni conductor, si así quedó el formato */
      const u = ver('placa') ? unidad($('placa').value) : null;
      const c = ver('documento') || ver('nombre') ? conductor($('cond').value) : null;
      /* Las respuestas, y la nota de cada novedad que la tenga */
      const respuestas = {}, notas = {};
      Object.keys(ST).forEach(k => {
        if (!ST[k]) return;
        respuestas[k] = ST[k];
        const t = (NOTAS[k] || '').trim();
        if (t && esNovedad(ST[k])) notas[k] = t.slice(0, 300);
      });
      const datos = {
        fecha: ver('fecha') && $('fecha').value ? $('fecha').value : Fecha.hoy(),
        kilometraje: ver('kilometraje') ? $('km').value.trim() : '',
        tipo_vehiculo: tipoActual(),
        licencia: ver('licencia') ? $('licencia').value.trim() : '',
        categoria: ver('categoria') ? $('catLic').value : '',
        vigencia_licencia: ver('vigencia') ? $('vigLic').value : '',
        observaciones: ver('observaciones') ? $('obs').value.trim() : ''
      };
      const e = {
        id: enviandoId, etapa: 'enviar', intentos: 0, creado: Date.now(),
        p: Object.assign({ unidad_id: u ? u.id : '', conductor_id: c ? c.id : '', respuestas, notas }, datos, {
          evidencia: { celular: cel, hora: Fecha.conZona(new Date()), ubicacion: ubic ? { lat: ubic.lat, lng: ubic.lng, precision: ubic.precision } : undefined }

  _ids() {

      (Datos[k] || []).forEach(x => { if (!x.id) x.id = p + marca().toString(36) + Math.random().toString(36).slice(2, 6); }));

  /* Cada fila de cada tabla, como texto para comparar */

  cambios() {

    this.ORDEN.forEach(t => {

      quita[t] = [];
      hoy.forEach(([txt, fila], id) => { if (antes.get(id) !== txt) { sube[t].push(fila); n++; } });
      antes.forEach((txt, id) => { if (!hoy.has(id)) { quita[t].push(id); n++; } });

  _fijarTodo() {

  async traer(avance) {
    const filas = {}, cola = this.ORDEN.slice();
    let listas = 0;
    const trabajar = async () => {
      while (cola.length) {
        const t = cola.shift();
        filas[t] = await Nube.leerTodo(t, this.CLAVE[t]);
        listas++;
        if (avance) avance(listas, this.ORDEN.length);

    await Promise.all([trabajar(), trabajar(), trabajar(), trabajar()]);
    return filas;
  },

  async cargar(avance) {

    this.sucio = false;

    if (!c.n) { this.error = null; this.pintarEstado(); return; }
    this.ocupado = true;

      const m = this.ultimo[t] = this.ultimo[t] || new Map(), k = this.CLAVE[t] || 'id';
      filas.forEach(f => m.set(f[k], c.ahora[t].get(f[k])[0]));
      quitados.forEach(id => m.delete(id));
    };
    try {
      for (const t of this.ORDEN) {
        for (const lote of enLotes(c.sube[t], 500)) {
          await Nube.guardarFilas(t, lote, this.CLAVE[t]);

        }

      for (const t of this.ORDEN.slice().reverse()) {
        for (const lote of enLotes(c.quita[t], 100)) {

  pendiente() { return Boolean(Nube.pendientes() || this.ocupado || this.error || (this.activo && this.cambios().n)); },
  /* Al volver a la pestaña: si en otro equipo se cambió algo, se trae. Si aquí
     hay algo sin subir, primero se sube. */
  /* ¿Ya es otro día que cuando se abrió la plataforma? */
  diaViejo: () => Fecha.iso(new Date()) !== hoyISO,
  async revisar() {
    if (!this.activo || this.ocupado || this._revisando || Modal.abierto()) return;
    if (this.cambios().n) return this.ciclo(true);
    /* Si quedó abierta de un día para otro, se recarga para que las fechas (y
       el mes de los comparendos) queden al día. Ya no hay nada sin guardar. */
    if (this.diaViejo() && !Nube.pendientes()) { location.reload(); return; }
    /* Como mucho cada 15 segundos, aunque se vaya y se vuelva seguido */
    if (Date.now() - (this._revisado || 0) < 15000) return;
    this._revisado = Date.now();
    this._revisando = true;
    try {
      const filas = await this.traer();
      if (this.ocupado || Modal.abierto() || this.cambios().n) return;
      const r = Mapa.aDatos(filas), f = this._fotos(Mapa.aFilas(r.datos, r.config));
      const igual = this.ORDEN.every(t => f[t].size === (this.ultimo[t] || new Map()).size &&
        Array.from(f[t]).every(([id, par]) => this.ultimo[t].get(id) === par[0]));
      if (igual) return;
      Mapa.poner(r);
      Nube.conocerDeDatos();
      this._fijarTodo();
      Comparendos.alDia();
      Router.pintar(true);
      Guardadas.aplicar().then(n => { if (n) Router.pintar(true); });
    } catch (e) {
      if (e.sesion) Sesion.recuperar();
    } finally { this._revisando = false; }
  },
  vigilar() {
    this.activo = true;
    setInterval(() => this.ciclo(), 1500);
    /* Por si algo cambió sin un clic de por medio */
    setInterval(() => { this.sucio = true; }, 15000);
    /* Abierta toda la noche sin tocarla: al cambiar el día se recarga sola */
    setInterval(() => { if (this.diaViejo() && !this.pendiente() && !Modal.abierto()) location.reload(); }, 10 * 60000);
    ['click', 'change', 'input', 'drop', 'keyup'].forEach(ev => document.addEventListener(ev, () => { this.sucio = true; }, true));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') this.ciclo(true); else this.revisar(); });
    window.addEventListener('focus', () => this.revisar());
    window.addEventListener('online', () => { this.espera = 0; this.ciclo(true); Nube._trabajar(); });
    /* Si queda algo sin subir, el navegador pregunta antes de cerrar */
    window.addEventListener('beforeunload', e => { if (this.pendiente()) { e.preventDefault(); e.returnValue = ''; } });
  },
  /* El aviso de arriba: guardado, guardando o pendiente */
  pintarEstado() {
    const el = $('#estadoNube');
    if (!el) return;
    const subiendo = Nube.pendientes(), err = this.error || (subiendo && Nube.error);
    let cls = '', ic = Icon('nube', '', 13), txt = 'Guardado en la nube', tit = 'Todo quedó guardado en la nube y se ve igual desde cualquier equipo.';
    if (err) {
      cls = 'pendiente';
      ic = Icon('warn', '', 13);
      txt = err.red ? 'Sin conexión' : 'Sin guardar';
      tit = (err.red ? 'No hay conexión con el servidor.' : 'No se pudo guardar: ' + err.message + '.') +
        ' Lo hecho sigue aquí y se guarda solo cuando se pueda. No cierre esta pestaña.';
    } else if (this.ocupado || subiendo) {
      cls = 'guardando';
      ic = '<span class="spin"></span>';
      txt = subiendo ? 'Subiendo ' + (subiendo === 1 ? 'un archivo' : subiendo + ' archivos') + '…' : 'Guardando…';
      tit = 'Guardando en la nube…';
    }
    el.className = 'demo nube' + (cls ? ' ' + cls : '');
    el.title = tit;
    el.innerHTML = ic + '<span>' + esc(txt) + '</span>';
  }
};

/* ==========================================================================
   §N4  SESIÓN — la pantalla para entrar, la de una cuenta sin acceso y la de
        cuando la sesión se cae trabajando
   ========================================================================== */
const Sesion = {
  marca() {
    return '<div class="ses-marca">' + (MARCA.ok ? '<div class="ses-logo"><img src="' + MARCA.logo + '" alt="SINUGRAVAS S.A.S."></div>' : '') +
      '<div class="ses-titulo">Sistema de Gestión de Flota</div>' +
      (MARCA.ok ? '' : '<div class="txt-3" style="font-size:12.5px;margin-top:3px">SINUGRAVAS S.A.S.</div>') + '</div>';
  },
  nota: '<div class="ses-nota">La información vive en el servidor y es la misma desde cualquier equipo.<br>' +
    'Se necesita conexión a internet y una cuenta autorizada.</div>',
  /* Pide el correo y la contraseña. Termina cuando hay una sesión válida. */
  pedir(aviso) {
    return new Promise(listo => {
      const cont = $('#sesion'), correo = Prefs.get('ultimoCorreo') || '';
      cont.innerHTML = '<div class="ses"><div class="ses-caja">' + this.marca() +
        '<div class="card"><div class="card-b">' +
          (aviso ? '<div class="alert a-warn" style="padding:9px 11px;margin-bottom:12px">' + Icon('warn', '', 14) + '<div>' + esc(aviso) + '</div></div>' : '') +
          '<div class="field"><label for="sesCorreo">Correo</label>' +
            '<input class="inp" id="sesCorreo" type="email" autocomplete="username" value="' + attr(correo) + '"></div>' +
          '<div class="field"><label for="sesClave">Contraseña</label><div class="ses-clave">' +
            '<input class="inp" id="sesClave" type="password" autocomplete="current-password">' +
            '<button class="ses-ojo" type="button" id="sesOjo" title="Mostrar la contraseña" aria-label="Mostrar la contraseña">' + Icon('eye', '', 15) + '</button>' +
          '</div></div>' +
          '<div id="sesError"></div>' +
          '<button class="btn btn-primary ses-entrar" type="button" id="sesEntrar">' + Icon('shield', '', 15) + 'Entrar</button>' +
          '<div class="ses-estado" id="sesEstado"><span class="spin"></span>Comprobando el servidor…</div>' +
        '</div></div>' + this.nota +
      '</div></div>';
      const clave = $('#sesClave'), boton = $('#sesEntrar');
      const error = m => { $('#sesError').innerHTML = '<div class="alert a-err" style="padding:9px 11px;margin-bottom:12px">' + Icon('warn', '', 14) + '<div>' + esc(m) + '</div></div>'; };
      const entrar = async () => {
        const c = $('#sesCorreo').value.trim(), k = clave.value;
        if (!c || !k) { error('Escriba su correo y su contraseña.'); (c ? clave : $('#sesCorreo')).focus(); return; }
        boton.disabled = true;
        boton.innerHTML = '<span class="spin"></span>Verificando…';
        try {
          await Nube.entrar(c, k);
          Prefs.set('ultimoCorreo', c);
          cont.innerHTML = '';
          listo();
        } catch (e) {
          error(e.message);
          boton.disabled = false;
          boton.innerHTML = Icon('shield', '', 15) + 'Entrar';
          clave.focus();
        }
      };
      $('#sesOjo').onclick = () => {
        const ver = clave.type === 'password';
        clave.type = ver ? 'text' : 'password';
        $('#sesOjo').innerHTML = Icon(ver ? 'eyeOff' : 'eye', '', 15);
        $('#sesOjo').title = (ver ? 'Ocultar' : 'Mostrar') + ' la contraseña';
        clave.focus();
      };
      boton.onclick = entrar;
      $('#sesCorreo').addEventListener('keydown', e => { if (e.key === 'Enter') clave.focus(); });
      clave.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
      (correo ? clave : $('#sesCorreo')).focus();
      /* El estado del servidor no se supone: se comprueba. Si está caído, se
         sabe antes de escribir la contraseña. */
      Nube.latido().then(ms => {
        const e = $('#sesEstado');
        if (!e) return;
        e.innerHTML = ms == null ? '<span class="ses-punto mal"></span>El servidor no responde. Revise el internet.'
          : '<span class="ses-punto ok"></span>Servidor disponible · ' + ms + ' ms';
      });
    });
  },
  /* Entró bien, pero la cuenta todavía no tiene acceso a flota */
  sinAcceso(acc) {
    return new Promise(listo => {
      const correo = (acc && acc.correo) || Nube.correo();
      $('#sesion').innerHTML = '<div class="ses"><div class="ses-caja ancha">' + this.marca() +
        '<div class="card"><div class="card-b">' +
          '<div class="alert a-warn" style="padding:9px 11px;margin-bottom:12px">' + Icon('shield', '', 14) +
            '<div><b>Su cuenta no tiene acceso al Sistema de Gestión de Flota.</b></div></div>' +
          '<p class="ses-txt">Entró bien' + (correo ? ' como <b>' + esc(correo) + '</b>' : '') + ', pero esta cuenta todavía no está autorizada. ' +
            'Pídale el acceso al administrador. Cuando se lo den, pulse «Volver a comprobar» y entrará sin escribir la contraseña otra vez.</p>' +
          '<div class="ses-botones">' +
            '<button class="btn btn-primary" type="button" id="sesComprobar">' + Icon('refresh', '', 14) + 'Volver a comprobar</button>' +
            '<button class="btn" type="button" id="sesOtra">' + Icon('salir', '', 14) + 'Entrar con otra cuenta</button></div>' +
        '</div></div>' + this.nota +
      '</div></div>';
      $('#sesComprobar').onclick = e => {
        e.currentTarget.disabled = true;
        e.currentTarget.innerHTML = '<span class="spin"></span>Comprobando…';
        listo('comprobar');
      };
      $('#sesOtra').onclick = async () => { await Nube.salir(); listo('otra'); };
    });
  },
  /* Mientras se traen los datos, con el avance */
  cargando() {
    $('#sesion').innerHTML = '<div class="ses"><div class="ses-caja">' + this.marca() +
      '<div class="ses-estado" style="font-size:12.5px"><span class="spin"></span><span id="sesAvance">Trayendo los datos de la nube…</span></div></div></div>';
    return (n, total) => { const e = $('#sesAvance'); if (e) e.textContent = 'Trayendo los datos de la nube… ' + n + ' de ' + total; };
  },
  /* No se pudieron traer los datos: se dice por qué y se ofrece reintentar */
  fallo(e) {
    $('#sesion').innerHTML = '<div class="ses"><div class="ses-caja ancha">' + this.marca() +
      '<div class="card"><div class="card-b">' +
        '<div class="alert a-err" style="padding:9px 11px;margin-bottom:12px">' + Icon('warn', '', 14) + '<div><b>' +
          (e && e.red ? 'No hay conexión con el servidor.' : 'No se pudieron traer los datos.') + '</b>' +
          (e && !e.red ? '<br>' + esc(e.message) : '') + '</div></div>' +
        '<p class="ses-txt">Revise el internet e intente otra vez. Nada de lo guardado se perdió: está en la nube.</p>' +
        '<div class="ses-botones"><button class="btn btn-primary" type="button" onclick="location.reload()">' + Icon('refresh', '', 14) + 'Intentar otra vez</button></div>' +
      '</div></div></div></div>';
  },
  /* La sesión se cayó trabajando (venció y no se pudo renovar): se vuelve a
     pedir la contraseña sin perder lo que está en pantalla, y se sigue
     guardando */
  recuperar() {
    if (!this._recuperando) {
      Nube.guardarSesion(null);
      this._recuperando = this.pedir('La sesión se cerró. Vuelva a entrar para seguir guardando; lo que hizo sigue aquí.').then(() => {
        this._recuperando = null;
        Sincro.espera = 0;
        Sincro.tocar();
        Nube._trabajar();
      });
    }
    return this._recuperando;
  }
};

/* El arranque: sesión, acceso y datos. Mientras tanto, la pantalla de entrada
   tapa todo. */
const Arranque = {
  async iniciar() {
    try {
      if (!(await Nube.token())) await Sesion.pedir();
      for (;;) {
        let acc;
        try { acc = await Nube.miAcceso(); } catch (e) { Nube.guardarSesion(null); await Sesion.pedir(); continue; }
        Cuenta.poner(acc);
        if (!acc || (acc.acciones || []).length) break;
        if ((await Sesion.sinAcceso(acc)) === 'otra') await Sesion.pedir();
      }
      await Sincro.cargar(Sesion.cargando());
      /* Si empezó un mes nuevo, la revisión de comparendos pasa al historial
         (y la sincronización lo sube) */
      Comparendos.alDia();
    } catch (e) {
      console.error(e);
      Sesion.fallo(e);
      return;
    }
    $('#sesion').innerHTML = '';
    Shell.render();
    Buscador.montar();
    Router.pintar();
    Sincro.vigilar();
    Sincro.pintarEstado();
    /* Las fotos llegan un instante después de los datos */
    Guardadas.aplicar().then(n => { if (n) Router.pintar(true); });
  }
};

/* ==========================================================================
   §11  NAVEGACIÓN Y ARRANQUE
   ========================================================================== */
const Router = {
  actual() {
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'inicio';
    const p = h.split('/');
    return { vista: p[0], id: p[1] || '' };
  },
  ir(r) { if (location.hash === '#/' + r) this.pintar(); else location.hash = '#/' + r; },
  pintar(mantener) {
    /* Casi todo lo que cambia datos termina pintando: la nube revisa enseguida */
    Sincro.tocar();
    const { vista, id } = this.actual();
    const v = typeof Vistas[vista] === 'function' && !/^tab_|Res$|^chips|^tarjeta|Tabla$/.test(vista) ? vista : 'inicio';
    /* Al salir de la flota se deja de seleccionar */
    if (v !== 'flota') UIState.flota.sel = null;
    const y = window.scrollY;
    const cont = $('#vista');
    try {
      const r = Vistas[v](id);
      Shell.titulo(r.titulo, r.sub);
      cont.innerHTML = r.html;
      if (r.despues) r.despues();
    } catch (e) {
      console.error(e);
      cont.innerHTML = '<div class="alert a-err">' + Icon('warn') + '<div><b>Esta vista falló al dibujarse.</b> ' + esc(e.message) + '</div></div>';
    }
    Shell.nav(v === 'pronto' ? 'pronto/' + id : v === 'unidad' ? 'flota' : v);
    $('#sidebar').classList.remove('open');
    $('#scrim').classList.remove('on');
    window.scrollTo(0, mantener ? y : 0);
  }
};

document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  const ir = e.target.closest('[data-ir]');
  if (act && (!ir || ir.contains(act))) {
    /* Las casillas tienen que poder marcarse: a ellas no se les corta el clic */
    if (act.tagName !== 'INPUT') e.preventDefault();
    if (act.dataset.act !== 'registrar') Shell.cerrarMenus();
    const fn = Acciones[act.dataset.act];
    if (fn) fn(act, e);
    else Toast.show('Esta parte llega en una próxima versión.', 'warn');
    return;
  }
  if (ir) {
    e.preventDefault();
    Modal.cerrarTodo();
    Shell.cerrarMenus();
    const q = $('#gq'); if (q && ir.closest('#gsr')) q.value = '';
    Router.ir(ir.dataset.ir);
    return;
  }
  if (!e.target.closest('.menu-wrap')) $$('.menu-pop.open').forEach(m => m.classList.remove('open'));
  if (!e.target.closest('.gsearch')) { const g = $('#gsr'); if (g) g.classList.add('hidden'); }
});
/* Arrastrar un archivo a «Subir otro documento» de la ficha abre la ventana
   con el archivo ya puesto. Las zonas de las ventanas se atienden solas; en
   el resto de la página no se deja soltar, porque el navegador abriría el
   archivo y se perdería lo que no se ha guardado. */
const zonaSoltar = e => (e.target.closest ? e.target.closest('.dz[data-act="nuevoDocumento"], .rf-dz') : null);
const conArchivos = e => Boolean(e.dataTransfer) && Array.from(e.dataTransfer.types || []).includes('Files');
document.addEventListener('dragover', e => {
  if (e.defaultPrevented || !conArchivos(e)) return;
  e.preventDefault();
  const z = zonaSoltar(e);
  e.dataTransfer.dropEffect = z ? 'copy' : 'none';
  $$('.dz.over[data-act]').forEach(x => { if (x !== z) x.classList.remove('over'); });
  if (z) z.classList.add('over');
});
document.addEventListener('dragleave', e => {
  const z = zonaSoltar(e);
  if (z && !z.contains(e.relatedTarget)) z.classList.remove('over');
});
document.addEventListener('drop', e => {
  if (e.defaultPrevented || !conArchivos(e)) return;
  e.preventDefault();
  const z = zonaSoltar(e), f = e.dataTransfer.files[0];
  if (!z || !f) return;
  z.classList.remove('over');
  /* Al registro fotográfico se pueden soltar varias fotos a la vez */
  if (z.classList.contains('rf-dz')) Registro.subir(Q.unidad(z.dataset.u), Array.from(e.dataTransfer.files));
  else Ventanas.documento({ u: z.dataset.u, t: z.dataset.t, fijo: z.dataset.fijo === '1', archivo: f });
});
/* Lo que muestra cada foto del registro se guarda al salir del campo */
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('rf-txt')) Registro.describir(Q.unidad(t.dataset.u), t.dataset.f, t.value.trim());
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (Modal.abierto()) Modal.cerrar(); Shell.cerrarMenus(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const q = $('#gq'); if (q) q.focus(); }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('uc')) e.target.click();
});
/* Solo con la plataforma ya pintada: en la pantalla de entrada o en el formulario del conductor no hay vista */
window.addEventListener('hashchange', () => { if ($('#vista')) Router.pintar(); });

document.documentElement.setAttribute('data-theme', Prefs.get('tema') === 'dark' ? 'dark' : 'light');
/* Primero se recorta la «S» del logo, que la barra lateral usa al pintarse;
   luego se pide la sesión, se mira el acceso y se traen los datos de la nube */
/* «?preoperacional» es el formulario de los conductores (§F); si no, la plataforma */
if (PreopPublico.activo()) PreopPublico.iniciar();
else MARCA.preparar().then(() => Arranque.iniciar());
</script>
