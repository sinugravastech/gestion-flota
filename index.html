  /* ------------------------------------------------- Ficha de una unidad */
  unidad(id) {
    const u = Q.unidad(id);
    if (!u) return { titulo: 'Unidad', html: '<div class="card">' + UI.empty('truck', 'No se encontró la unidad', '<span class="link" data-ir="flota">Volver a la flota</span>') + '</div>' };
    if (UIState.unidadId !== id) { UIState.unidadId = id; UIState.tab = 'info'; UIState.act = 'todos'; }
    const e = Est.unidad(u), ins = Est.insp(u), c = Q.conductor(u.conductor);
    const mants = Datos.mantenimientos.filter(m => m.unidad === u.id).sort((a, b) => b.fecha.localeCompare(a.fecha));
    const ult = mants[0];
    const ocs = Datos.ocs.filter(o => o.unidad === u.id);
    const req = Config.req[u.tipo] || [];
    const alertas = req.filter(t => Est.doc(u.docs[t], t).k !== 'ok').length;
    const fact = (ic, l, v, s, k) => '<div class="fact"><small>' + Icon(ic, '', 11) + esc(l) + '</small>' +
      '<b' + (k && k !== 'ok' ? ' class="tx-' + k + '"' : '') + ' title="' + attr(v) + '">' + esc(v) + '</b>' +
      '<span title="' + attr(s || '') + '">' + (s ? esc(s) : '&nbsp;') + '</span></div>';
    let compV, compS, compK;
    if (!Config.comparendos.includes(u.tipo)) { compV = 'No aplica'; compS = 'No tiene placa'; }
    else if (u.comp.estado === 'sin') { compV = 'Sin comparendos'; compS = 'Revisado este mes'; compK = 'ok'; }
    else if (u.comp.estado === 'con') { compV = 'Con comparendo'; compS = u.comp.infraccion; compK = 'bad'; }
    else { compV = 'Sin revisar'; compS = 'Se revisa a comienzo de mes'; compK = 'warn'; }
    const conLicencia = (Config.req[u.tipo] || []).includes('tarjeta');
    const tabs = [['info', 'Información'], ['actividad', 'Actividad', Actividad.de(u).length], ['docs', 'Documentos', alertas], ['mant', 'Mantenimientos', mants.length]]
      .concat(Preop.aplica(u) ? [['preop', 'Preoperacionales']] : [])
      .concat([['insp', 'Inspecciones'], ['comp', 'Comparendos y accidentes'], ['oc', 'Compras', ocs.length]]);
    const html =
      '<div class="crumbs"><a data-ir="flota">Flota</a>' + Icon('chevR', '', 12) + '<span>' + esc(UI.placaTxt(u)) + '</span></div>' +
      '<section class="uh">' +
        '<div class="uh-ph">' + UI.foto(u) +
          '<button class="uh-btn uh-foto" data-act="cambiarFoto" data-u="' + u.id + '" title="' + (u.foto ? 'Cambiar la foto' : 'Poner una foto') + '" aria-label="' +
            (u.foto ? 'Cambiar la foto' : 'Poner una foto') + '">' + Icon(u.foto ? 'edit' : 'camera', '', 15) + '</button>' +
          (conLicencia ? '<button class="uh-btn uh-lic" data-act="verLicencia" data-u="' + u.id + '" aria-label="Licencia de tránsito" title="' +
            (u.licencia ? 'Ver la licencia de tránsito' : 'Licencia de tránsito: falta adjuntarla') + '">' + Icon('idcard', '', 16) +
            (u.licencia ? '' : '<span class="lic-dot"></span>') + '</button>' : '') + '</div>' +
        '<div class="uh-b">' +
          '<div class="uh-top">' + UI.placa(u, 'xl') + '<span class="pill p-gray np">' + Icon(TIPOS[u.tipo].icono, '', 12) + esc(TIPOS[u.tipo].nombre) + '</span>' +
            (e.k !== 'nr' ? UI.pill(e.k, e.txt) : '') + '</div>' +
          '<div><div class="uh-h">' + esc(UI.nombre(u)) + (u.modelo ? ' · ' + esc(u.modelo) : '') + '</div>' +
            '<div class="uh-sub">' + esc([u.clase, u.color].filter(Boolean).join(' · ')) + '</div></div>' +
          '<div class="facts">' +
            '<div class="fact editable" data-act="cambiarConductor" data-u="' + u.id + '" title="Cambiar el conductor u operador">' +
              '<small>' + Icon('user', '', 11) + 'Conductor u operador</small>' +
              '<div class="fact-sel"><span>' + esc(c ? c.nombre : 'Sin asignar') + '</span>' + Icon('chevD', '', 13) + '</div>' +
              '<span>' + (c ? 'Licencia ' + esc(c.cat) : 'Clic para asignar') + '</span></div>' +
            fact('clipboard', 'Última inspección', u.insp ? Fecha.corta(u.insp) : 'Sin registro', u.insp ? Fecha.hace(u.insp) : '', ins.k) +
            fact('tool', 'Último mantenimiento', ult ? Fecha.corta(ult.fecha) : 'Sin registros', ult ? (ult.tipo === 'preventivo' ? 'Preventivo · ' : 'Correctivo · ') + ult.trabajo : '') +
            fact('ticket', 'Comparendos del mes', compV, compS, compK) +
          '</div>' +
          '<div class="uh-act">' +
            '<button class="btn btn-primary" data-act="nuevoDocumento" data-u="' + u.id + '">' + Icon('upload', '', 14) + 'Subir documento</button>' +
            '<button class="btn" data-act="editarUnidad" data-u="' + u.id + '">' + Icon('edit', '', 14) + 'Editar</button>' +
            '<button class="btn" data-act="nuevoPreventivo" data-u="' + u.id + '">' + Icon('tool', '', 14) + 'Preventivo</button>' +
            '<button class="btn" data-act="nuevoCorrectivo" data-u="' + u.id + '">' + Icon('camera', '', 14) + 'Correctivo</button>' +
            '<button class="btn" data-act="nuevaInspeccion" data-u="' + u.id + '">' + Icon('clipboard', '', 14) + 'Inspección</button>' +
            '<button class="btn btn-ghost" data-act="hojaDeVida" data-u="' + u.id + '">' + Icon('print', '', 14) + 'Imprimir hoja de vida</button>' +
          '</div>' +
        '</div>' +
      '</section>' +
      '<div class="tabs">' + tabs.map(t => '<div class="tab' + (UIState.tab === t[0] ? ' active' : '') + '" data-act="tab" data-tab="' + t[0] + '">' + t[1] +
        (t[2] ? '<span class="tb-count">' + t[2] + '</span>' : '') + '</div>').join('') + '</div>' +
      '<div id="tabBody">' + this['tab_' + UIState.tab](u) + '</div>';
    return { titulo: UI.placaTxt(u), sub: TIPOS[u.tipo].nombre + ' · ' + UI.nombre(u), html };
  },
  /* La hoja de vida de la unidad, por las secciones del formato de su tipo.
     Cada sección dice si está completa o cuántos datos le faltan; lo que
     falta se ve como «—», para saber qué completar. */
  tab_info(u) {
    let total = 0, llenos = 0;
    const secs = HojaVida.secciones(u).map(s => {
      const n = s.campos.filter(c => HojaVida.lleno(u, c)).length;
      total += s.campos.length;
      llenos += n;
      return '<div class="hv-sec"><div class="hv-h">' + esc(s.t) + '<span class="hv-n' + (n < s.campos.length ? ' falta' : '') + '">' +
        (n === s.campos.length ? 'Completa' : n === 0 ? 'Por completar' : 'Faltan ' + (s.campos.length - n) + ' de ' + s.campos.length) + '</span></div>' +
        '<div class="hv-b"><div class="info-grid">' + s.campos.map(c => HojaVida.celda(u, c)).join('') + '</div></div></div>';
    }).join('');
    return UI.card('Información', secs, { flush: true, sub: llenos + ' de ' + total + ' datos · como la hoja de vida SST-FRT-026',
        act: '<button class="btn btn-sm" data-act="editarUnidad" data-u="' + u.id + '">' + Icon('edit', '', 12) + 'Editar</button>' }) +
      (HojaVida.conDotacion(u) ? HojaVida.tarjetaDotacion(u) : '') +
      HojaVida.tarjetaRegistro(u) +
      '<div class="alert a-info mt16">' + Icon('info') + '<div><b>Esta información reemplaza la hoja de vida en Excel.</b> Se llena con «Editar» y se imprime ' +
        'con «Imprimir hoja de vida», en el mismo formato SST-FRT-026. Las fechas de los documentos salen de Documentos, así que no se escriben dos veces.</div></div>';
  },
  /* La historia de la unidad, del evento más reciente al más antiguo y
     agrupada por mes */
  tab_actividad(u) {
    const todos = Actividad.de(u);
    const grupo = e => ACT[e.tipo].grupo;
    const f = UIState.act;
    const filtros = [['todos', 'Todo', todos.length]].concat(GRUPOS_ACT
      .map(g => [g[0], g[1], todos.filter(e => grupo(e) === g[0]).length]).filter(g => g[2]));
    const lista = todos.filter(e => f === 'todos' || grupo(e) === f);
    const meses = [];
    lista.forEach(e => {
      const k = e.fecha.slice(0, 7);
      let g = meses.find(x => x.k === k);
      if (!g) meses.push(g = { k, ev: [] });
      g.ev.push(e);
    });
    const item = e => {
      const a = ACT[e.tipo];
      return '<div class="tl-i" style="--c:' + a.c + '"><span class="tl-dot">' + Icon(a.ic, '', 10) + '</span>' +
        '<div class="tl-h"><b>' + esc(e.titulo) + '</b><span class="tl-f">' + esc(Fecha.corta(e.fecha)) + (e.hora ? ' · ' + esc(e.hora) : '') + '</span></div>' +
        (e.det ? '<div class="tl-m">' + esc(e.det) + '</div>' : '') +
        (e.adjuntos.length ? '<div class="tl-x">' + e.adjuntos.map(a => (typeof a === 'string' ? UI.file(a) : UI.file(a.n, a.id))).join('') + '</div>' : '') +

      '</div>' +

/* ==========================================================================
   §9  VENTANAS
   ========================================================================== */
const Ventanas = {
  /* Subir un documento a una unidad o a un conductor. Desde «Otros documentos»
     de la ficha (o.fijo) la unidad y el tipo quedan fijos; si el archivo llegó
     arrastrado, viene en o.archivo. */
  documento(o) {
    o = o || {};
    const fijo = o.fijo && o.u ? Q.unidad(o.u) : null;
    const sel = o.u ? 'u:' + o.u : o.c ? 'c:' + o.c : 'u:' + Datos.unidades[0].id;
    const optsTit = '<optgroup label="Unidades">' + Datos.unidades.map(u => '<option value="u:' + u.id + '"' + (sel === 'u:' + u.id ? ' selected' : '') + '>' +
        esc(UI.placaTxt(u) + ' · ' + u.clase + ' ' + UI.nombre(u)) + '</option>').join('') + '</optgroup>' +
      '<optgroup label="Conductores y operadores">' + Datos.conductores.map(c => '<option value="c:' + c.id + '"' + (sel === 'c:' + c.id ? ' selected' : '') + '>' +
        esc(c.nombre) + '</option>').join('') + '</optgroup>';
    const m = Modal.abrir({
      titulo: 'Subir documento', sub: fijo ? 'Queda en Otros documentos de ' + UI.placaTxt(fijo) : 'Queda en la hoja de la unidad o del conductor',
      cuerpo: (fijo
        ? '<div class="field"><label>¿De quién es el documento?</label><div class="inp inp-fijo"><span>' +
            esc(UI.placaTxt(fijo) + ' · ' + fijo.clase + ' ' + UI.nombre(fijo)) + '</span>' + Icon('lock', '', 13) + '</div>' +
            '<input type="hidden" id="mdTit" value="u:' + fijo.id + '"></div>' +
          '<div class="field"><label>Tipo de documento</label><div class="inp inp-fijo"><span>Otro documento de la unidad</span>' + Icon('lock', '', 13) + '</div>' +
            '<input type="hidden" id="mdTipo" value="otro">'
        : '<div class="field"><label>¿De quién es el documento?</label><select class="inp" id="mdTit">' + optsTit + '</select></div>' +
          '<div class="field"><label>Tipo de documento</label><select class="inp" id="mdTipo"></select>') +
          '<div class="hint" id="mdTipoH" hidden>Para los demás documentos de la unidad. Los comparendos y los accidentes no van aquí: se registran en la pestaña ' +
          'Comparendos y accidentes de la unidad.</div></div>' +
        '<div class="row"><div class="field"><label>Fecha de expedición</label><input class="inp" type="date" id="mdExp" value="' + hoyISO + '"></div>' +
        '<div class="field" id="mdVenceF"><label>Vence el</label><input class="inp" type="date" id="mdVence" value="' + R(365) + '"></div></div>' +
        Dz.html('mdDz', 'Arrastre aquí el PDF o haga clic para buscarlo', 'También sirve una foto del documento', 'application/pdf,image/*', false) +
        '<div id="mdAviso"></div>',
      pie: '<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-primary" data-act="guardarDocumento">' + Icon('save', '', 14) + 'Guardar</button>'
    });
    /* La tarjeta de propiedad de una unidad se guarda tal cual; lo demás, con
       compresión ligera. La lista del archivo lo dice antes de guardar. */
    const destino = () => ($('#mdTit', m).value.startsWith('u:') && $('#mdTipo', m).value === 'tarjeta' ? 'licencia' : 'documento');
    /* Un comparendo o un accidente no va en «Otros documentos»: si el nombre
       del archivo lo dice, se avisa y se ofrece llevarlo a su pestaña con el
       mismo archivo. Es solo un aviso: si de verdad va aquí, se guarda igual. */
    const avisoLugar = () => {
      const p = $('#mdTit', m).value.split(':'), u = p[0] === 'u' ? Q.unidad(p[1]) : null;
      const lugar = u && m._archivo && $('#mdTipo', m).value === 'otro' ? Lugar.de(m._archivo.name) : null;
      if (!lugar) { $('#mdAviso', m).innerHTML = ''; return; }
      const puede = lugar === 'accidente' || Config.comparendos.includes(u.tipo);
      $('#mdAviso', m).innerHTML = '<div class="alert a-warn mt12">' + Icon('warn') + '<div><b>Este archivo parece de un ' + lugar + '.</b> ' +
        'Así lo dice su nombre, «' + esc(m._archivo.name) + '». Los ' + lugar + 's van en la pestaña Comparendos y accidentes; ' +
        'si de verdad es otro documento de la unidad, puede guardarlo aquí igual.' +
        (puede ? '<div class="mt8"><button class="btn btn-sm" data-act="llevarArchivo" data-l="' + lugar + '" data-u="' + u.id + '">' +
          Icon(lugar === 'comparendo' ? 'ticket' : 'warn', '', 12) + 'Registrarlo como ' + lugar + '</button></div>' : '') + '</div></div>';
    };
    /* Lo que depende del tipo: el vencimiento, la nota, el archivo y el aviso */
    const pintarVence = () => {
      const t = $('#mdTipo', m).value;
      $('#mdVenceF', m).style.visibility = DOC_TIPOS[t] && DOC_TIPOS[t].vence ? '' : 'hidden';
      $('#mdTipoH', m).hidden = t !== 'otro';

    }

  /* Abre el archivo. Si todavía no se ha bajado de la nube, se baja primero;
     los PDF se bajan así, solo cuando se abren. */
  visor(nombre, id) {
    const v = id && Archivos.vistos.get(id);
    if (!v && id && Nube.conocido(Nube.claveDe(id))) {
      const m = Modal.abrir({
        titulo: nombre, sub: 'Abriendo el archivo…', ancho: 'wide', sinFoco: true,
        cuerpo: '<div class="flex aic g8 txt-2" style="justify-content:center;padding:48px 16px"><span class="spin"></span>Bajando el archivo de la nube…</div>',
        pie: '<button class="btn" data-act="cerrarModal">Cerrar</button>'
      });
      Nube.bajar(Nube.claveDe(id)).then(blob => {
        if (!document.body.contains(m)) return;
        Modal.cerrar(m);
        if (!blob) { Toast.show('No se pudo abrir «' + esc(nombre) + '». Revise el internet e intente otra vez.', 'err'); return; }
        Archivos.registrar(id, blob, nombre, Nube.meta(Nube.claveDe(id)).antes);
        this.visor(nombre, id);
      });
      return;
    }
    if (v) {
      const pdf = /pdf/i.test(v.tipo) || /\.pdf$/i.test(nombre);
      const peso = v.antes > v.tam ? Peso.txt(v.antes) + ' → ' + Peso.txt(v.tam) + ' (−' + Peso.ahorro(v.antes, v.tam) + ' %)'
        : (v.tam ? Peso.txt(v.tam) + ' · ' : '') + 'tal cual se adjuntó';
      Modal.abrir({
        titulo: nombre, sub: esc(peso), ancho: 'xwide', sinFoco: true,
        cuerpo: '<div class="visor real">' + (pdf ? '<iframe class="visor-pdf" src="' + attr(v.url) + '" title="' + attr(nombre) + '"></iframe>'
          : '<img class="visor-img" src="' + attr(v.url) + '" alt="' + attr(nombre) + '">') + '</div>',
        pie: '<a class="btn" href="' + attr(v.url) + '" download="' + attr(nombre) + '">' + Icon('download', '', 14) + 'Descargar</a>' +
          (pdf ? '<button class="btn" data-act="imprimirVisor">' + Icon('print', '', 14) + 'Imprimir</button>' : '') +
          '<button class="btn btn-primary" data-act="cerrarModal">Cerrar</button>'
      });
      return;
    }
    Modal.abrir({
      titulo: nombre, sub: 'Sin archivo', ancho: 'wide', sinFoco: true,
      cuerpo: '<div class="alert a-info">' + Icon('info') + '<div><b>Este registro no tiene el archivo guardado.</b> ' +
        'Se anotó sin adjuntarlo. Para tenerlo aquí, súbalo otra vez.</div></div>',
      pie: '<button class="btn btn-primary" data-act="cerrarModal">Cerrar</button>'
    });
  },

  editarUnidad(u) {

        (c.doc ? 'Sale de Documentos' : c.insp ? 'Sale de las inspecciones' : 'Sale de la última lectura, en Cambios de aceite') +
        '"><span>' + esc(HojaVida.texto(u, c) || '—') + '</span>' + Icon('lock', '', 13) + '</div></div>';

      lista.push(c);

      return '<div class="field">' + et + '<input class="inp" id="' + id + '"' + (c.fecha ? ' type="date"' : '') + (c.de === 'modelo' ? ' inputmode="numeric"' : '') +
        ' value="' + attr(v == null ? '' : v) + '"></div>';
    };
    const m = Modal.abrir({
      titulo: 'Editar información · ' + UI.placaTxt(u), sub: esc(TIPOS[u.tipo].nombre), ancho: 'wide',
      cuerpo: HojaVida.secciones(u).map(s => '<div class="ed-sec"><div class="ed-h">' + esc(s.t) + '</div><div class="ed-grid">' +

        '<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-primary" data-act="guardarEdicion" data-u="' + u.id + '">' +
        Icon('save', '', 14) + 'Guardar cambios</button>'

  /* El frente de la licencia de tránsito, en grande. Si no está, se adjunta aquí */

        : UI.empty('idcard', 'Todavía no se ha adjuntado', 'Tómele una foto al frente de la licencia de tránsito, o escanéela, y súbala aquí. ' +
            'Se guarda tal cual, sin comprimir, y queda también en Documentos como tarjeta de propiedad.') +
          Dz.html('licDz', 'Arrastre aquí la foto o el PDF del frente de la licencia', 'O haga clic para buscarlo en el equipo', 'image/*,application/pdf', false) +
          (tarjeta && tarjeta.archivo ? '<div class="alert a-info mt12">' + Icon('info') + '<div>Hoy, en Documentos, la tarjeta de propiedad es ' +
            UI.file(tarjeta.archivo, tarjeta.archivoId) + '. Lo que adjunte aquí la reemplaza.</div></div>' : '');
      /* Tal cual: la licencia tiene que verse con la calidad con que se adjuntó */
      const recibir = f => Archivos.original(f).then(ok => {
        if (!ok) return;
        Guardadas.poner(u, 'licencia', ok, 'boton');
        pintar();
        Router.pintar(true);
        Toast.show('Tarjeta de propiedad de <b>' + esc(UI.placaTxt(u)) + '</b> guardada tal cual, sin comprimir. Ya quedó en Documentos.');
      });
      if (u.licencia) $('#licInp', m).addEventListener('change', e => { const f = e.target.files[0]; if (f) recibir(f); });
      else Dz.bind('licDz', files => recibir(files[0]));
    };
    pintar();
  }
};

/* ==========================================================================
   §10  ACCIONES — lo que hace cada botón (data-act)
   ========================================================================== */
const Acciones = {
  tema() {
    const nuevo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nuevo);
    Prefs.set('tema', nuevo);
    $('#btnTema').innerHTML = Icon(nuevo === 'dark' ? 'sun' : 'moon', '', 15);
  },
  mini() {
    const m = !document.documentElement.classList.contains('sb-mini');
    document.documentElement.classList.toggle('sb-mini', m);
    Prefs.set('mini', m);
  },
  menu() { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); },
  registrar() { $('#menuReg').classList.toggle('open'); },
  cerrarModal(el) { Modal.cerrar(el); },
  tab(el) {
    UIState.tab = el.dataset.tab;
    $$('.tabs .tab').forEach(t => t.classList.toggle('active', t === el));
    $('#tabBody').innerHTML = Vistas['tab_' + UIState.tab](Q.unidad(UIState.unidadId));
  },
  modoFlota(el) {
    UIState.flota.modo = el.dataset.v;
    $$('[data-act="modoFlota"]').forEach(b => b.classList.toggle('on', b === el));
    Vistas.flotaRes();
  },
  tipoFlota(el) {
    UIState.flota.tipo = el.dataset.v;
    $$('[data-act="tipoFlota"]').forEach(b => b.classList.toggle('on', b === el));
    Vistas.flotaRes();
  },
  /* Seleccionar unidades de la flota para eliminarlas de una vez. Por ahora
     cualquiera puede; cuando haya roles, solo quien tenga ese permiso. */
  seleccionarFlota() {
    const f = UIState.flota;
    f.sel = f.sel ? null : new Set();
    Router.pintar(true);
  },
  selUnidad(el) {
    const sel = UIState.flota.sel, id = el.dataset.u;
    if (!sel) return;
    if (sel.has(id)) sel.delete(id); else sel.add(id);
    /* Solo cambian la casilla y la franja: las fotos no se vuelven a dibujar */
    const on = sel.has(id);
    el.classList.toggle('sel', on);
    el.setAttribute('aria-pressed', on);
    $('.ck', el).outerHTML = UI.ck(on, el.tagName === 'TR' ? 11 : 13);
    const barra = $('.selbar');
    if (barra) barra.outerHTML = UI.selBarra(Q.flota());
  },
  selTodas() {
    const sel = UIState.flota.sel;
    if (!sel) return;
    const lista = Q.flota(), todas = lista.length && lista.every(u => sel.has(u.id));
    lista.forEach(u => { if (todas) sel.delete(u.id); else sel.add(u.id); });
    Vistas.flotaRes();
  },
  eliminarSel() {
    const sel = UIState.flota.sel, us = Datos.unidades.filter(u => sel && sel.has(u.id));
    if (!us.length) return;
    const ids = new Set(us.map(u => u.id)), de = k => Datos[k].filter(x => ids.has(x.unidad)).length;
    const docs = us.reduce((n, u) => n + Object.values(u.docs || {}).filter(d => d && d.archivo).length + (u.otros || []).length, 0);
    const fotos = us.reduce((n, u) => n + (u.foto ? 1 : 0) + (u.registro || []).length, 0);
    const partes = [[docs, 'documento(s)'], [de('mantenimientos'), 'mantenimiento(s)'], [de('inspecciones'), 'inspección(es)'], [de('ocs'), 'orden(es) de compra'],
      [de('accidentes'), 'accidente(s)'], [fotos, 'foto(s)']].filter(p => p[0]).map(p => p[0] + ' ' + p[1]);
    const cuantas = us.length === 1 ? '1 unidad' : us.length + ' unidades';
    Modal.abrir({
      titulo: 'Eliminar ' + cuantas, sub: 'Las que se seleccionaron en la flota', sinFoco: true,
      cuerpo: '<div class="alert a-err mb12">' + Icon('warn') + '<div><b>Se borra cada unidad con todo lo suyo' + (partes.length ? ': ' + esc(partes.join(', ')) : '') + ', y su actividad.</b> ' +
          'No se puede deshacer, salvo restaurando una copia de seguridad.</div></div>' +
        '<div class="flex g6" style="flex-wrap:wrap">' + us.map(u => UI.placa(u)).join('') + '</div>',
      pie: '<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-danger" data-act="confirmarEliminarSel">' +
        Icon('trash', '', 14) + 'Eliminar ' + cuantas + '</button>'
    });
  },
  confirmarEliminarSel() {
    const f = UIState.flota, ids = Datos.unidades.filter(u => f.sel && f.sel.has(u.id)).map(u => u.id);
    Modal.cerrarTodo();
    if (!ids.length) return;
    Borrar.unidades(ids);
    if (ids.includes(UIState.unidadId)) UIState.unidadId = null;
    f.sel = null;
    Router.pintar(true);
    Toast.show(ids.length === 1 ? 'Se eliminó 1 unidad con todo lo suyo.' : 'Se eliminaron <b>' + ids.length + ' unidades</b> con todo lo suyo.');
  },
  verTipo(el) {
    Object.assign(UIState.flota, { tipo: el.dataset.v, estado: 'todos', q: '' });
    Router.ir('flota');
  },
  irUnidad(el) {
    UIState.unidadId = el.dataset.u;
    UIState.tab = el.dataset.tab || 'info';
    UIState.act = 'todos';
    Router.ir('unidad/' + el.dataset.u);
  },
  filtroAct(el) {
    UIState.act = el.dataset.v;
    $('#tabBody').innerHTML = Vistas.tab_actividad(Q.unidad(UIState.unidadId));
  },
  editarUnidad(el) { Ventanas.editarUnidad(Q.unidad(el.dataset.u)); },
  guardarEdicion(el) {
    const m = el.closest('.modal-bd'), u = Q.unidad(el.dataset.u);
    const v = i => { const x = $('#hv' + i, m); return x ? x.value.trim() : null; };
    const iPlaca = m._campos.findIndex(c => c.de === 'placa');
    const placa = iPlaca < 0 ? u.placa : (v(iPlaca) || '').toUpperCase().replace(/\s+/g, '');
    if (!placa) { Toast.show('La placa o el código no puede quedar vacío.', 'err'); return; }
    if (Datos.unidades.some(x => x !== u && x.placa === placa)) { Toast.show('Ya hay otra unidad con «' + esc(placa) + '».', 'err'); return; }
    /* El cambio de conductor queda en la actividad, igual que desde la ficha.
       Los demás datos no: la actividad es la historia de la unidad, no de lo
       que se edita. */
    const placaAntes = u.placa;
    let cambios = 0, detCond = '';
    m._campos.forEach((c, i) => {
      const nuevo = c.de === 'placa' ? placa : v(i);
      if (nuevo === null) return;
      if (c.de === 'conductor') {
        if ((nuevo || null) !== (u.conductor || null)) {
          detCond = detConductor(Q.conductor(u.conductor), Q.conductor(nuevo || null));
          u.conductor = nuevo || null;
        }
        return;
      }
      const k = HojaVida.nombre(c), antes = c.de ? u[c.de] : (u.ficha || {})[k];
      if ((antes == null ? '' : String(antes)) === nuevo) return;
      cambios++;
      if (c.de) u[c.de] = nuevo;
      else {
        u.ficha = u.ficha || {};
        if (nuevo) u.ficha[k] = nuevo; else delete u.ficha[k];
      }
    });

    /* Si se elimina, su renovación no pasó: sale de la actividad. Las
       renovaciones anteriores se quedan. */
    Datos.actividad = Datos.actividad.filter(a => !(a.unidad === u.id && a.tipo === 'renovacion' && a.doc === t && a.docTs === d.ts));
    /* La tarjeta que vino de la licencia es la misma imagen guardada: se va también */
    if (d.desdeLicencia) {
      delete u.licencia;

  async guardarDocumento(el) {

    const f = m._archivo;
    /* La tarjeta de propiedad de una unidad es la misma licencia del botón de
       la foto: se guarda tal cual y queda en los dos sitios */
    if (p[0] === 'u' && t === 'tarjeta' && f) {
      const ok = await Archivos.original(f);
      if (!ok) return;
      await Guardadas.poner(quien, 'licencia', ok, 'documentos');
      Modal.cerrarTodo();
      Toast.show('Tarjeta de propiedad de <b>' + esc(UI.placaTxt(quien)) + '</b> guardada tal cual, sin comprimir. También se ve en el botón de la licencia.');
      Router.pintar(true);
      return;
    }
    /* Lo demás se comprime poco, según la política de archivos */
    const a = f ? await Archivos.conBoton(el, () => Archivos.preparar(f)) : null;
    const nombre = a ? a.nombre : (t === 'otro' ? 'Documento' : DOC_TIPOS[t].nombre) + ' ' + (p[0] === 'u' ? quien.placa : quien.nombre) + '.pdf';
    const vence = DOC_TIPOS[t] && DOC_TIPOS[t].vence ? $('#mdVence', m).value : undefined;
    if (t === 'otro') {
      if (p[0] === 'u') (quien.otros = quien.otros || []).push({ nombre, archivoId: a ? a.id : undefined, cat: 'Documento', fecha: hoyISO, hora: ahora(), ts: marca(),
        expedicion: $('#mdExp', m).value });
    } else {
      /* El SOAT, la tecnomecánica, la póliza y la patente quedan en la
         actividad de la unidad como renovaciones: el nuevo, y el que se
         reemplaza si todavía no había quedado guardado */
      const renueva = p[0] === 'u' && DOC_TIPOS[t].vence;
      if (renueva) Actividad.renovo(quien, t);
      quien.docs[t] = { archivo: nombre, archivoId: a ? a.id : undefined, vence, expedicion: $('#mdExp', m).value, subido: hoyISO, hora: ahora(), ts: marca() };
      if (renueva) Actividad.renovo(quien, t);
    }
    /* Se cierra todo: si se subió desde la ficha de un conductor, esa ventana
       ya muestra datos viejos */
    Modal.cerrarTodo();
    Toast.show('Documento guardado: <b>' + esc(nombre) + '</b>' + (a ? '<br>' + esc(Archivos.resumen(a)) : ''));

/* ==========================================================================
   §B  SEGUNDA PARTE — mantenimientos, inspecciones, comparendos, compras,
   conductores, proveedores y configuración
   ========================================================================== */
Object.assign(UIState, { mant: 'todos', insp: 'todas', oc: 'todas' });
Money.compacto = n => n >= 1e6 ? '$' + (n / 1e6).toFixed(1).replace('.', ',') + ' M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + ' mil' : Money.format(n);
const iniciales2 = n => { const p = String(n).split(/\s+/).filter(Boolean); return (p.length > 1 ? p[0][0] + p[1][0] : String(n).slice(0, 2)).toUpperCase(); };

/* Consecutivos de los formatos */
const Num = {
  sig(lista, pref) {
    const n = lista.filter(Boolean).map(x => +String(x).split('-')[2] || 0);
    return pref + '-' + HOY.getFullYear() + '-' + String(Math.max(0, ...n) + 1).padStart(4, '0');
  },
  mc() { return this.sig(Datos.mantenimientos.map(m => m.numero), 'MC'); },
  oc() { return this.sig(Datos.ocs.map(o => o.numero), 'OC'); }
};

/* Opciones de las listas desplegables */
const Opc = {
  unidades(sel, conGeneral, tipos) {
    return (conGeneral ? '<option value="">General (sin unidad)</option>' : '') + ORDEN.filter(t => !tipos || tipos.includes(t)).map(t => '<optgroup label="' + attr(TIPOS[t].plural) + '">' +
      Datos.unidades.filter(u => u.tipo === t).map(u => '<option value="' + u.id + '"' + (sel === u.id ? ' selected' : '') + '>' +
        esc(UI.placaTxt(u) + ' · ' + u.clase + ' ' + UI.nombre(u)) + '</option>').join('') + '</optgroup>').join('');
  },
  proveedores(sel) {
    return Datos.proveedores.map(p => '<option value="' + p.id + '"' + (sel === p.id ? ' selected' : '') + '>' + esc(p.nombre + ' · ' + p.servicio) + '</option>').join('');

    return (vacio ? '<option value="">' + esc(vacio) + '</option>' : '') +

/* --------------------------------------------------------------------------
   Formatos imprimibles: mismo estilo de los de caja menor. Se imprimen o se
   guardan como PDF desde la ventana de impresión del navegador.

const Formatos = {
  /* El encabezado y, debajo, la banda azul con la línea naranja: a la

  cabecera(titulo, meta, numero, numLbl, banda) {
    return '<div class="dp-head"><div class="dp-logo">' +
      (MARCA.ok ? '<img src="' + MARCA.logo + '" alt="SINUGRAVAS S.A.S.">' : '<div class="lg-txt">SINUGRAVAS<small>SISTEMA DE GESTIÓN DE FLOTA</small></div>') + '</div>' +
      '<div class="dp-hc"><h1>' + esc(titulo) + '</h1><div class="dp-meta">' + esc(meta) + '</div></div>' +
      '<div class="dp-num"><div>' + esc(numLbl || 'Número') + '<b>' + esc(numero) + '</b></div><div>Fecha<b>' + hoyISO.split('-').reverse().join('/') + '</b></div></div></div>' +
      (banda ? '<div class="dp-banda">' + esc(banda[0]) + '<span>' + esc(banda[1]) + '</span></div>' : '');
  },
  campos(pares) {
    return '<div class="dp-fields">' + pares.map(p => '<div class="dp-f"><label>' + esc(p[0]) + '</label><span>' + esc(p[1]) + '</span></div>').join('') + '</div>';

  firmas(lista) {

  },
  pie(txt) {
    return '<div class="dp-foot"><span><b>' + esc(txt) + '</b></span><span>Generado por el Sistema de Gestión de Flota de SINUGRAVAS S.A.S. · flota.sinugravas.com</span></div>';
  },

  /* El historial de una visita al taller, con una foto por cambio */
  correctivo(d) {
    const u = d.unidad, p = d.prov, c = Q.conductor(u.conductor), conPlaca = u.tipo === 'carga' || u.tipo === 'remolque';

  informeComparendos(atras) {

  /* Hoja de vida: reemplaza el Excel de cada vehículo */
  /* La hoja de vida con el formato SST-FRT-026 del ingeniero anterior: el
     mismo encabezado, las mismas secciones y la dotación con sus casillas.
     Después van el registro fotográfico (la foto, la tarjeta, el VIN y las
     fotos que se agreguen), los documentos y los últimos mantenimientos. */
  hojaDeVida(u) {
    const titulo = { carga: 'Hoja de vida vehículos', maquinaria: 'Hoja de vida maquinaria', remolque: 'Hoja de vida remolque / semirremolque',
      canoa: 'Hoja de vida patente / canoa / motocanoa' }[u.tipo];

    const ms = Datos.mantenimientos.filter(m => m.unidad === u.id).sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 6);

    const fotos = HojaVida.fotosImpresas(u);
    const secciones = HojaVida.secciones(u).map(s => {
      const cols = Math.min(4, s.campos.length), resto = s.campos.length % cols;
      return sec(s.t, '<div class="sst-g" style="grid-template-columns:repeat(' + cols + ',1fr)">' + s.campos.map((c, i) =>
        '<div class="sst-c"' + (resto && i === s.campos.length - 1 ? ' style="grid-column:span ' + (cols - resto + 1) + '"' : '') + '><small>' +
        esc(HojaVida.etiqueta(c, u)) + '</small><span>' + esc(HojaVida.texto(u, c)) + '</span></div>').join('') + '</div>');
    }).join('');
    const d = HojaVida.conDotacion(u) ? HojaVida.ultimaDotacion(u) : null;
    const dotacion = !HojaVida.conDotacion(u) ? '' : sec((u.tipo === 'maquinaria' ? 'Dotación de la máquina' : 'Dotación del vehículo') +
        (d ? ' · revisada el ' + Fecha.corta(d.fecha) : ' · sin revisar'),
      DOTACION.map(g => '<div class="sst-sub">' + esc(g.t) + '</div><div class="sst-dot">' + g.items.map(i =>
        '<span class="sst-ck"><i>' + (d && !(d.falta || []).includes(i) ? '✓' : '') + '</i>' + esc(i) + '</span>').join('') + '</div>').join(''));
    return '<div class="sst-head"><div class="dp-logo">' +
        (MARCA.ok ? '<img src="' + MARCA.logo + '" alt="SINUGRAVAS S.A.S.">' : '<div class="lg-txt">SINUGRAVAS<small>SISTEMA DE GESTIÓN DE FLOTA</small></div>') + '</div>' +
        '<div class="sst-t">Hoja de vida y mantenimiento de parque automotor</div>' +
        '<div class="sst-cod"><div>Código: SST-FRT-026</div><div>Fecha de creación: 14-03-2024</div><div>Versión: 001</div>' +
          '<div>Impresa el ' + hoyISO.split('-').reverse().join('/') + '</div></div></div>' +
      '<div class="sst-banda">SINUGRAVAS S.A.S. · ' + esc(titulo) + '</div>' +
      secciones + dotacion +
      /* Las fotos van en filas de dos: la sección se puede partir entre hojas,
         pero solo entre filas */
      sec('Registro fotográfico', fotos.length ? '<div class="sst-fotos">' + fotos.reduce((filas, f, i) => {
          const fig = '<figure class="sst-fig"><div class="sst-img">' + (f.src ? '<img src="' + attr(f.src) + '" alt="">' : '<span>' + esc(f.aviso) + '</span>') +
            '</div><figcaption>' + esc(f.txt) + '</figcaption></figure>';
          if (i % 2 === 0) filas.push(fig); else filas[filas.length - 1] += fig;
          return filas;
        }, []).map(fila => '<div class="sst-fila">' + fila + '</div>').join('') + '</div>'
        : '<div class="sst-vacio">Sin fotos registradas.</div>', 'sst-libre') +
      sec('Documentos', '<table class="dp-tbl"><thead><tr><th>Documento</th><th>Archivo</th><th>Vence</th><th>Estado</th></tr></thead><tbody>' +
        (req.length ? req.map(t => {

          return '<tr><td>' + esc(DOC_TIPOS[t].nombre) + '</td><td>' + esc(x && x.archivo ? x.archivo : '—') + '</td>' +
            '<td>' + esc(x && x.vence ? Fecha.corta(x.vence) : DOC_TIPOS[t].vence ? '—' : 'No vence') + '</td><td>' + esc(s.txt) + '</td></tr>';
        }).join('') : '<tr><td colspan="4">Este tipo de unidad no tiene documentos obligatorios.</td></tr>') + '</tbody></table>') +
      sec('Últimos mantenimientos', '<table class="dp-tbl"><thead><tr><th style="width:26mm">Fecha</th><th style="width:24mm">Tipo</th><th>Trabajo</th><th>Proveedor</th></tr></thead><tbody>' +
        (ms.length ? ms.map(m => '<tr><td>' + esc(Fecha.corta(m.fecha)) + '</td><td>' + (m.tipo === 'preventivo' ? 'Preventivo' : 'Correctivo') + '</td>' +
          '<td>' + esc(m.trabajo) + '</td><td>' + esc((Q.proveedor(m.prov) || {}).nombre || '—') + '</td></tr>').join('')
          : '<tr><td colspan="4">Sin mantenimientos registrados.</td></tr>') + '</tbody></table>') +
      this.firmas([['Responsable de flota', 'Elaboró']]) +
      this.pie('Hoja de vida ' + UI.placaTxt(u) + ' · SST-FRT-026');
  }
};

  /* ----------------------------------------------------------- Comparendos */

    const det = c => c.estado === 'con' ? [c.infraccion, c.valor ? Money.format(c.valor) : '', c.fecha ? Fecha.corta(c.fecha) : ''].filter(Boolean).join(' · ') : '—';

      '<div class="mrow-t"><b>' + esc(titulo) + '</b><span>' + esc(sub) + '</span></div><div class="mrow-r">' + (con ? UI.pill('bad', con + ' con comparendo') : UI.pill('ok', 'Sin comparendos')) + '</div></div>';
    const html =
      UI.head('Comparendos', 'Revisión de ' + mesCorto + ' · los primeros días de cada mes, unidad por unidad',
        '<button class="btn btn-primary" data-act="informeComparendos">' + Icon('send', '', 14) + 'Informe para el primer piso</button>') +
      '<div class="grid g32 mb16">' +
        '<div class="card"><div class="card-b"><div class="mes">' +
          '<div><div class="mes-n">' + (tot - n('pend')) + '<small> de ' + tot + '</small></div><div class="txt-3 fs12 mt4">unidades revisadas en ' + esc(mesCorto) + '</div></div>' +
          '<div class="f1"><div class="bar"><i style="width:' + pct('sin') + ';background:var(--ok-500)"></i><i style="width:' + pct('con') + ';background:var(--dang-500)"></i></div>' +
          '<div class="leyenda"><span><i style="background:var(--ok-500)"></i>Sin comparendos (' + n('sin') + ')</span>' +
            '<span><i style="background:var(--dang-500)"></i>Con comparendo (' + n('con') + ')</span>' +
            '<span><i style="background:var(--surface-3);border:1px solid var(--border-strong)"></i>Sin revisar (' + n('pend') + ')</span></div></div>' +
        '</div></div></div>' +
        UI.card('Informes enviados', '<div class="mlist">' +

          '</div>', { flush: true, sub: 'Al área del primer piso' }) +
      '</div>' +
      '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Unidad</th><th>Consulta</th><th>Resultado de ' + esc(mesCorto) + '</th><th>Detalle</th><th>Soporte</th></tr></thead><tbody>' +
        us.map(u => {
          const c = u.comp;
          const b = (v, ic, t) => '<button class="' + (c.estado === v ? 'on-' + v : '') + '" data-act="marcarComp" data-u="' + u.id + '" data-v="' + v + '">' + Icon(ic, '', 12) + t + '</button>';
          return '<tr><td><div data-act="irUnidad" data-u="' + u.id + '" data-tab="comp" style="cursor:pointer">' + UI.unidadCelda(u) + '</div></td>' +
            '<td>' + UI.botonSimit(u) + '</td>' +

    return { titulo: 'Comparendos', sub: 'Revisión mensual por unidad', html };

  /* ----------------------------------------------------------- Proveedores */

      }).join('') + '</div>';

  /* --------------------------------------------------------- Configuración */
  configuracion() {

        UI.card('Documentos obligatorios por tipo de unidad', '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tipo</th>' +

      '</div>' +
      UI.card('Política de archivos', '<ul class="ul-check ul-pol">' + [
          ['Foto de la unidad y tarjeta de propiedad', 'Se guardan tal cual se adjuntan, sin comprimir, con toda su calidad.'],
          ['PDF y fotos de los demás documentos', 'Compresión ligera: se busca bajar entre el 20 y el 30 % del peso sin tocar la resolución, para que se sigan leyendo igual.'],
          ['Lo que se guarda tal cual', 'Los PDF con firma digital (comprimirlos invalidaría la firma), las imágenes PNG y lo que no baje de peso sin perder calidad.']
        ].map(r => '<li>' + Icon('check', '', 15) + '<div><b>' + esc(r[0]) + '.</b> ' + esc(r[1]) + '</div></li>').join('') + '</ul>',
        { sub: 'Se aplica sola al adjuntar', cls: 'mb16' }) +
      /* Todo vive en la nube; la copia es para tenerlo además fuera de ella */
      (() => {
        const ultima = Prefs.get('ultimaCopia');
        return UI.card('Datos y copias de seguridad',
          '<p class="txt-2 mb12">Todo lo que registra queda guardado en la nube (Supabase) y se ve igual desde cualquier equipo con su cuenta. ' +
            'Si quiere tenerlo además fuera de la nube, descargue una copia de vez en cuando: trae los datos, las fotos y los documentos.</p>' +
          '<div class="flex g8" style="flex-wrap:wrap"><button class="btn btn-primary" data-act="descargarCopia">' + Icon('download', '', 14) + 'Descargar copia de seguridad</button></div>' +
          '<div class="txt-3 fs12 mt8">' + (ultima ? 'Última copia descargada el ' + esc(Fecha.larga(ultima)) + '.' : 'Todavía no ha descargado ninguna copia.') + '</div>',
          { sub: 'En la nube', cls: 'mb16' });

          '¿A la maquinaria y a los remolques también se les revisan comparendos?'
        ].map(q => '<li>' + Icon('info', '', 15) + esc(q) + '</li>').join('') + '</ul>') +
        UI.card('Empresa', (MARCA.ok ? '<div class="logo-plate"><img src="' + MARCA.logo + '" alt="Logo de SINUGRAVAS S.A.S."></div>'
            : '<div class="flex aic g12"><div class="sb-logo" style="width:46px;height:46px;font-size:16px;border-radius:11px">SG</div>' +
              '<div><b>SINUGRAVAS</b><div class="txt-3 fs12">Sistema de Gestión de Flota</div></div></div>') +
          '<div class="alert a-info mt16">' + Icon('info') + '<div>El logo sale en la barra lateral, en la pestaña del navegador y en los formatos que se imprimen. ' +
            'El color de la plataforma es el azul de su «S».</div></div>') +

          Shell.nav('configuracion');
          Toast.show('Ahora se avisa con <b>' + v + ' días</b> de anticipación.');

      }
    };
  }
});

Object.assign(Ventanas, {
  /* Vista previa de un formato, lista para imprimir o guardar como PDF */
  vistaPrevia(titulo, html, extra) {
    const m = Modal.abrir({
      titulo, sub: 'Se imprime o se guarda como PDF desde la ventana de impresión', ancho: 'xwide', sinFoco: true,
      cuerpo: '<div class="preview-shell"><div class="doc-page">' + html + '</div></div>',
      pie: (extra || '') + '<button class="btn" data-act="cerrarModal">Cerrar</button>' +
        '<button class="btn btn-primary" data-act="imprimirVista">' + Icon('print', '', 14) + 'Imprimir o guardar PDF</button>'
    });
    m._doc = '<div class="doc-page">' + html + '</div>';
    return m;
  },

  preventivo(o) {
    o = o || {};
    const m = Modal.abrir({
      titulo: 'Mantenimiento preventivo', sub: 'Cambio de aceite y el PDF de inspección rápida de Navitrans',
      cuerpo:
        '<div class="row"><div class="field"><label>Unidad</label><select class="inp" id="mpU">' + Opc.unidades(o.u) + '</select></div>' +
        '<div class="field"><label>Fecha</label><input class="inp" type="date" id="mpF" value="' + hoyISO + '"></div></div>' +
        '<div class="row"><div class="field"><label>Proveedor</label><select class="inp" id="mpP">' + Opc.proveedores('p1') + '</select></div>' +
        '<div class="field"><label>Kilometraje u horómetro</label><input class="inp" id="mpL" placeholder="Ej.: 183.500 km">' +
          '<div class="hint">En un cambio de aceite, desde aquí se cuenta el próximo.</div></div></div>' +
        '<div class="row"><div class="field" style="flex:2 1 220px"><label>Trabajo</label><input class="inp" id="mpT" value="Cambio de aceite y filtros"></div>' +
        '<div class="field" style="flex:1 1 140px"><label>Valor</label><input class="inp" id="mpV" inputmode="numeric" placeholder="Ej.: 850.000">' +
          '<div class="hint">Si se pagó con orden de compra, déjelo vacío.</div></div></div>' +
        Dz.html('mpDz', 'PDF de inspección rápida', 'El que manda Navitrans por WhatsApp: arrástrelo aquí o haga clic', 'application/pdf,image/*', false),
      pie: '<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-primary" data-act="guardarPreventivo">' + Icon('save', '', 14) + 'Guardar</button>'
    });
    Dz.bind('mpDz', files => { m._archivo = files[0]; Dz.lista('mpDz', [files[0]], 'documento'); });
    /* Se propone la última lectura de la unidad, mientras no se escriba otra */
    let propuesta = '';
    const proponer = () => {
      const u = Q.unidad($('#mpU', m).value), a = Aceite.aplica(u) ? Aceite.actual(u) : null, inp = $('#mpL', m);
      if (inp.value && inp.value !== propuesta) return;
      inp.value = propuesta = a ? Aceite.fmt(u, a.valor) : '';
    };
    $('#mpU', m).addEventListener('change', proponer);
    proponer();
  },

  /* Una lectura del kilometraje o del horómetro escrita a mano (la de cada
     día llega sola del preoperacional) */
  lectura(o) {
    o = o || {};
    const u0 = (o.u && Q.unidad(o.u)) || Datos.unidades.find(Aceite.aplica);
    if (!u0) { Toast.show('No hay camiones ni maquinaria para registrarles lectura.', 'warn'); return; }
    const m = Modal.abrir({
      titulo: 'Registrar lectura', sub: 'El kilometraje de un camión o el horómetro de una máquina',
      cuerpo:
        '<div class="row"><div class="field" style="flex:2 1 240px"><label>Unidad</label><select class="inp" id="lcU">' + Opc.unidades(u0.id, false, ['carga', 'maquinaria']) + '</select></div>' +
        '<div class="field" style="flex:1 1 140px"><label>Fecha</label><input class="inp" type="date" id="lcF" value="' + hoyISO + '"></div></div>' +
        '<div class="field mb0"><label id="lcL">Lectura</label><input class="inp" id="lcV" inputmode="numeric"><div class="hint" id="lcH"></div></div>' +
        '<div id="lcAviso"></div>',
      pie: '<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-primary" data-act="guardarLectura">' + Icon('save', '', 14) + 'Guardar</button>'
    });
    const pintar = () => {
      const u = Q.unidad($('#lcU', m).value), a = Aceite.actual(u);
      $('#lcL', m).textContent = u.tipo === 'maquinaria' ? 'Horómetro (horas)' : 'Kilometraje (km)';
      $('#lcV', m).placeholder = a ? 'Ej.: ' + Aceite.fmt(u, a.valor + (u.tipo === 'maquinaria' ? 8 : 250)) : '';
      $('#lcH', m).textContent = a ? 'La última: ' + Aceite.fmt(u, a.valor) + ', ' + Fecha.corta(a.fecha) + '.' : 'Todavía no tiene lecturas.';
      $('#lcAviso', m).innerHTML = '';
      m._aviso = false;
    };
    $('#lcU', m).addEventListener('change', pintar);
    $('#lcV', m).addEventListener('input', () => { $('#lcAviso', m).innerHTML = ''; m._aviso = false; });
    pintar();
  },

  /* La frecuencia y el último cambio de una unidad. El último cambio se
     actualiza solo al registrar un cambio de aceite; aquí se corrige o se
     pone el primero. */
  controlAceite(u) {
    const a = u.aceite || {}, med = Aceite.medida(u);
    Modal.abrir({
      titulo: 'Control del aceite · ' + UI.placaTxt(u), sub: esc(TIPOS[u.tipo].nombre + ' · ' + u.clase + (UI.nombre(u) ? ' ' + UI.nombre(u) : '')),
      cuerpo:
        '<div class="row"><div class="field" style="flex:1 1 160px"><label>Cambio cada (' + med + ')</label><input class="inp" id="caF" inputmode="numeric" value="' +
          (a.frecuencia ? a.frecuencia.toLocaleString('es-CO') : '') + '" placeholder="' + (med === 'h' ? 'Ej.: 250' : 'Ej.: 20.000') + '"></div>' +
        '<div class="field" style="flex:1 1 160px"><label>Último cambio (' + med + ')</label><input class="inp" id="caU" inputmode="numeric" value="' +
          (a.ultimo != null ? a.ultimo.toLocaleString('es-CO') : '') + '"></div>' +
        '<div class="field" style="flex:1 1 150px"><label>Fecha del último cambio</label><input class="inp" type="date" id="caD" value="' + attr(a.ultimoFecha || '') + '"></div></div>' +
        '<div class="hint">El último cambio se pone al día solo cuando se registra un cambio de aceite. Aquí se corrige, o se pone el primero.</div>',
      pie: '<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-primary" data-act="guardarAceite" data-u="' + u.id + '">' +
        Icon('save', '', 14) + 'Guardar</button>'
    });
  },

  /* Correctivo: las fotos que hoy van al grupo de WhatsApp se juntan aquí,
     cada una con lo que muestra, y salen en el PDF del historial */
  correctivo(o) {
    o = o || {};
    const m = Modal.abrir({

/* Lo que se escribe en los formularios de correctivo y de orden de compra */
const Leer = {
  correctivo(m) {
    return {
      numero: Num.mc(), unidad: Q.unidad($('#mcU', m).value), prov: Q.proveedor($('#mcP', m).value),
      entrada: $('#mcE', m).value || hoyISO, salida: $('#mcS', m).value, trabajo: $('#mcT', m).value.trim(), fotos: m._fotos.slice(),
      valor: Leer.pesos($('#mcV', m).value)
    };
  },
  /* «$ 850.000», «850.000» o «850000»: solo cuentan los dígitos */
  pesos: v => +String(v || '').replace(/[^\d]/g, '') || 0,
  oc(m) {
    const items = m._items.filter(i => i.d.trim() || i.v).map(i => ({ d: i.d.trim() || 'Sin descripción', c: +i.c || 1, v: +i.v || 0 }));
    return {
      numero: Num.oc(), fecha: hoyISO, prov: $('#ocP', m).value, unidad: $('#ocU', m).value || null,
      concepto: $('#ocC', m).value.trim() || (items[0] ? items[0].d : 'Compra a crédito'),
      plazo: +$('#ocPl', m).value, estado: 'borrador', items, cotizacion: m._archivo ? m._archivo.name : '', obs: $('#ocO', m).value.trim()
    };
  }
};

Object.assign(Acciones, {
  filtroMant(el) {
    UIState.mant = el.dataset.v;
    if (Router.actual().vista === 'mantenimientos') Router.pintar(true); else Router.ir('mantenimientos');
  },
  periodoDash(el) { UIState.dash = el.dataset.v; Router.pintar(true); },
  filtroInsp(el) { UIState.insp = el.dataset.v; Router.pintar(true); },
  filtroOC(el) {
    UIState.oc = el.dataset.v;
    if (Router.actual().vista === 'compras') Router.pintar(true); else Router.ir('compras');
  },
  imprimirVista(el) { Imprimir.doc(el.closest('.modal-bd')._doc); },
  hojaDeVida(el) {
    const u = Q.unidad(el.dataset.u);
    const m = Ventanas.vistaPrevia('Hoja de vida · ' + UI.placaTxt(u), Formatos.hojaDeVida(u));
    /* Si la tarjeta o el VIN se adjuntaron en PDF, su primera página se vuelve
       imagen y la hoja se dibuja otra vez con ella */
    const pdfs = [HojaVida.tarjeta(u), HojaVida.vin(u)].filter(t => t && t.pdf && !PdfImagen.hechas.has(t.url) && !PdfImagen.fallos.has(t.url));
    if (!pdfs.length) return;
    Promise.all(pdfs.map(t => PdfImagen.de(t.url).catch(() => { PdfImagen.fallos.add(t.url); }))).then(() => {
      if (!document.body.contains(m)) return;
      const html = Formatos.hojaDeVida(u);
      $('.doc-page', m).innerHTML = html;
      m._doc = '<div class="doc-page">' + html + '</div>';
    });
  },

  nuevoPreventivo(el) { Ventanas.preventivo({ u: el.dataset.u }); },
  async guardarPreventivo(el) {
    if (el.disabled) return;
    const m = el.closest('.modal-bd'), u = Q.unidad($('#mpU', m).value);
    /* El PDF de Navitrans se comprime poco, según la política */
    const a = m._archivo ? await Archivos.conBoton(el, () => Archivos.preparar(m._archivo)) : null;
    const fecha = $('#mpF', m).value || hoyISO, trabajo = $('#mpT', m).value.trim() || 'Cambio de aceite', lectura = $('#mpL', m).value.trim();
    Datos.mantenimientos.push({
      id: 'mt' + Date.now(), unidad: u.id, tipo: 'preventivo', fecha, prov: $('#mpP', m).value, trabajo, lectura, valor: Leer.pesos($('#mpV', m).value) || undefined,
      adjunto: a ? a.nombre : 'Inspección rápida ' + u.placa + '.pdf', adjuntoId: a ? a.id : undefined, estado: 'cerrado', hora: ahora(), ts: marca()
    });
    /* Si fue un cambio de aceite, su kilometraje u horómetro es el nuevo punto
       de partida para el próximo */
    const n = Leer.pesos(lectura), reinicia = Aceite.aplica(u) && n && /aceite/i.test(trabajo);
    if (reinicia) {
      u.aceite = Object.assign({ frecuencia: null }, u.aceite, { ultimo: n, ultimoFecha: fecha });
      Aceite.leer(u, fecha, n, 'cambio');
    }
    Modal.cerrar(m);

/* ==========================================================================
   §P  PREOPERACIONALES — la inspección diaria que cada conductor envía desde
       el celular, sin usuario (el formulario de §F, «?preoperacional»). No van en Datos ni
       en la sincronización: son muchos y aquí no se editan; se traen de la
       nube cuando se miran. El kilometraje de cada uno sí llega solo a
       Cambios de aceite, como lectura.
       El PDF y la firma de cada uno se bajan por su ruta, sin anotarlos entre
       los archivos de Datos: así la limpieza del depósito nunca los borra.
   ========================================================================== */
const Preop = {
  COLUMNAS: 'id,unidad_id,conductor_id,placa,tipo_vehiculo,fecha,kilometraje,conductor_nombre,documento,licencia,categoria,vigencia_licencia,' +
    'supervisor,observaciones,respuestas,buenos,regulares,malos,no_aplica,sin_marcar,firma_ruta,pdf_ruta,pdf_hash,archivos_listos,evidencia,recibido',
  /* El encabezado del formulario: todos se muestran o no, y son obligatorios
     o no, según el formato. Los marcados con true, si el formato no dice
     nada, salen y son obligatorios (como siempre fueron). */
  CAMPOS: [['placa', 'Placa del vehículo', true], ['tipo', 'Tipo de vehículo', true], ['fecha', 'Fecha de inspección', true],
    ['kilometraje', 'Kilometraje'], ['documento', 'Documento de identidad', true], ['nombre', 'Nombre y apellidos', true],
    ['licencia', 'Licencia de conducción'], ['categoria', 'Categoría'], ['vigencia', 'Vigencia licencia'], ['observaciones', 'Observaciones']],
  /* Las respuestas y los colores de siempre (los mismos del formulario, §F) */
  OPCIONES: [
    { id: 'B', boton: 'B', nombre: 'Bueno', color: '#16a34a', cuenta: 'bien' },
    { id: 'R', boton: 'R', nombre: 'Regular', color: '#ea580c', cuenta: 'novedad' },
    { id: 'M', boton: 'M', nombre: 'Malo', color: '#dc2626', cuenta: 'grave' },
    { id: 'N/A', boton: 'N/A', nombre: 'No aplica', color: '#7c3aed', cuenta: 'no_aplica' }
  ],
  COLORES: { principal: '#20449a', oscuro: '#193680', acento: '#e8830e' },
  /* Cómo cuenta cada respuesta en el sistema */
  CUENTA: { bien: 'Está bien', novedad: 'Es novedad', grave: 'Es novedad grave', no_aplica: 'No aplica' },
  formato: null,     // el formulario que llenan los conductores, como está en la nube
  errorFormato: null,
  cache: {},         // lo traído: clave → { filas, t (cuándo), error }
  trayendo: {},
  completos: {},     // los envíos abiertos, completos (con su formato), por id
  filtro: { periodo: '7', unidad: '' },
  borrador: null,    // el formulario mientras se edita
  abiertas: null,    // las secciones abiertas en el editor

  tipos() { return (this.formato && this.formato.tipos) || ['carga', 'remolque']; },
  aplica(u) { return Boolean(u) && this.tipos().includes(u.tipo); },
  unidades() { return ORDEN.flatMap(t => Datos.unidades.filter(u => u.tipo === t && this.aplica(u))); },
  /* Ante la duda (si no se supo el acceso) no se esconde nada: las reglas de la nube igual protegen */
  puede(a) { return Cuenta.admin || Cuenta.acciones.includes(a) || !Cuenta.rol; },
  /* El formulario de los conductores es esta misma página con «?preoperacional» (§F) */
  enlace() {
    const url = new URL(location.href);
    url.hash = '';
    url.pathname = url.pathname.replace(/index\.html$/, '');
    url.search = '?preoperacional' + (new URLSearchParams(location.search).get('nube') === 'local' ? '&nube=local' : '');
    return url.href;
  },
  tituloSec: s => String(s.titulo || '').replace(/^\s*\d+\s*[.)-]\s*/, ''),

  /* ---------------- Traer de la nube ---------------- */
  async leer(filtro) {
    const todas = [];
    for (let desde = 0; ; desde += 1000) {
      const lote = await Nube.pedir('preoperacionales?select=' + this.COLUMNAS + '&' + filtro + '&order=recibido.desc&limit=1000&offset=' + desde);
      todas.push.apply(todas, lote || []);
      if (!lote || lote.length < 1000) return todas;
    }
  },
  async traerFormato() {
    const r = await Nube.pedir('preop_formato?select=*&id=eq.vehiculos');
    this.formato = (r && r[0]) || null;
    this.errorFormato = null;
    return this.formato;
  },
  /* Lo que se mira sale de la memoria. Si no está, o ya tiene más de un
     minuto, se trae otra vez y al llegar se vuelve a pintar. */
  datos(clave, filtro) {
    const c = this.cache[clave];
    if ((!c || Date.now() - c.t > 60000) && !this.trayendo[clave]) {
      this.trayendo[clave] = Promise.all([this.leer(filtro), this.traerFormato()])
        .then(r => { this.cache[clave] = { filas: r[0], t: Date.now() }; })
        .catch(e => { this.cache[clave] = Object.assign({ filas: [] }, c, { t: Date.now(), error: e }); })
        .finally(() => { delete this.trayendo[clave]; this.repintar(clave); });
    }
    return c || null;
  },
  pedirFormato() {
    if (this.formato || this.trayendo.formato) return;
    this.trayendo.formato = this.traerFormato()
      .catch(e => { this.errorFormato = e; })
      .finally(() => {
        delete this.trayendo.formato;
        const r = Router.actual();
        if ($('#vista') && r.vista === 'preoperacionales' && r.id === 'formulario') Router.pintar(true);
      });
  },
  repintar(clave) {
    const r = Router.actual();
    if (!$('#vista')) return;   // todavía en la pantalla de entrada
    if (r.vista === 'preoperacionales' && !r.id && clave === 'lista') Router.pintar(true);
    else if (r.vista === 'unidad' && UIState.tab === 'preop' && clave === 'unidad:' + r.id && $('#tabBody')) $('#tabBody').innerHTML = Vistas.tab_preop(Q.unidad(r.id));
  },
  olvidar() { this.cache = {}; this.completos = {}; },
  buscar(id) {
    if (this.completos[id]) return this.completos[id];
    for (const c of Object.values(this.cache)) {
      const p = (c.filas || []).find(x => x.id === id);
      if (p) return p;
    }
    return null;
  },

  /* ---------------- Cómo se muestra ---------------- */
  dia(f, larga) { return f === hoyISO ? 'Hoy' : f === Fecha.rel(-1) ? 'Ayer' : larga ? Fecha.larga(f) : Fecha.corta(f); },
  hora(ts, seg) {
    return ts ? new Date(ts).toLocaleTimeString('es-CO', seg ? { hour: 'numeric', minute: '2-digit', second: '2-digit' } : { hour: 'numeric', minute: '2-digit' }) : '';
  },
  km: v => (v == null ? '—' : Math.round(v).toLocaleString('es-CO') + ' km'),
  novedades: p => (p.regulares || 0) + (p.malos || 0),
  resultado(p) {
    const n = this.novedades(p);
    return n ? UI.pill(p.malos ? 'bad' : 'warn', n + (n === 1 ? ' novedad' : ' novedades')) : UI.pill('ok', 'Sin novedades');
  },
  /* El celular: lo que mandó la página o, si no, lo que dice el navegador */
  celular(e) {
    if (e.celular) return e.celular;
    const ua = e.navegador || '';
    if (!ua) return '';
    const so = /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iPhone' : /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'Mac' : '';
    const nav = /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /EdgA?\//.test(ua) ? 'Edge' : /CriOS|Chrome\//.test(ua) ? 'Chrome'
      : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '';
    return [nav, so].filter(Boolean).join(' en ');
  },
  evidencia(p) {
    const e = p.evidencia || {}, cel = this.celular(e), u = e.ubicacion;
    const ic = (si, nombre, t) => '<span class="' + (si ? 'si' : '') + '" title="' + attr(t) + '">' + Icon(nombre, '', 15) + '</span>';
    return '<span class="ev">' + ic(true, 'clock', 'Hora del servidor: ' + this.hora(p.recibido, true)) +
      ic(cel, 'movil', cel ? 'Celular: ' + cel + (e.ip ? ' · IP ' + e.ip : '') : 'Sin datos del celular') +
      ic(u, 'pin', u ? 'Con ubicación' + (u.precision ? ' (± ' + u.precision + ' m)' : '') : 'Sin ubicación') + '</span>';
  },
  botonesPdf(p) {
    if (!p.archivos_listos) return '<span class="txt-3 fs11 nowrap" title="El celular lo sube apenas tenga señal">PDF en camino</span>';
    return '<button class="btn btn-sm btn-ghost btn-icon btn-file" data-act="pdfPreop" data-p="' + attr(p.id) + '" title="Ver el PDF" aria-label="Ver el PDF">' +
      Icon('pdf', '', 16) + '</button><button class="btn btn-sm btn-ghost btn-icon" data-act="imprimirPreop" data-p="' + attr(p.id) + '" title="Imprimir el PDF" ' +
      'aria-label="Imprimir el PDF">' + Icon('print', '', 15) + '</button>';
  },
  cargando: t => '<div class="flex aic g8 txt-2" style="justify-content:center;padding:40px 16px"><span class="spin"></span>' + esc(t) + '</div>',
  alertaError(e, act) {
    const falta = e && (e.status === 404 || /PGRST205|42P01/.test(e.codigo || ''));
    return '<div class="alert a-warn mb16">' + Icon('warn') + '<div><b>' + (falta ? 'La nube todavía no está lista para los preoperacionales.' : 'No se pudieron traer los preoperacionales.') +
      '</b> ' + esc(falta ? 'Falta el paso 007 en Supabase.' : (e && e.message) || '') +
      (act ? ' <span class="link" data-act="' + act + '">Intentar otra vez</span>' : '') + '</div></div>';
  },

  /* ---------------- La lista del día ---------------- */
  vistaLista() {
    const titulo = 'Preoperacionales', sub = 'Inspección diaria desde el celular';
    const head = UI.head('Preoperacionales', 'La inspección diaria que los conductores envían desde el celular',
      '<button class="btn" data-ir="preoperacionales/formulario">' + Icon('edit', '', 14) + 'Editar formulario</button>');
    /* Una sola consulta sirve para los tres períodos y para la semana */
    const desde = [Fecha.rel(-6), hoyISO.slice(0, 8) + '01'].sort()[0];
    const c = this.datos('lista', 'fecha=gte.' + desde);
    if (!c) return { titulo, sub, html: head + UI.card('Envíos', this.cargando('Trayendo los preoperacionales…')) };
    if (c.error && !c.filas.length) return { titulo, sub, html: head + this.alertaError(c.error, 'preopRecargar') };
    const filas = c.filas, us = this.unidades(), f = this.filtro;
    const hoy = filas.filter(p => p.fecha === hoyISO), conHoy = new Set(hoy.map(p => p.unidad_id));
    const faltan = us.filter(u => !conHoy.has(u.id));
    const semana = filas.filter(p => p.fecha >= Fecha.rel(-6));
    const novSemana = semana.reduce((s, p) => s + this.novedades(p), 0);
    const ult = filas.find(p => p.kilometraje != null), uu = ult && Q.unidad(ult.unidad_id);
    const kpis = '<div class="kpis4">' +
      UI.kpi({ label: 'Enviados hoy', valor: us.filter(u => conHoy.has(u.id)).length + '<small> de ' + us.length + '</small>', icono: 'checkSquare',
        color: 'var(--ok-500)', meta: 'Vehículos que lo deben enviar' }) +
      UI.kpi({ label: 'Con novedades hoy', valor: hoy.filter(p => this.novedades(p)).length, icono: 'warn', color: 'var(--warn-500)', meta: 'Con alguna respuesta que es novedad' }) +
      UI.kpi({ label: 'Último kilometraje', valor: ult ? esc(Math.round(ult.kilometraje).toLocaleString('es-CO')) : '—', icono: 'medidor',
        meta: ult ? esc((uu ? UI.placaTxt(uu) : ult.placa || 'Sin placa') + ' · ' + this.dia(ult.fecha).toLowerCase() + ' ' + this.hora(ult.recibido)) + ' · pasa a Cambios de aceite'
          : 'Llega con el próximo preoperacional' }) +
      UI.kpi({ label: 'Novedades esta semana', valor: novSemana, icono: 'clipboard', color: 'var(--dang-500)',
        meta: 'En ' + semana.filter(p => this.novedades(p)).length + ' preoperacional(es)' }) + '</div>';
    const pendientes = UI.card('Sin preoperacional hoy', faltan.length
      ? '<div class="mlist">' + faltan.map(u => '<div class="mrow" data-act="irUnidad" data-u="' + attr(u.id) + '" data-tab="preop">' + UI.thumb(u) +
          '<div class="mrow-t"><b class="mono">' + esc(UI.placaTxt(u)) + '</b><span>' + esc([u.clase, UI.nombre(u)].filter(Boolean).join(' · ')) + '</span></div>' +
          '<div class="mrow-r">' + UI.pill('warn', 'Falta hoy') + '</div></div>').join('') + '</div>'
      : us.length ? '<div class="empty" style="padding:18px 12px">' + Icon('check') + '<h4>Todos lo enviaron</h4><p>Aquí sale cada vehículo que todavía no lo ha enviado hoy.</p></div>'
        : UI.empty('truck', 'No hay vehículos que lo llenen', 'Se escogen en «Editar formulario».'),
      { flush: faltan.length > 0, sub: faltan.length ? faltan.length + ' de ' + us.length : '' });
    const url = this.enlace();
    const enlace = UI.card('Formulario para los conductores', '<div class="enlace">' + Icon('externo', '', 14) + esc(url.replace(/^https?:\/\//, '')) + '</div>' +
      '<div class="flex g8 mt12" style="flex-wrap:wrap"><button class="btn btn-primary btn-sm" data-act="copiarEnlacePreop">' + Icon('copiar', '', 13) + 'Copiar enlace</button>' +
        '<a class="btn btn-sm" href="' + attr(url) + '" target="_blank" rel="noopener">' + Icon('externo', '', 13) + 'Abrir</a></div>' +
      '<p class="txt-3 fs12 mt12" style="line-height:1.5">Se abre en el celular sin usuario ni contraseña. Las placas y los conductores salen de lo que esté registrado aquí.</p>');
    const lim = f.periodo === 'hoy' ? hoyISO : f.periodo === 'mes' ? hoyISO.slice(0, 8) + '01' : Fecha.rel(-6);
    const lista = filas.filter(p => p.fecha >= lim && (!f.unidad || p.unidad_id === f.unidad));
    const toolbar = '<div class="toolbar"><div class="seg">' + [['hoy', 'Hoy'], ['7', 'Últimos 7 días'], ['mes', 'Este mes']].map(p =>
        '<button class="' + (f.periodo === p[0] ? 'on' : '') + '" data-act="filtroPreop" data-v="' + p[0] + '">' + p[1] + '</button>').join('') + '</div>' +
      '<select class="inp inp-sm" id="preopU" style="width:auto"><option value="">Todos los vehículos</option>' +
        us.map(u => '<option value="' + attr(u.id) + '"' + (f.unidad === u.id ? ' selected' : '') + '>' + esc(UI.placaTxt(u)) + '</option>').join('') + '</select>' +
      '<span class="tb-sp"></span><span class="txt-3 fs12">' + lista.length + (lista.length === 1 ? ' preoperacional' : ' preoperacionales') + '</span></div>';
    const tabla = lista.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Vehículo</th><th>Conductor</th><th class="num">Kilometraje</th>' +
        '<th>Resultado</th><th>Evidencia</th><th></th></tr></thead><tbody>' + lista.map(p => {
          const u = Q.unidad(p.unidad_id);
          return '<tr class="row-click" data-act="verPreop" data-p="' + attr(p.id) + '"><td class="nowrap"><b>' + esc(this.dia(p.fecha)) + '</b><div class="txt-3 fs11">' +
            esc(this.hora(p.recibido)) + '</div></td><td>' + (u ? UI.unidadCelda(u) : '<b class="mono">' + esc(p.placa || '—') + '</b>') + '</td>' +
            '<td>' + esc(p.conductor_nombre || '—') + '</td><td class="num nowrap">' + esc(this.km(p.kilometraje)) + '</td><td>' + this.resultado(p) + '</td>' +
            '<td>' + this.evidencia(p) + '</td><td class="tr nowrap">' + this.botonesPdf(p) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : UI.empty('checkSquare', 'Sin preoperacionales', f.periodo === 'hoy' ? 'Hoy todavía no ha llegado ninguno.' : 'No llegó ninguno en este período.');
    const html = head + (c.error ? this.alertaError(c.error, 'preopRecargar') : '') + kpis +
      '<div class="grid g2 mb16">' + pendientes + enlace + '</div>' + toolbar +
      UI.card('Envíos', tabla, { flush: true, sub: lista.length ? 'Clic en uno para verlo completo' : '' });
    return {
      titulo, sub, html,
      despues: () => { $('#preopU').addEventListener('change', e => { this.filtro.unidad = e.target.value; Router.pintar(true); }); }
    };
  },

  /* ---------------- Un envío, completo ---------------- */
  titulo(p) {
    const u = Q.unidad(p.unidad_id), placa = u ? UI.placaTxt(u) : p.placa;
    return 'Preoperacional' + (placa ? ' de ' + placa : ' sin placa') + ' · ' + Fecha.larga(p.fecha);
  },
  sub(p) {
    return 'Enviado desde el celular a las ' + this.hora(p.recibido) + ((p.evidencia || {}).sin_senal ? ' · se llenó sin señal y llegó después' : '');
  },
  async ver(id) {
    const base = this.buscar(id);
    const m = Modal.abrir({
      titulo: base ? this.titulo(base) : 'Preoperacional', sub: base ? esc(this.sub(base)) : 'Trayendo…', ancho: 'xwide', sinFoco: true,
      cuerpo: this.cargando('Trayendo el preoperacional…'), pie: '<button class="btn btn-primary" data-act="cerrarModal">Cerrar</button>'
    });
    let p = this.completos[id];
    if (!p) {
      try {
        p = ((await Nube.pedir('preoperacionales?select=*&id=eq.' + encodeURIComponent(id))) || [])[0];
      } catch (e) {
        if (document.body.contains(m)) $('.modal-b', m).innerHTML = '<div class="alert a-err">' + Icon('warn') + '<div><b>No se pudo traer.</b> ' + esc(e.message) + '</div></div>';
        return;
      }
      if (p) this.completos[id] = p;
    }
    if (!document.body.contains(m)) return;
    if (!p) { $('.modal-b', m).innerHTML = UI.empty('checkSquare', 'Ya no está', 'Este preoperacional se eliminó.'); return; }
    $('.modal-h h3', m).textContent = this.titulo(p);
    $('.mh-sub', m).textContent = this.sub(p);
    $('.modal-b', m).innerHTML = this.cuerpo(p);
    $('.modal-f', m).innerHTML = this.pie(p);
    this.ponerFirma(p, m);
  },
  cuerpo(p) {
    const secs = (p.formato || {}).secciones || [], R = p.respuestas || {}, e = p.evidencia || {}, u = Q.unidad(p.unidad_id);
    /* Las respuestas del formato con que se llenó: lo que dice cada una, su
       color y cómo cuenta */
    const ops = Array.isArray((p.formato || {}).opciones) && p.formato.opciones.length ? p.formato.opciones : this.OPCIONES;
    const porId = {}, n = {};
    ops.forEach(o => { porId[o.id] = o; });
    Object.keys(R).forEach(k => { n[R[k]] = (n[R[k]] || 0) + 1; });
    const CLASE = { bien: 'ok', novedad: 'warn', grave: 'bad', no_aplica: 'violet' };
    const sin = p.sin_marcar || 0, total = (p.buenos || 0) + (p.regulares || 0) + (p.malos || 0) + (p.no_aplica || 0) + sin;
    const pct = x => (total ? x / total * 100 : 0).toFixed(2) + '%';
    const marca = v => (porId[v] ? UI.pill(CLASE[porId[v].cuenta] || 'nr', porId[v].nombre) : UI.pill('nr', 'Sin marcar'));
    /* Debajo de cada novedad, lo que el conductor escribió que se ve */
    const N = p.notas || {};
    const fila = (num, it, v) => '<div class="nov"><span class="n">' + num + '</span><span class="t">' + esc(it.texto) +
      (N[it.id] ? '<small>' + esc(N[it.id]) + '</small>' : '') + '</span>' + marca(v) + '</div>';
    const esNovedad = v => porId[v] && (porId[v].cuenta === 'novedad' || porId[v].cuenta === 'grave');
    const nov = [];
    secs.forEach((s, i) => (s.items || []).forEach((it, j) => { if (esNovedad(R[it.id])) nov.push(fila((i + 1) + '.' + (j + 1), it, R[it.id])); }));
    const dl = pares => '<dl class="dl">' + pares.map(x => '<dt>' + esc(x[0]) + '</dt><dd>' + x[1] + '</dd>').join('') + '</dl>';
    const ubic = e.ubicacion;
    const hash = p.pdf_hash ? '<span class="mono">' + esc(p.pdf_hash.slice(0, 4) + ' ' + p.pdf_hash.slice(4, 8) + ' … ' + p.pdf_hash.slice(-4)) + '</span> · ' +
      '<span class="link" data-act="comprobarPreop" data-p="' + attr(p.id) + '">comprobar que no se cambió</span>' : esc('El PDF todavía no llega');
    /* La fecha de una hora del servidor, en la hora de aquí (la nube la da en UTC) */
    const diaDe = ts => Fecha.iso(new Date(ts));
    const enCel = e.hora_celular ? new Date(e.hora_celular) : null;
    const izq = UI.card('Datos', dl([
        ['Vehículo', esc([u ? UI.placaTxt(u) : p.placa, p.tipo_vehiculo].filter(Boolean).join(' · ') || '—')],
        ['Fecha', esc(Fecha.larga(p.fecha))], ['Kilometraje', esc(this.km(p.kilometraje))],
        ['Conductor', esc(p.conductor_nombre || '—')], ['Documento', esc(p.documento || '—')],
        ['Licencia', esc([p.licencia, p.categoria, p.vigencia_licencia ? 'vence el ' + Fecha.larga(p.vigencia_licencia) : ''].filter(Boolean).join(' · ') || '—')],
        ['Supervisor', esc(p.supervisor || '—')]]), { cls: 'mb16' }) +
      UI.card('Firma del conductor', '<div class="firma-p"><span class="spin"></span></div>', { cls: 'mb16' }) +
      UI.card('Evidencia', dl([
        ['Recibido', esc(Fecha.larga(diaDe(p.recibido)) + ', ' + this.hora(p.recibido, true) + ' (hora del servidor)')],
        ['En el celular', esc(enCel && !isNaN(enCel) ? (diaDe(enCel) !== diaDe(p.recibido) ? Fecha.corta(diaDe(enCel)) + ', ' : '') +
          this.hora(e.hora_celular, true) + (e.sin_senal ? ' · se llenó sin señal' : '') : '—')],
        ['IP', esc(e.ip || '—')],
        ['Celular', esc(this.celular(e) || '—')],
        ['Ubicación', ubic ? esc(ubic.lat + ', ' + ubic.lng + (ubic.precision ? ' (± ' + ubic.precision + ' m)' : '')) + ' · <a class="link" href="https://www.google.com/maps?q=' +
          encodeURIComponent(ubic.lat + ',' + ubic.lng) + '" target="_blank" rel="noopener">ver en el mapa</a>' : esc('Sin ubicación: el celular no dio el permiso')],
        ['Código del PDF', hash]]));
    const der = UI.card('Resultado', '<div class="cuenta">' + ops.map(o => '<i style="width:' + pct(n[o.id] || 0) + ';background:' + attr(o.color) + '"></i>').join('') + '</div>' +
        '<div class="leyenda-p">' + ops.map(o => '<span><i style="background:' + attr(o.color) + '"></i>' + (n[o.id] || 0) + ' ' + esc(o.nombre) + '</span>').join('') +
          (sin ? '<span><i style="background:var(--surface-3);border:1px solid var(--border-strong)"></i>' + sin + ' Sin marcar</span>' : '') + '</div>' +
        '<div class="mt16" style="font-weight:650;font-size:12.5px;margin-bottom:4px">Novedades</div>' +
        (nov.length ? nov.join('') : '<p class="txt-3 fs12">Ninguna: ninguna respuesta quedó como novedad.</p>') +
        (secs.length ? '<details class="preop-todos mt12"><summary class="link">Ver los ' + total + ' ítems</summary>' + secs.map((s, i) =>
          '<div class="preop-sec">' + (i + 1) + '. ' + esc(this.tituloSec(s)) + '</div>' + (s.items || []).map((it, j) => fila((i + 1) + '.' + (j + 1), it, R[it.id])).join('')).join('') +
          '</details>' : ''), { cls: 'mb16' }) +
      UI.card('Observaciones', p.observaciones ? '<p class="txt-2" style="font-size:13px;line-height:1.55;white-space:pre-wrap">' + esc(p.observaciones) + '</p>'
        : '<p class="txt-3 fs12">Sin observaciones.</p>');
    return '<div class="grid g2"><div>' + izq + '</div><div>' + der + '</div></div>';
  },

  /* ---------------- El PDF: verlo, imprimirlo y comprobarlo ---------------- */
  async pdf(id, imprimir) {
    const p = this.buscar(id);
    if (!p) return;
    if (!p.archivos_listos) { Toast.show('El PDF todavía no llega: el celular lo sube apenas tenga señal.', 'warn'); return; }
    const clave = 'preop:' + id, nombre = 'INSPECCION_' + (p.placa || 'SIN-PLACA') + '_' + p.fecha + '.pdf';
    if (!Archivos.vistos.get(clave)) {
      const m = Modal.abrir({
        titulo: nombre, sub: 'Abriendo el archivo…', ancho: 'wide', sinFoco: true,
        cuerpo: this.cargando('Bajando el PDF de la nube…'), pie: '<button class="btn" data-act="cerrarModal">Cerrar</button>'
      });
      const blob = await Nube.bajarRuta(p.pdf_ruta);
      if (!document.body.contains(m)) return;
      Modal.cerrar(m);
      if (!blob) { Toast.show('No se pudo abrir el PDF. Revise el internet e intente otra vez.', 'err'); return; }
      Archivos.registrar(clave, blob.type === 'application/pdf' ? blob : new Blob([blob], { type: 'application/pdf' }), nombre);
    }
    Ventanas.visor(nombre, clave);
    if (imprimir) {
      const f = $$('#modals iframe.visor-pdf').pop();
      if (f) f.addEventListener('load', () => setTimeout(() => Acciones.imprimirVisor(f), 400), { once: true });

  /* Baja el PDF y saca su código: si es el mismo que quedó al enviarlo, el
     PDF no se ha cambiado */
  async comprobar(id, el) {
    const p = this.completos[id] || this.buscar(id);
    if (!p || !p.pdf_hash || el.dataset.ocupado) return;
    el.dataset.ocupado = '1';
    el.textContent = 'comprobando…';
    let igual = null;
    try {
      const blob = await Nube.bajarRuta(p.pdf_ruta);
      if (blob) {
        const h = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());
        igual = Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, '0')).join('') === p.pdf_hash;
      }
    } catch (e) { igual = null; }
    delete el.dataset.ocupado;
    el.textContent = 'comprobar que no se cambió';
    if (igual === null) Toast.show('No se pudo bajar el PDF para comprobarlo. Revise el internet e intente otra vez.', 'err');
    else if (igual) Toast.show('El PDF está tal cual lo envió el conductor: su código coincide.');
    else Toast.show('El PDF no coincide con el código que quedó al enviarlo: se cambió después.', 'err');
  },
