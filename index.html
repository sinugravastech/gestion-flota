<script>
'use strict';
/* ==========================================================================
   §0  UTILIDADES
   ========================================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const attr = esc;

/* El logo de SINUGRAVAS viaja dentro de este mismo archivo, en el bloque
   «logo-sinugravas» que está antes de este script. De él se recorta la «S»
   con los puntos para la barra lateral y la pestaña del navegador; el logo
   completo va en Configuración y en los formatos que se imprimen. */
const MARCA = {
  logo: 'data:image/webp;base64,' + ($('#logo-sinugravas') || { textContent: '' }).textContent.replace(/\s+/g, ''),
  /* Dónde está la «S» dentro del logo, en píxeles del original (1983 × 793) */
  CAJA: { x: 44, y: 20, w: 374, h: 668 },
  ok: false,
  emblema: '',
  preparar() {
    return new Promise(listo => {
      const img = new Image();
      img.onload = () => {
        try {
          const lado = 128, borde = 10, b = this.CAJA, k = (lado - 2 * borde) / b.h, w = b.w * k;
          const c = document.createElement('canvas');
          c.width = c.height = lado;
          const g = c.getContext('2d');
          g.fillStyle = '#fff';
          if (g.roundRect) { g.beginPath(); g.roundRect(0, 0, lado, lado, 26); g.fill(); } else g.fillRect(0, 0, lado, lado);
          g.imageSmoothingQuality = 'high';
          g.drawImage(img, b.x, b.y, b.w, b.h, (lado - w) / 2, borde, w, lado - 2 * borde);
          this.emblema = c.toDataURL('image/png');
          this.ok = true;
          const ic = document.createElement('link');
          ic.rel = 'icon';
          ic.href = this.emblema;
          document.head.appendChild(ic);
        } catch (e) { /* sin logo, la barra lateral muestra «SG» */ }
        listo();
      };
      img.onerror = () => listo();
      img.src = this.logo;
      /* Si algo raro pasa, la plataforma no se queda esperando el logo */
      setTimeout(listo, 1500);
    });
  }
};

/* Preferencias de este navegador (tema, menú contraído, último correo). Si el
   navegador no deja guardar, la plataforma funciona igual: solo no las
   recuerda. */

/* Las fechas de ejemplo se cuentan desde hoy, para que los vencimientos se
   vean igual de vivos el día que se abra la maqueta. */
const HOY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const Fecha = {
  iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
  rel(n) { const d = new Date(HOY); d.setDate(d.getDate() + n); return this.iso(d); },
  parse(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); },
  corta(s) { return s ? this.parse(s).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }) : '—'; },
  larga(s) { return s ? this.parse(s).toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' }) : '—'; },
  hasta(s) { return Math.round((this.parse(s) - HOY) / 864e5); },
  hace(s) {
    if (!s) return 'sin registro';
    const n = -this.hasta(s);
    return n <= 0 ? 'hoy' : n === 1 ? 'ayer' : 'hace ' + n + ' días';
  },
  mes(d, soloMes) {
    const t = (d || HOY).toLocaleDateString('es-CO', soloMes ? { month: 'long' } : { month: 'long', year: 'numeric' });
    return t.charAt(0).toUpperCase() + t.slice(1);
  },
  mesAtras(n) { return new Date(HOY.getFullYear(), HOY.getMonth() - n, 1); }
};
const hoyISO = Fecha.iso(HOY);
const R = n => Fecha.rel(n);
const Money = {
  _f: new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }),
  format(n) { return this._f.format(n || 0); }
};

/* La dotación de los vehículos de carga y la maquinaria, como en el formato */
const DOTACION = [

/* ==========================================================================
   §4  DATOS — llegan de Supabase al entrar (ver §N). La plataforma arranca
       limpia, sin nada de ejemplo: aquí solo está la forma de cada colección.
   ========================================================================== */
const Datos = {
  conductores: [], proveedores: [], unidades: [], mantenimientos: [], ocs: [], accidentes: [],
  inspecciones: [], informes: [], lecturas: [], actividad: [],
  /* Los conductores y proveedores que se eliminan pasan aquí: ya no salen en
     las listas, pero el historial sigue mostrando su nombre */
  archivo: { conductores: [], proveedores: [] }
};

/* ==========================================================================
   §5  REGLAS — estados de documentos, inspecciones y conteos
   ========================================================================== */
const Est = {
  /* Un documento: falta, no vence, vencido, por vencer o vigente */
  doc(d, t) {
    if (!d || !d.archivo) return { k: 'miss', txt: 'Falta', det: 'No se ha subido' };
    if (!DOC_TIPOS[t] || !DOC_TIPOS[t].vence || !d.vence) return { k: 'ok', txt: 'Vigente', det: 'No vence' };
    const n = Fecha.hasta(d.vence);
    if (n < 0) return { k: 'bad', txt: 'Vencido', det: n === -1 ? 'Venció ayer' : 'Venció hace ' + (-n) + ' días', n };
    if (n <= Config.diasAviso) return { k: 'warn', txt: 'Por vencer', det: n === 0 ? 'Vence hoy' : n === 1 ? 'Vence mañana' : 'Vence en ' + n + ' días', n };
    return { k: 'ok', txt: 'Vigente', det: 'Vence en ' + n + ' días', n };
  },
  /* Una unidad toma el peor estado de sus documentos obligatorios */
  unidad(u) {
    const req = Config.req[u.tipo] || [];
    if (!req.length) return { k: 'nr', txt: 'Sin obligatorios' };
    const peso = { ok: 0, warn: 1, miss: 2, bad: 3 };
    let peor = 'ok';
    req.forEach(t => { const e = this.doc(u.docs[t], t); if (peso[e.k] > peso[peor]) peor = e.k; });
    return { k: peor, txt: { ok: 'Al día', warn: 'Por vencer', miss: 'Falta documento', bad: 'Vencido' }[peor] };
  },
  /* Las inspecciones son mensuales: hasta 30 días al día, hasta 45 pendiente */
  insp(u) {
    if (!u.insp) return { k: 'warn', txt: 'Sin inspección', n: null };
    const n = -Fecha.hasta(u.insp);
    if (n <= 30) return { k: 'ok', txt: 'Al día', n };
    if (n <= 45) return { k: 'warn', txt: 'Pendiente', n };
    return { k: 'bad', txt: 'Atrasada', n };
  }
};
const Q = {
  unidad: id => Datos.unidades.find(u => u.id === id),
  /* Si se eliminó, se busca en el archivo para que el historial conserve su nombre */
  conductor: id => Datos.conductores.find(c => c.id === id) || ((Datos.archivo || {}).conductores || []).find(c => c.id === id),
  proveedor: id => Datos.proveedores.find(p => p.id === id) || ((Datos.archivo || {}).proveedores || []).find(p => p.id === id),
  conComparendos: () => Datos.unidades.filter(u => Config.comparendos.includes(u.tipo)),
  /* Las unidades que dejan ver los filtros de la flota */
  flota() {
    const f = UIState.flota, q = f.q.trim().toLowerCase();
    return Datos.unidades.filter(u =>
      (f.tipo === 'todas' || u.tipo === f.tipo) &&
      (f.estado === 'todos' || Est.unidad(u).k === f.estado) &&
      (!q || [u.placa, UI.placaTxt(u), u.marca, u.linea, u.clase, u.alias].join(' ').toLowerCase().includes(q)));
  },
  /* Todos los documentos obligatorios, de unidades y de conductores */
  docsTodos() {
    const out = [];
    Datos.unidades.forEach(u => (Config.req[u.tipo] || []).forEach(t =>
      out.push({ quien: 'u', ref: u, t, d: u.docs[t], e: Est.doc(u.docs[t], t) })));
    Datos.conductores.forEach(c => ['licencia', 'cedula'].forEach(t =>
      out.push({ quien: 'c', ref: c, t, d: c.docs[t], e: Est.doc(c.docs[t], t) })));
    return out;
  },
  conteos() {
    const docs = this.docsTodos();
    return {
      unidades: Datos.unidades.length,
      docs: docs.filter(x => x.e.k === 'bad' || x.e.k === 'warn').length,
      taller: Datos.mantenimientos.filter(m => m.estado === 'taller').length,
      aceite: Aceite.todas().filter(e => e.k === 'bad' || e.k === 'warn').length,
      insp: Datos.unidades.filter(u => Est.insp(u).k !== 'ok').length,
      comp: this.conComparendos().filter(u => u.comp.estado === 'pend').length,
      oc: Datos.ocs.filter(o => o.estado === 'borrador').length,
      conductores: Datos.conductores.length,
      proveedores: Datos.proveedores.length
    };
  }
};

/* Actividad de cada unidad: su historia, por fecha. Mantenimientos,
   inspecciones (con la revisión de la dotación), renovaciones de SOAT,
   tecnomecánica, póliza y patente, comparendos, accidentes, compras y cambios
   de conductor. No es una auditoría de lo que se cambia en la plataforma: las
   ediciones, las fotos y los demás documentos no van aquí (Juan, 22/10/2026). */
const ahora = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
/* Sello exacto y siempre creciente: ordena lo que se registra en un mismo minuto */
let ultimoSello = 0;
const marca = () => (ultimoSello = Math.max(Date.now(), ultimoSello + 1));
/* «De Carlos a Wilmer», «Se asignó a…» o «Se quitó a…», y el motivo si lo hay */
const detConductor = (antes, despues, motivo) =>
  (!antes ? 'Se asignó a ' + despues.nombre : !despues ? 'Se quitó a ' + antes.nombre + '; queda sin asignar' : 'De ' + antes.nombre + ' a ' + despues.nombre) +
  (motivo ? ' · ' + motivo : '');
const ACT = {
  preventivo: { ic: 'tool',      c: 'var(--info-500)',   grupo: 'mant' },
  correctivo: { ic: 'camera',    c: 'var(--warn-500)',   grupo: 'mant' },
  inspeccion: { ic: 'clipboard', c: 'var(--ok-500)',     grupo: 'inspeccion' },
  dotacion:   { ic: 'checkSquare', c: 'var(--ok-500)',   grupo: 'inspeccion' },
  renovacion: { ic: 'shieldOk',  c: 'var(--brand-500)',  grupo: 'renovacion' },
  revision:   { ic: 'ticket',    c: 'var(--ink-400)',    grupo: 'comparendo' },
  comparendo: { ic: 'ticket',    c: 'var(--dang-500)',   grupo: 'comparendo' },
  accidente:  { ic: 'warn',      c: 'var(--dang-500)',   grupo: 'accidente' },
  compra:     { ic: 'cart',      c: 'var(--ink-500)',    grupo: 'compra' },
  conductor:  { ic: 'user',      c: 'var(--violet-500)', grupo: 'conductor' }
};
const GRUPOS_ACT = [['mant', 'Mantenimientos'], ['inspeccion', 'Inspecciones'], ['renovacion', 'Renovaciones'], ['comparendo', 'Comparendos'],
  ['accidente', 'Accidentes'], ['compra', 'Compras'], ['conductor', 'Conductor']];
const Actividad = {
  /* Lo que se guarda aparte son los cambios de conductor y las renovaciones
     (porque el documento nuevo reemplaza al anterior); lo demás sale de sus
     propios registros */
  registrar(u, tipo, titulo, det, adjuntos, fecha) {
    const f = fecha || hoyISO, a = { unidad: u.id, fecha: f, hora: f === hoyISO ? ahora() : '', ts: marca(), tipo, titulo, det: det || '', adjuntos: adjuntos || [] };
    Datos.actividad.push(a);
    return a;
  },
  /* La renovación de un SOAT, tecnomecánica, póliza o patente: queda con su
     archivo, aunque después se suba el siguiente. Una sola vez por documento,
     y solo de los que se subieron de verdad (los de ejemplo no). */
  renovo(u, t) {
    const d = u.docs[t];
    if (!d || !d.archivo || !d.ts || this.yaRenovo(u, t, d.ts)) return;
    Object.assign(this.registrar(u, 'renovacion', 'Renovación: ' + DOC_TIPOS[t].nombre, d.vence ? 'Vigente hasta el ' + Fecha.larga(d.vence) : 'Sin fecha de vencimiento',
      [{ n: d.archivo, id: d.archivoId }], d.subido || hoyISO), { doc: t, docTs: d.ts, hora: d.hora || '' });
  },
  yaRenovo: (u, t, ts) => Datos.actividad.some(a => a.unidad === u.id && a.tipo === 'renovacion' && a.doc === t && a.docTs === ts),
  /* La revisión de comparendos se hace a comienzo de mes: se fecha el día 3,
     o hoy si ese día todavía no ha llegado */
  diaRevision(d) { const f = Fecha.iso(new Date(d.getFullYear(), d.getMonth(), 3)); return f > hoyISO ? hoyISO : f; },
  de(u) {
    const ev = [];
    const prov = id => (Q.proveedor(id) || {}).nombre || '—';
    const adj = (n, id) => (n ? [{ n, id }] : []);
    /* Los cambios de conductor. Lo que quedó guardado de antes (ediciones,
       fotos, documentos) ya no se muestra. */
    Datos.actividad.filter(a => a.unidad === u.id && ACT[a.tipo]).forEach(a => ev.push(a));
    Datos.mantenimientos.filter(m => m.unidad === u.id).forEach(m => ev.push({
      fecha: m.fecha, hora: m.hora, ts: m.ts, tipo: m.tipo,
      titulo: (m.tipo === 'preventivo' ? 'Mantenimiento preventivo: ' : 'Mantenimiento correctivo: ') + m.trabajo,
      det: [prov(m.prov), m.lectura, m.valor ? Money.format(m.valor) : '', m.tipo === 'correctivo' ? (m.estado === 'taller' ? 'sigue en el taller' : m.salida ? 'salió el ' + Fecha.corta(m.salida) : '') : '',
        m.fotos ? m.fotos + ' fotos' : ''].filter(Boolean).join(' · '),
      adjuntos: adj(m.adjunto, m.adjuntoId) }));
    Datos.inspecciones.filter(i => i.unidad === u.id).forEach(i => {
      const c = Q.conductor(i.conductor);
      ev.push({ fecha: i.fecha, hora: i.hora, ts: i.ts, tipo: 'inspeccion', titulo: 'Inspección visual: ' + (i.resultado === 'con' ? 'con novedades' : 'sin novedad'),
        det: [c ? 'Acompañó ' + c.nombre : '', i.obs].filter(Boolean).join(' · ') });
    });
    /* Los documentos que ya estaban subidos y no tienen su renovación guardada
       (los de antes y los de ejemplo, que no traen fecha de carga: se toma un
       año antes de su vencimiento) */
    Object.keys(u.docs || {}).forEach(t => {
      const d = u.docs[t];
      if (!d || !d.archivo || !DOC_TIPOS[t] || !DOC_TIPOS[t].vence) return;
      if (d.ts && Actividad.yaRenovo(u, t, d.ts)) return;
      const f = d.subido || (d.vence ? R(Fecha.hasta(d.vence) - 365) : null);
      if (f && f <= hoyISO) ev.push({ fecha: f, hora: d.hora, ts: d.ts, tipo: 'renovacion', titulo: 'Renovación: ' + DOC_TIPOS[t].nombre,
        det: d.vence ? 'Vigente hasta el ' + Fecha.larga(d.vence) : 'Sin fecha de vencimiento', adjuntos: adj(d.archivo, d.archivoId) });
    });
    if (Config.comparendos.includes(u.tipo)) {
      const c = u.comp, mes = Fecha.mes(null, true).toLowerCase();
      if (c.estado === 'con') ev.push({ fecha: c.registrado || c.fecha || hoyISO, hora: c.hora, ts: c.ts, tipo: 'comparendo', titulo: 'Comparendo: ' + c.infraccion,
        det: [c.valor ? Money.format(c.valor) : '', c.fecha ? 'del ' + Fecha.corta(c.fecha) : '', 'revisión de ' + mes].filter(Boolean).join(' · '), adjuntos: adj(c.archivo, c.archivoId) });
      else if (c.estado === 'sin') ev.push({ fecha: c.revisado || this.diaRevision(HOY), hora: c.hora, ts: c.ts, tipo: 'revision', titulo: 'Revisión de comparendos de ' + mes + ': sin comparendos' });
      (u.compHist || []).forEach((h, i) => {
        /* Un mes que no se revisó no deja nada en la historia */
        if (!h || h.estado === 'pend' || h.estado === 'na') return;
        const m = Comparendos.fechaDe(h, i + 1), con = h.estado === 'con';
        ev.push({ fecha: h.revisado || h.registrado || this.diaRevision(m), hora: h.hora, ts: h.ts, tipo: con ? 'comparendo' : 'revision',
          titulo: 'Revisión de comparendos de ' + Fecha.mes(m, true).toLowerCase() + (con ? ': con comparendo' : ': sin comparendos'),
          det: con ? [h.infraccion, h.valor ? Money.format(h.valor) : ''].filter(Boolean).join(' · ') : '', adjuntos: con ? adj(h.archivo, h.archivoId) : [] });
      });
    }
    Datos.ocs.filter(o => o.unidad === u.id).forEach(o => ev.push({
      fecha: o.fecha, hora: o.hora, ts: o.ts, tipo: 'compra', titulo: 'Orden de compra ' + o.numero + ': ' + o.concepto,
      det: prov(o.prov) + ' · ' + Money.format(UI.totalOC(o)) + ' · ' + { borrador: 'borrador', enviada: 'enviada a facturación', pagada: 'pagada' }[o.estado] }));
    Datos.accidentes.filter(a => a.unidad === u.id).forEach(a => ev.push({
      fecha: a.fecha, hora: a.hora, ts: a.ts, tipo: 'accidente', titulo: 'Accidente', det: a.desc, adjuntos: adj(a.archivo, a.archivoId) }));
    /* Cada revisión de la dotación, con lo que faltaba: es una inspección más */
    (u.dotacion || []).forEach(d => ev.push({ fecha: d.fecha, hora: d.hora, ts: d.ts, tipo: 'dotacion', titulo: 'Se revisó la dotación',
      det: [d.falta && d.falta.length ? 'Falta: ' + d.falta.join(', ') : 'Completa', d.obs].filter(Boolean).join(' · ') }));
    return ev.map(e => Object.assign({ quien: 'Juan', det: '', adjuntos: [] }, e))
      .sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.hora || '').localeCompare(a.hora || '') || (b.ts || 0) - (a.ts || 0));
  }
};

/* La revisión de comparendos es de cada mes. La del mes en curso está en
   u.comp y las de los meses anteriores en u.compHist, la primera la del mes
   pasado. Cada una lleva su mes («2026-10»). Al entrar en un mes nuevo, la
   revisión anterior pasa sola al historial y la unidad queda «Sin revisar»;
   los meses en que nadie abrió la plataforma quedan como no revisados. */
const Comparendos = {
  mes: d => { d = d || HOY; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); },
  /* La revisión vacía de una unidad para un mes */
  nueva(u, mes) { return { estado: Config.comparendos.includes(u.tipo) ? 'pend' : 'na', mes: mes || this.mes() }; },
  /* De qué mes es una revisión que no lo dice: del día en que se revisó o se
     registró y, si no tiene, del mes en curso */
  mesDe(c) { return c.mes || (c.revisado || c.registrado || '').slice(0, 7) || this.mes(); },
  /* El primer día del mes de una revisión del historial, para mostrarla.
     Las viejas sin mes se ubican por su puesto: la primera es la del mes
     pasado. */
  fechaDe(h, puesto) { return h && h.mes ? Fecha.parse(h.mes + '-01') : Fecha.mesAtras(puesto); },
  /* Pone al día todas las unidades: la revisión que ya no es del mes en curso
     pasa al historial. «actual» es para probarlo con otro mes. Devuelve
     cuántas unidades pasaron de mes. */
  alDia(actual) {
    actual = actual || this.mes();
    let n = 0;
    Datos.unidades.forEach(u => {
      if (!u.comp) u.comp = this.nueva(u, actual);
      const m = this.mesDe(u.comp);
      if (!u.comp.mes) u.comp.mes = m;
      if (m >= actual) return;
      const [ay, am] = actual.split('-').map(Number), [my, mm] = m.split('-').map(Number);
      const entre = [];
      for (let i = 1; i < (ay - my) * 12 + (am - mm); i++) entre.push(this.nueva(u, this.mes(new Date(ay, am - 1 - i, 1))));
      u.compHist = entre.concat([u.comp], u.compHist || []);
      u.comp = this.nueva(u, actual);
      n++;
    });
    return n;
  }
};

/* ==========================================================================
   §6  PIEZAS DE INTERFAZ
   ========================================================================== */
const UI = {
  pill(k, txt, np) {
    const c = { ok: 'p-green', warn: 'p-amber', bad: 'p-red', miss: 'p-gray', nr: 'p-gray', info: 'p-blue', violet: 'p-violet' }[k] || 'p-gray';
    return '<span class="pill ' + c + (np || k === 'nr' ? ' np' : '') + '">' + esc(txt) + '</span>';
  },
  pillComp(c) {
    const e = c ? c.estado : 'pend';
    return e === 'sin' ? this.pill('ok', 'Sin comparendos') : e === 'con' ? this.pill('bad', 'Con comparendo')
      : e === 'na' ? this.pill('nr', 'No aplica') : this.pill('miss', 'Sin revisar');
  },
  pillOC(e) {
    return e === 'pagada' ? this.pill('ok', 'Pagada') : e === 'enviada' ? this.pill('info', 'Enviada a facturación') : this.pill('miss', 'Borrador');
  },
  totalOC(o) { return o.items.reduce((s, i) => s + i.c * i.v, 0); },
  placaTxt(u) { return u.tipo === 'carga' && /^[A-Z]{3}\d{3}$/.test(u.placa) ? u.placa.slice(0, 3) + ' ' + u.placa.slice(3) : u.placa; },
  placa(u, cls) {
    const cod = u.tipo === 'maquinaria' || u.tipo === 'canoa';
    return '<span class="placa' + (cod ? ' cod' : '') + (cls ? ' ' + cls : '') + '" title="' + (cod ? 'Código interno' : 'Placa') + '">' + esc(this.placaTxt(u)) + '</span>';
  },
  nombre(u) { return u.tipo === 'canoa' ? (u.alias || u.placa) : [u.marca, u.linea].filter(Boolean).join(' '); },
  foto(u) { return u.foto ? '<img src="' + attr(u.foto) + '" alt="">' : '<div class="ph">' + ILUS[ilusDe(u)] + '</div>'; },
  thumb(u) { return '<span class="thumb">' + this.foto(u) + '</span>'; },
  unidadCelda(u) {
    return '<div class="who">' + this.thumb(u) + '<div class="who-t"><b class="mono">' + esc(this.placaTxt(u)) + '</b><span>' +
      esc(u.clase + ' · ' + this.nombre(u)) + '</span></div></div>';
  },
  iniciales(n) { const p = String(n || '').split(/\s+/).filter(Boolean); return ((p[0] || '').charAt(0) + (p[1] || '').charAt(0)).toUpperCase(); },
  corto(c) { return c ? (c.corto || c.nombre.split(/\s+/).slice(0, 2).join(' ')) : 'Sin asignar'; },
  persona(c) {
    return '<div class="who"><span class="av">' + esc(this.iniciales(c.nombre)) + '</span><div class="who-t"><b>' + esc(c.nombre) +
      '</b><span>CC ' + esc(c.cedula) + '</span></div></div>';
  },
  file(nombre, id) {
    return '<span class="filechip" data-act="verArchivo" data-nombre="' + attr(nombre) + '"' + (id ? ' data-id="' + attr(id) + '"' : '') + ' title="' + attr(nombre) + '">' +
      Icon('pdf', '', 13) + '<span>' + esc(nombre) + '</span></span>';
  },
  /* Solo el ícono rojo del archivo, que lo abre; el nombre sale al pasar el mouse */
  fileIc(nombre, id) {

  /* Gráfica circular de las partes de un todo (pocas, cada una con su color y
     su leyenda aparte). En el centro, el total. */
  dona(partes, centro, sub, etiqueta) {
    const r = 46, C = 2 * Math.PI * r, con = partes.filter(p => p.v), total = con.reduce((s, p) => s + p.v, 0);
    const hueco = con.length > 1 ? 2 : 0;
    let acc = 0;
    const arcos = con.map(p => {
      const largo = p.v / total * C, trazo = Math.max(0, largo - hueco);
      const a = '<circle cx="60" cy="60" r="' + r + '" style="stroke:' + p.c + '" stroke-dasharray="' + trazo.toFixed(2) + ' ' + (C - trazo).toFixed(2) +
        '" stroke-dashoffset="' + (-acc).toFixed(2) + '"><title>' + esc(p.t + ': ' + p.v) + '</title></circle>';
      acc += largo;
      return a;
    }).join('');
    return '<svg class="dona" viewBox="0 0 120 120" role="img" aria-label="' + attr(etiqueta) + '"><circle class="dona-pista" cx="60" cy="60" r="' + r + '"/>' +
      '<g transform="rotate(-90 60 60)">' + arcos + '</g><text x="60" y="61" class="dona-n">' + esc(centro) + '</text><text x="60" y="78" class="dona-s">' + esc(sub) + '</text></svg>';

  head(t, sub, acc) {

/* La hoja de vida: qué dice cada dato, si está lleno y cómo se ve. Un
   documento que el tipo de unidad no pide no cuenta como faltante. */
const HojaVida = {
  conPlaca: u => u.tipo === 'carga' || u.tipo === 'remolque',
  nombre: c => (typeof c === 'string' ? c : c.n),
  etiqueta(c, u) { return c.de === 'placa' && !this.conPlaca(u) ? 'Código interno' : this.nombre(c); },
  /* Las secciones del tipo; lo que se haya escrito fuera del formato va al final */
  secciones(u) {
    const base = HOJA_VIDA[u.tipo] || [];
    const usados = new Set(base.flatMap(s => s.campos.map(c => this.nombre(c))));
    const otros = Object.keys(u.ficha || {}).filter(k => !usados.has(k));
    return otros.length ? base.concat([{ t: 'Otros datos', campos: otros }]) : base;
  },
  pide: (u, t) => (Config.req[u.tipo] || []).includes(t),
  valor(u, c) {
    if (typeof c === 'string') return (u.ficha || {})[c];
    if (c.lectura) { const l = Aceite.actual(u); if (l) return Aceite.fmt(u, l.valor); }
    if (c.de === 'placa') return UI.placaTxt(u);
    if (c.de === 'conductor') { const x = Q.conductor(u.conductor); return x ? x.nombre : ''; }
    if (c.de) return u[c.de];
    if (c.insp) return u.insp ? Fecha.larga(u.insp) : '';
    const v = (u.ficha || {})[c.n];
    return c.fecha && v ? Fecha.larga(v) : v;
  },
  lleno(u, c) {
    if (c.doc) return !this.pide(u, c.doc) || Boolean(u.docs[c.doc] && u.docs[c.doc].archivo);
    const v = this.valor(u, c);
    return !(v === undefined || v === null || String(v).trim() === '');
  },
  /* El dato en la pestaña Información; los documentos, con su estado */
  celda(u, c) {
    const et = '<small>' + esc(this.etiqueta(c, u)) + '</small>';
    if (c.doc) {
      const d = u.docs[c.doc];
      if (!this.pide(u, c.doc) && !(d && d.archivo)) return '<div class="info-i">' + et + '<b class="vacio">No se pide</b></div>';
      const s = Est.doc(d, c.doc);
      return '<div class="info-i">' + et + '<b>' + (!d || !d.archivo ? 'Sin cargar' : d.vence ? (s.k === 'bad' ? 'Venció el ' : 'Vence el ') + esc(Fecha.corta(d.vence)) : 'No vence') +
        '</b>' + UI.pill(s.k, s.txt) + '</div>';
    }
    const v = this.valor(u, c);
    return '<div class="info-i">' + et + '<b' + (this.lleno(u, c) ? '>' + esc(v) : ' class="vacio">—') + '</b></div>';
  },
  /* El mismo dato en texto, para el formato impreso y el formulario */
  texto(u, c) {
    if (c.doc) {
      const d = u.docs[c.doc];
      if (!this.pide(u, c.doc) && !(d && d.archivo)) return 'No se pide';
      if (!d || !d.archivo) return 'Sin cargar';
      const s = Est.doc(d, c.doc);
      return s.txt + (d.vence ? (s.k === 'bad' ? ' · venció el ' : ' · vence el ') + Fecha.corta(d.vence) : '');
    }
    const v = this.valor(u, c);
    return v === undefined || v === null ? '' : String(v);
  },
  /* «del vehículo», «de la máquina»…, para los textos de la foto */
  deLa: u => ({ carga: 'del vehículo', maquinaria: 'de la máquina', remolque: 'del remolque', canoa: 'de la canoa' }[u.tipo]),
  /* La tarjeta que sale en la hoja impresa: la de propiedad (la licencia del
     botón de la foto) o, en los remolques, la de registro de Documentos */
  tarjeta(u) {
    if (u.tipo === 'carga' || u.tipo === 'maquinaria') {
      return u.licencia ? { txt: 'Tarjeta de propiedad', url: u.licencia, pdf: /pdf/i.test((u.licenciaInfo || {}).mime || '') } : null;
    }
    if (u.tipo === 'remolque') {
      const d = u.docs.registro, v = d && d.archivoId ? Archivos.vistos.get(d.archivoId) : null;
      return v ? { txt: 'Tarjeta de registro', url: v.url, pdf: /pdf/i.test(v.tipo || '') } : null;
    }
    return null;
  },
  /* El VIN, la foto del serial del chasis, si se subió en Documentos */
  vin(u) {
    const d = u.docs && u.docs.vin, v = d && d.archivoId ? Archivos.vistos.get(d.archivoId) : null;
    return v ? { txt: 'VIN (serial del chasis)', url: v.url, pdf: /pdf/i.test(v.tipo || '') } : null;
  },
  /* Lo que sale en el registro fotográfico impreso: la foto de la unidad, la
     tarjeta y el VIN (si están en PDF, su primera página) y las fotos del
     registro */
  fotosImpresas(u) {
    const out = [];
    if (u.foto) out.push({ src: u.foto, txt: 'Foto ' + this.deLa(u) });
    [this.tarjeta(u), this.vin(u)].forEach(t => {
      if (t) out.push(!t.pdf ? { src: t.url, txt: t.txt } : { src: PdfImagen.hechas.get(t.url), txt: t.txt,
        aviso: PdfImagen.fallos.has(t.url) ? 'No se pudo pasar el PDF a imagen. Revise la conexión a internet.' : 'Preparando la imagen…' });
    });
    (u.registro || []).forEach(f => out.push({ src: f.url, txt: f.txt || 'Foto del registro' }));
    return out;
  },
  /* En la ficha: las fotos del registro con lo que muestran, y un cuadro para
     agregar más (clic o arrastrando varias) */
  tarjetaRegistro(u) {
    const fotos = u.registro || [], tarjeta = u.tipo === 'remolque' ? ' y la tarjeta de registro' : u.tipo === 'canoa' ? ''
      : HojaVida.pide(u, 'vin') || (u.docs.vin && u.docs.vin.archivo) ? ', la tarjeta de propiedad y el VIN' : ' y la tarjeta de propiedad';
    return UI.card('Registro fotográfico', '<div class="fotos rf-fotos">' + fotos.map(f =>
        '<div class="foto"><img src="' + attr(f.url) + '" alt="' + attr(f.txt || f.nombre) + '" data-act="verArchivo" data-nombre="' + attr(f.nombre) +
          '" data-id="' + attr(Registro.clave(u, f)) + '" title="Ver la foto">' +
        '<button type="button" data-act="quitarFotoRegistro" data-u="' + u.id + '" data-f="' + f.id + '" title="Quitar la foto" aria-label="Quitar la foto">' + Icon('x', '', 12) + '</button>' +
        '<input class="rf-txt" data-u="' + u.id + '" data-f="' + f.id + '" value="' + attr(f.txt) + '" placeholder="¿Qué muestra? Ej.: lateral derecho" aria-label="Qué muestra la foto"></div>').join('') +
        '<div class="dz rf-dz" data-act="agregarFotosRegistro" data-u="' + u.id + '">' + Icon('camera') + '<h4>Agregar fotos</h4><p>Arrastre aquí o haga clic</p></div></div>',
      { cls: 'mt16', sub: fotos.length ? fotos.length + ' foto(s) · salen en la hoja de vida impresa' : 'Salen en la hoja de vida impresa',
        pie: Icon('info', '', 13) + '<span>En la hoja impresa salen primero la foto ' + this.deLa(u) + tarjeta + ', y después estas fotos con lo que muestran.</span>' });
  },
  conDotacion: u => u.tipo === 'carga' || u.tipo === 'maquinaria',
  /* La revisión de dotación más reciente; null si nunca se ha revisado */
  ultimaDotacion: u => (u.dotacion || []).slice().sort((a, b) => a.fecha.localeCompare(b.fecha) || (a.ts || 0) - (b.ts || 0)).pop() || null,
  tarjetaDotacion(u) {
    const d = this.ultimaDotacion(u), falta = d ? d.falta || [] : [];
    const grupos = DOTACION.map(g => {
      const no = g.items.filter(i => falta.includes(i));
      return '<div class="dot-g"><div class="dot-h">' + esc(g.t) +
        (!d ? UI.pill('miss', 'Sin revisar') : no.length ? UI.pill('warn', 'Falta ' + no.length + ' de ' + g.items.length)
          : UI.pill('ok', 'Completa · ' + g.items.length)) + '</div>' +
        '<div class="dot-l">' + g.items.map(i => {
          const f = falta.includes(i);
          return '<span class="dot-i' + (!d ? ' sin' : f ? ' no' : '') + '">' + (d ? Icon(f ? 'x' : 'check', '', 12) : '') + esc(i) + (f ? ' · falta' : '') + '</span>';
        }).join('') + '</div></div>';
    }).join('');
    return UI.card(u.tipo === 'maquinaria' ? 'Dotación de la máquina' : 'Dotación del vehículo',
      grupos + (d && d.obs ? '<div class="dot-obs">' + Icon('info', '', 13) + '<span>' + esc(d.obs) + '</span></div>' : ''),
      { cls: 'mt16', sub: d ? 'Revisada el ' + esc(Fecha.larga(d.fecha)) : 'Todavía no se ha revisado',
        act: '<button class="btn btn-sm" data-act="revisarDotacion" data-u="' + u.id + '">' + Icon('checkSquare', '', 12) + 'Revisar dotación</button>' });
  }
};

/* Zona para soltar archivos: también se abre con un clic */
const Dz = {
  html(id, titulo, sub, accept, multiple) {
    return '<label class="dz" id="' + id + '">' + Icon('upload') + '<h4>' + titulo + '</h4><p>' + sub + '</p>' +
      '<input type="file" hidden accept="' + accept + '"' + (multiple ? ' multiple' : '') + '></label><div class="dz-files" id="' + id + 'F"></div>';
  },
  bind(id, alRecibir) {
    const dz = document.getElementById(id);
    if (!dz) return;
    const inp = dz.querySelector('input');
    inp.addEventListener('change', () => { const f = Array.from(inp.files); inp.value = ''; if (f.length) alRecibir(f); });
    ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop', e => { const f = Array.from(e.dataTransfer.files); if (f.length) alRecibir(f); });
  },
  /* Cada archivo elegido, con su peso y lo que se hará con él al guardar */
  lista(id, files, destino) {
    const el = document.getElementById(id + 'F');
    if (!el) return;
    el.innerHTML = files.map(f => '<div class="dz-file">' + Icon(/^image\//.test(f.type) ? 'image' : 'pdf', '', 15) +
      '<span class="f1 trunc">' + esc(f.name) + '</span><span class="txt-3 fs11 nowrap">' + Peso.txt(f.size) + ' · ' +
      esc(Politica.texto(Politica.de(f, destino))) + '</span></div>').join('');
  }
};

const Peso = {
  txt(b) { return b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; },
  ahorro(antes, despues) { return Math.round((1 - despues / antes) * 100); }
};

/* ==========================================================================
   POLÍTICA DE ARCHIVOS
   · La foto de la unidad y la tarjeta de propiedad (el frente de la licencia
     de tránsito) se guardan tal cual se adjuntan, sin comprimir.
   · Los PDF y las fotos de los demás documentos se comprimen poco: se busca
     bajar entre el 20 y el 30 % del peso sin tocar la resolución, para que se
     sigan leyendo igual.
   · Un PDF con firma digital, una imagen PNG o lo que no baje de peso sin
     perder calidad se guarda tal cual.
   ========================================================================== */
const Politica = {
  de(f, destino) {
    if (destino === 'foto' || destino === 'licencia') return 'original';
    if (/pdf/i.test(f.type) || /\.pdf$/i.test(f.name)) return 'pdf';
    if (/^image\/jpe?g$/i.test(f.type)) return 'foto';
    return 'original';
  },
  texto(p) { return p === 'original' ? 'se guarda tal cual' : 'se comprime un poco al guardar'; }
};

/* «Otros documentos» no es para comparendos ni accidentes. El programa no lee
   lo que dice el archivo, pero su nombre casi siempre lo cuenta. «Choque» va
   como palabra aparte para no confundir una factura de un parachoques. */
const Lugar = {
  de(nombre) {
    const n = String(nombre || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    if (/comparendo|fotomulta|infraccion|(^|[^a-z])multa/.test(n)) return 'comparendo';
    if (/accidente|siniestro|colision|(^|[^a-z])choque/.test(n)) return 'accidente';
    return null;
  }
};

const Compresor = {
  TOPE: 0.30,
  _lib: null,
  /* pdf-lib se trae de internet la primera vez que se comprime un PDF */
  lib() {
    if (window.PDFLib) return Promise.resolve(window.PDFLib);
    return this._lib || (this._lib = new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';
      s.onload = () => (window.PDFLib ? ok(window.PDFLib) : mal(new Error('pdf-lib')));
      s.onerror = () => { this._lib = null; mal(new Error('Sin conexión')); };
      document.head.appendChild(s);
    }));
  },
  num(x) { return x && (typeof x.asNumber === 'function' ? x.asNumber() : x.numberValue); },
  /* JPEG → JPEG con otra calidad y la misma resolución. Dentro de un PDF la
     orientación EXIF no cuenta, así que ahí no se gira nada. */
  async recodificar(bytes, q, orientacion) {
    const blob = new Blob([bytes], { type: 'image/jpeg' });
    let bmp;
    try { bmp = await createImageBitmap(blob, { imageOrientation: orientacion || 'none' }); } catch (e) { bmp = await createImageBitmap(blob); }
    const c = document.createElement('canvas');
    c.width = bmp.width;
    c.height = bmp.height;
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bmp, 0, 0);
    if (bmp.close) bmp.close();
    const out = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
    return { bytes: new Uint8Array(await out.arrayBuffer()), w: c.width, h: c.height };
  },
  /* La calidad que deja la foto entre un 18 y un 30 % más liviana, sin bajar
     nunca de 0,80: la legibilidad va primero. Devuelve nada si no conviene
     tocarla. */
  async calidad(bytes, orientacion) {
    const ahorro = async q => 1 - (await this.recodificar(bytes, q, orientacion)).bytes.length / bytes.length;
    /* Se va acercando entre 0,80 y 0,98: si baja de más, sube la calidad; si
       baja poco, la baja. Se queda con la primera que cae en la franja o, si no
       llega, con la más cercana que no pasó del tope. */
    let bajo = 0.8, alto = 0.98, mejor = null;
    for (let i = 0; i < 6 && alto - bajo > 0.015; i++) {
      const q = Math.round((bajo + alto) * 50) / 100;
      const r = await ahorro(q);
      if (r >= 0.18 && r <= this.TOPE) return q;
      if (r > this.TOPE) bajo = q;
      else { if (r >= 0.03) mejor = q; alto = q; }
    }
    return mejor;
  },
  async foto(f) {
    const orig = new Uint8Array(await f.arrayBuffer());
    const q = await this.calidad(orig, 'from-image');
    if (!q) return { blob: f, nota: 'ya venía liviana' };
    const out = await this.recodificar(orig, q, 'from-image');
    return out.bytes.length < orig.length ? { blob: new File([out.bytes], f.name, { type: 'image/jpeg' }) } : { blob: f, nota: 'ya venía liviana' };
  },
  /* Un PDF: se recodifican sus fotos JPEG con la calidad elegida, sin tocar
     la resolución ni el texto, y se guarda optimizado. El resultado se vuelve
     a abrir para comprobar que esté sano; si algo falla, queda el original. */
  async pdf(f) {
    const L = await this.lib();
    const N = n => L.PDFName.of(n);
    const orig = new Uint8Array(await f.arrayBuffer());
    const doc = await L.PDFDocument.load(orig, { updateMetadata: false });
    const objs = doc.context.enumerateIndirectObjects();
    const dic = o => (o instanceof L.PDFDict ? o : o && o.dict instanceof L.PDFDict ? o.dict : null);
    /* Con firma digital no se toca: la firma dejaría de valer */
    if (objs.some(([, o]) => { const d = dic(o); return d && (d.get(N('FT')) === N('Sig') || d.get(N('Type')) === N('Sig') || d.has(N('ByteRange'))); }))
      return { blob: f, nota: 'tiene firma digital' };
    /* Las máscaras de otras imágenes tampoco se tocan */
    const mascaras = new Set();
    objs.forEach(([, o]) => {
      const d = dic(o);
      if (d) ['SMask', 'Mask'].forEach(k => { const v = d.get(N(k)); if (v instanceof L.PDFRef) mascaras.add(v.toString()); });
    });
    const fotos = objs.filter(([ref, o]) => o instanceof L.PDFRawStream && !mascaras.has(ref.toString()) && this.esFoto(L, doc, o));
    if (fotos.length) {
      const mayor = fotos.reduce((a, b) => (b[1].contents.length > a[1].contents.length ? b : a))[1];
      const q = await this.calidad(mayor.contents);
      if (q) for (const [ref, o] of fotos) {
        const out = await this.recodificar(o.contents, q);
        const W = this.num(doc.context.lookup(o.dict.get(N('Width')))), H = this.num(doc.context.lookup(o.dict.get(N('Height'))));
        if (out.bytes.length >= o.contents.length * 0.97 || out.w !== W || out.h !== H) continue;
        o.dict.set(N('Length'), L.PDFNumber.of(out.bytes.length));
        if (o.dict.get(N('ColorSpace')) === N('DeviceGray')) o.dict.set(N('ColorSpace'), N('DeviceRGB'));
        doc.context.assign(ref, L.PDFRawStream.of(o.dict, out.bytes));
      }
    }
    const paginas = doc.getPageCount();
    const out = await doc.save({ useObjectStreams: true });
    if ((await L.PDFDocument.load(out, { updateMetadata: false })).getPageCount() !== paginas) throw new Error('verificación');
    if (out.length > orig.length * 0.97) return { blob: f, nota: 'ya venía liviano' };
    return { blob: new File([out], f.name, { type: 'application/pdf' }) };
  },
  /* Solo fotos JPEG corrientes (RGB o grises), sin máscaras ni ajustes raros */
  esFoto(L, doc, o) {
    const N = n => L.PDFName.of(n), d = o.dict;
    if (d.get(N('Subtype')) !== N('Image') || d.get(N('Decode')) || d.get(N('DecodeParms')) || d.get(N('ImageMask'))) return false;
    let filtro = d.get(N('Filter'));
    if (filtro instanceof L.PDFArray) { if (filtro.size() !== 1) return false; filtro = filtro.get(0); }
    if (filtro !== N('DCTDecode')) return false;
    let cs = d.get(N('ColorSpace'));
    if (cs instanceof L.PDFRef) cs = doc.context.lookup(cs);
    if (cs === N('DeviceRGB') || cs === N('DeviceGray')) return true;
    if (cs instanceof L.PDFArray && cs.get(0) === N('ICCBased')) {
      const icc = doc.context.lookup(cs.get(1));
      return Boolean(icc && icc.dict && this.num(icc.dict.get(N('N'))) === 3);
    }
    return false;
  }
};

/* Archivos que se adjuntan: se preparan según la política y se pueden abrir
   en el visor mientras la página esté abierta */
/* La primera página de un PDF como imagen, para que una tarjeta adjuntada en
   PDF también salga en la hoja de vida impresa. pdf.js se trae de internet la
   primera vez que hace falta; sin conexión, la hoja lo avisa. */
const PdfImagen = {
  BASE: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/',
  hechas: new Map(),
  fallos: new Set(),
  _lib: null,
  lib() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return this._lib || (this._lib = new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = this.BASE + 'pdf.min.js';
      s.onload = () => {
        if (!window.pdfjsLib) { this._lib = null; mal(new Error('pdf.js')); return; }
        /* El trabajador de pdf.js viene de otro sitio: se arranca desde un blob
           que lo importa, que sí lo deja el navegador */
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(
          new Blob(['importScripts("' + this.BASE + 'pdf.worker.min.js");'], { type: 'text/javascript' }));
        ok(window.pdfjsLib);
      };
      s.onerror = () => { this._lib = null; mal(new Error('Sin conexión')); };
      document.head.appendChild(s);
    }));
  },
  async de(url) {
    if (this.hechas.has(url)) return this.hechas.get(url);
    const lib = await this.lib();
    const pdf = await lib.getDocument({ data: await (await fetch(url)).arrayBuffer() }).promise;
    try {
      const pag = await pdf.getPage(1), vp = pag.getViewport({ scale: 2 });
      const c = document.createElement('canvas');
      c.width = Math.round(vp.width);
      c.height = Math.round(vp.height);
      const g = c.getContext('2d');
      g.fillStyle = '#fff';
      g.fillRect(0, 0, c.width, c.height);
      await pag.render({ canvasContext: g, viewport: vp }).promise;
      const img = c.toDataURL('image/jpeg', 0.9);
      this.hechas.set(url, img);
      return img;
    } finally { pdf.destroy(); }
  }
};

const Archivos = {
  vistos: new Map(),
  registrar(id, blob, nombre, antes) {
    const url = URL.createObjectURL(blob);
    this.vistos.set(id, { url, tipo: blob.type, nombre, tam: blob.size, antes: antes || blob.size });
    return url;
  },
  /* Foto de la unidad o tarjeta de propiedad: tal cual. Solo se comprueba que
     el navegador la pueda mostrar; devuelve nada si no puede */
  original(f) {
    if (/pdf/i.test(f.type) || /\.pdf$/i.test(f.name)) return Promise.resolve(f);
    return new Promise(ok => {
      const url = URL.createObjectURL(f), img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); ok(f); };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        Toast.show('No se pudo abrir «' + esc(f.name) + '». Pruebe con una foto JPG o PNG.', 'err');
        ok(null);
      };
      img.src = url;
    });
  },
  /* Un documento: se comprime poco, según la política, y queda listo para verlo */
  async preparar(f) {
    const p = Politica.de(f);
    let r = { blob: f, nota: 'se guardó tal cual' };
    try {
      if (p === 'pdf') r = await Compresor.pdf(f);
      else if (p === 'foto') r = await Compresor.foto(f);
    } catch (e) { r = { blob: f, nota: 'no se pudo comprimir' }; }
    const id = 'doc' + marca();
    this.registrar(id, r.blob, f.name, f.size);
    /* Queda guardado en el navegador, para abrirlo de verdad después de recargar */
    Guardadas.guardar('archivo:' + id, { blob: r.blob, info: { nombre: f.name, antes: f.size } });
    return { id, nombre: f.name, tam: r.blob.size, antes: f.size, nota: r.nota || '' };
  },
  /* «2,4 MB → 1,8 MB (−25 %)», o por qué quedó igual */
  resumen(a) {
    return a.tam < a.antes ? Peso.txt(a.antes) + ' → ' + Peso.txt(a.tam) + ' (−' + Peso.ahorro(a.antes, a.tam) + ' %)' : Peso.txt(a.tam) + ', ' + a.nota;
  },
  /* Mientras se comprime, el botón de guardar avisa y no se puede volver a pulsar */
  async conBoton(boton, tarea) {
    const antes = boton.innerHTML;
    boton.disabled = true;
    boton.innerHTML = '<span class="spin"></span>Comprimiendo…';
    try { return await tarea(); } finally { boton.disabled = false; boton.innerHTML = antes; }
  }
};

/* Las fotos y los archivos viven en el depósito privado «flota» de Supabase.
   Cada uno tiene su clave, y de ella sale su ruta en el depósito (ver Nube):
   «foto:<unidad>», «licencia:<unidad>» (la tarjeta de propiedad),
   «registro:<unidad>:<foto>» (el registro fotográfico) y «archivo:<id>» (los
   documentos y PDF subidos). Lo que dice cada uno (nombre, fecha…) va en las
   tablas, con lo demás (ver Mapa). */
const Guardadas = {
  /* Sube el archivo. No espera a que termine: queda en la cola de la nube, que
     reintenta sola si se cae el internet */
  guardar(clave, valor) {
    if (valor && valor.blob) Nube.subir(clave, valor.blob, valor.info);
    return Promise.resolve();
  },
  leer(clave) { return Nube.bajar(clave).then(blob => (blob ? { blob } : null)); },
  borrar(clave) {
    Nube.quitar(clave);
    return Promise.resolve();
  },
  /* Pone la foto o la tarjeta de propiedad en la unidad, tal cual, y la sube */
  poner(u, tipo, archivo, origen) {
    const ext = /\.[a-z0-9]+$/i.test(archivo.name || '') ? archivo.name.match(/\.[a-z0-9]+$/i)[0].toLowerCase() : /pdf/i.test(archivo.type) ? '.pdf' : '.jpg';
    const info = { fecha: hoyISO, hora: ahora(), ts: marca(), cambio: Boolean(u[tipo]), mime: archivo.type, tam: archivo.size, origen: origen || 'boton',
      nombre: tipo === 'licencia' ? 'Tarjeta de propiedad ' + u.placa + ext : archivo.name };
    this.mostrar(u, tipo, archivo, info);
    return this.guardar(tipo + ':' + u.id, { blob: archivo, info });
  },
  /* Deja la imagen en la unidad. La licencia ES la tarjeta de propiedad: queda
     también en Documentos, para no adjuntarla dos veces */
  mostrar(u, tipo, archivo, info) {
    const id = tipo + ':' + u.id;
    u[tipo] = Archivos.registrar(id, archivo, info.nombre || tipo);
    u[tipo + 'Info'] = info;
    if (tipo === 'licencia') u.docs.tarjeta = { archivo: info.nombre || 'Tarjeta de propiedad ' + u.placa, archivoId: id,
      subido: info.fecha, hora: info.hora, ts: info.ts, desdeLicencia: true };
    Sincro.tocar();
  },
  /* La foto o la tarjeta que llega de la nube: sus datos ya vinieron con la
     unidad, aquí solo se cuelga el archivo */
  colgar(u, tipo, blob) {
    const clave = tipo + ':' + u.id, info = u[tipo + 'Info'] || {};
    u[tipo] = Archivos.registrar(clave, blob, info.nombre || tipo, Nube.meta(clave).antes);
  },
  /* La tarjeta se llama «Tarjeta de propiedad» con la placa de la unidad. Si
     la placa cambia después de adjuntarla, el nombre se pone al día. */
  renombrarTarjeta(u) {
    const li = u.licenciaInfo, viejo = (li && li.nombre) || '';
    if (!/^Tarjeta de propiedad /.test(viejo)) return;
    const nombre = 'Tarjeta de propiedad ' + u.placa + (viejo.match(/\.[a-z0-9]+$/i) || [''])[0];
    if (nombre === viejo) return;
    li.nombre = nombre;
    if (u.docs.tarjeta && u.docs.tarjeta.desdeLicencia) u.docs.tarjeta.archivo = nombre;
    const visto = Archivos.vistos.get('licencia:' + u.id);
    if (visto) visto.nombre = nombre;
  },
  /* Al entrar se bajan los archivos que se ven sin abrirlos: la foto, la
     tarjeta, el VIN y la tarjeta de registro (salen en la hoja de vida), el
     registro fotográfico y las fotos de los correctivos. Los demás PDF se
     bajan cuando se abren. Lo que ya estaba bajado no se vuelve a bajar.
     Devuelve cuántos archivos llegaron. */
  async aplicar() {
    const tareas = [];
    const traer = (clave, poner) => tareas.push(Nube.bajar(clave).then(b => { if (!b) return 0; poner(b); return 1; }));
    const yaEsta = clave => Archivos.vistos.get(clave);
    Datos.unidades.forEach(u => {
      ['foto', 'licencia'].forEach(tipo => {
        if (!u[tipo + 'Info']) return;
        const v = yaEsta(tipo + ':' + u.id);
        if (v) u[tipo] = v.url; else traer(tipo + ':' + u.id, b => this.colgar(u, tipo, b));
      });
      (u.registro || []).forEach(f => {
        const v = yaEsta(Registro.clave(u, f));
        if (v) f.url = v.url; else traer(Registro.clave(u, f), b => Registro.colgar(u, f, b));
      });
      ['vin', 'registro'].forEach(t => {
        const d = u.docs[t];
        if (d && d.archivoId && !yaEsta(d.archivoId)) traer(Nube.claveDe(d.archivoId), b => Archivos.registrar(d.archivoId, b, d.archivo, Nube.meta(Nube.claveDe(d.archivoId)).antes));
      });
    });
    Datos.mantenimientos.forEach(m => (m.fotosData || []).forEach(f => {
      if (f.id && !yaEsta(f.id)) traer(Nube.claveDe(f.id), b => Archivos.registrar(f.id, b, 'Foto del correctivo'));
    }));
    const n = (await Promise.all(tareas)).reduce((a, b) => a + b, 0);
    return n;
  }
};

/* El registro fotográfico de cada unidad: fotos que salen en la hoja de vida
   impresa, cada una con lo que muestra. Van al depósito como la foto y la
   tarjeta, pero con la compresión ligera de las fotos de documentos. Cada una
   con su clave «registro:<unidad>:<foto>»; lo que muestra va en la tabla
   «fotos». */
const Registro = {
  clave: (u, f) => 'registro:' + u.id + ':' + f.id,
  /* Deja la foto en la unidad, en el orden en que se agregó */
  mostrar(u, id, blob, info) {
    const f = { id, blob, nombre: info.nombre || 'Foto', txt: info.txt || '', fecha: info.fecha || hoyISO, hora: info.hora || '', ts: info.ts || 0 };
    f.url = Archivos.registrar(this.clave(u, f), blob, f.nombre);
    (u.registro = u.registro || []).push(f);
    u.registro.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    return f;
  },
  /* La foto que llega de la nube a la unidad que ya la tenía anotada */
  colgar(u, f, blob) { f.url = Archivos.registrar(this.clave(u, f), blob, f.nombre); },
  guardar(u, f) {
    return Guardadas.guardar(this.clave(u, f), { blob: f.blob, info: { nombre: f.nombre } });
  },
  /* Varias fotos de una vez; solo imágenes que el navegador pueda mostrar */
  async subir(u, files) {
    const fotos = files.filter(x => /^image\//.test(x.type));
    if (!fotos.length) { Toast.show('Solo se pueden agregar fotos (JPG o PNG).', 'err'); return; }
    /* Cada foto tarda un momento en comprimirse: se avisa desde el principio */
    Toast.show('Agregando ' + (fotos.length === 1 ? 'la foto' : fotos.length + ' fotos') + ' al registro fotográfico…');
    let n = 0, antes = 0, despues = 0;
    for (const file of fotos) {
      const ok = await Archivos.original(file);
      if (!ok) continue;
      let blob = ok;
      try { if (Politica.de(ok) === 'foto') blob = (await Compresor.foto(ok)).blob; } catch (e) { blob = ok; }
      const f = this.mostrar(u, 'f' + marca(), blob, { nombre: file.name, fecha: hoyISO, hora: ahora(), ts: marca() });
      await this.guardar(u, f);
      n++;
      antes += file.size;
      despues += blob.size;
    }
    if (!n) return;
    Toast.show((n === 1 ? 'Se agregó una foto' : 'Se agregaron ' + n + ' fotos') + ' al registro fotográfico de <b>' + esc(UI.placaTxt(u)) + '</b>.' +
      (despues < antes ? '<br>' + esc(Peso.txt(antes) + ' → ' + Peso.txt(despues) + ' (−' + Peso.ahorro(antes, despues) + ' %)') : ''));
    Router.pintar(true);
  },
  /* Lo que muestra la foto va en su fila: lo sube la sincronización */
  describir(u, id, txt) {
    const f = (u.registro || []).find(x => x.id === id);
    if (!f || f.txt === txt) return;
    f.txt = txt;
    Sincro.tocar();
  },
  quitar(u, id) {
    const i = (u.registro || []).findIndex(x => x.id === id);
    if (i < 0) return null;
    const f = u.registro.splice(i, 1)[0], clave = this.clave(u, f);
    Guardadas.borrar(clave);
    if (f.url) URL.revokeObjectURL(f.url);
    Archivos.vistos.delete(clave);
    return f;
  }
};

/* Todo lo que se registra va solo a Supabase: la sincronización (ver Sincro)
   revisa a cada momento qué cambió y lo sube. Aquí queda lo que el resto de
   la plataforma ya usaba: guardar ya y limpiar los archivos que nada usa. */
const Persistencia = {
  /* Los datos tal cual, menos las imágenes de cada unidad (para la copia de
     seguridad) */
  texto() {
    const aparte = ['foto', 'licencia', 'fotoInfo', 'licenciaInfo', 'registro'];
    return JSON.stringify({ version: 1, datos: Datos, config: Config }, function (k, v) {
      return this && this.tipo && 'placa' in this && aparte.includes(k) ? undefined : v;
    });
  },
  guardar() { return Sincro.ahora(); },
  /* Las claves de todos los archivos que algo usa todavía */
  usados() {
    const usados = new Set(), ver = id => { if (id) usados.add(Nube.claveDe(String(id))); };
    Datos.unidades.forEach(u => {
      Object.values(u.docs || {}).forEach(d => d && ver(d.archivoId));
      (u.otros || []).forEach(o => ver(o.archivoId));
      if (u.comp) ver(u.comp.archivoId);
      (u.compHist || []).forEach(h => h && ver(h.archivoId));
      if (u.fotoInfo) usados.add('foto:' + u.id);
      if (u.licenciaInfo) usados.add('licencia:' + u.id);
      (u.registro || []).forEach(f => usados.add(Registro.clave(u, f)));
    });
    Datos.conductores.concat(Datos.archivo.conductores).forEach(c => Object.values(c.docs || {}).forEach(d => d && ver(d.archivoId)));
    Datos.proveedores.concat(Datos.archivo.proveedores).forEach(p => (p.pdfs || []).forEach(d => ver(d.id)));
    Datos.mantenimientos.forEach(m => { ver(m.adjuntoId); (m.fotosData || []).forEach(f => ver(f.id)); });
    Datos.accidentes.forEach(a => ver(a.archivoId));
    Datos.ocs.forEach(o => ver(o.cotizacionId));
    Datos.actividad.forEach(a => (a.adjuntos || []).forEach(x => ver(x.id)));
    return usados;
  },
  /* Borra del depósito los archivos que ya nada usa: los de unidades
     eliminadas o de documentos reemplazados */
  limpiar() {
    const usados = this.usados();
    Nube.conocidos().filter(k => !usados.has(k)).forEach(k => Nube.quitar(k));
    return Promise.resolve();
  }
};

/* Eliminar de verdad. Una unidad se va con todo lo suyo. Un conductor o un
   proveedor pasa al archivo, para que el historial conserve su nombre. */
const Borrar = {
  unidad(id) { return this.unidades([id]); },
  unidades(ids) {
    const fuera = new Set(ids), otra = x => !fuera.has(x.unidad);
    Datos.unidades.filter(u => fuera.has(u.id)).forEach(u =>
      [u.foto, u.licencia].concat((u.registro || []).map(f => f.url)).forEach(url => { if (url) URL.revokeObjectURL(url); }));
    Datos.unidades = Datos.unidades.filter(x => !fuera.has(x.id));
    ['mantenimientos', 'inspecciones', 'accidentes', 'ocs', 'actividad', 'lecturas'].forEach(k => { Datos[k] = (Datos[k] || []).filter(otra); });
    return Persistencia.limpiar();
  },
  conductor(id) {
    const c = Q.conductor(id);
    Datos.conductores = Datos.conductores.filter(x => x.id !== id);
    Datos.archivo.conductores.push(c);
    Datos.unidades.filter(u => u.conductor === id).forEach(u => {
      u.conductor = null;
      Actividad.registrar(u, 'conductor', u.tipo === 'maquinaria' ? 'Cambio de operador' : 'Cambio de conductor',
        'Se quitó a ' + c.nombre + ', que se eliminó de la plataforma');
    });
  },
  proveedor(id) {
    const p = Q.proveedor(id);
    Datos.proveedores = Datos.proveedores.filter(x => x.id !== id);
    Datos.archivo.proveedores.push(p);
  }
};

/* Copia de seguridad: un archivo con todo (datos, fotos y documentos) para
   guardarlo aparte, fuera de la nube */
const Copia = {
  APP: 'sigf-sinugravas',
  aTexto: blob => new Promise((ok, mal) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => mal(r.error);
    r.readAsDataURL(blob);
  }),
  async armar() {
    const archivos = {}, claves = Nube.conocidos();
    const listas = await Promise.all(claves.map(k => Nube.bajar(k)));
    for (let i = 0; i < claves.length; i++) {
      if (listas[i]) archivos[claves[i]] = { info: Nube.meta(claves[i]), datos: await this.aTexto(listas[i]) };
    }
    return { app: this.APP, version: 1, creada: new Date().toISOString(), estado: Persistencia.texto(), archivos };
  },
  async descargar() {
    const copia = await this.armar();
    const a = document.createElement('a');

/* Lo que calcula el dashboard. El gasto son las órdenes de compra y el valor
   de los mantenimientos que no se pagaron con una orden (esos ya cuentan por
   la orden). */
const Tablero = {
  PERIODOS: { mes: 'Este mes', trimestre: 'Trimestre', anio: 'Año' },
  /* Desde, hasta y nombre del período en curso, y lo mismo del anterior completo */
  periodo(p) {
    const y = HOY.getFullYear(), mo = HOY.getMonth();
    const r = (a, b, nombre) => ({ desde: Fecha.iso(a), hasta: Fecha.iso(b), nombre });
    const mes = d => Fecha.mes(d, true).toLowerCase();
    if (p === 'anio') return Object.assign(r(new Date(y, 0, 1), HOY, String(y)), { antes: r(new Date(y - 1, 0, 1), new Date(y - 1, 11, 31), String(y - 1)) });
    if (p === 'trimestre') {
      const q = mo - mo % 3;
      return Object.assign(r(new Date(y, q, 1), HOY, 'este trimestre'), { antes: r(new Date(y, q - 3, 1), new Date(y, q, 0), 'el trimestre anterior') });
    }
    return Object.assign(r(new Date(y, mo, 1), HOY, mes(HOY)), { antes: r(new Date(y, mo - 1, 1), new Date(y, mo, 0), mes(new Date(y, mo - 1, 1))) });
  },
  gastos() {
    return Datos.ocs.map(o => ({ fecha: o.fecha, unidad: o.unidad, valor: UI.totalOC(o) }))
      .concat(Datos.mantenimientos.filter(m => m.valor && !m.oc).map(m => ({ fecha: m.fecha, unidad: m.unidad, valor: m.valor })));
  },
  en(r) { return this.gastos().filter(g => g.fecha >= r.desde && g.fecha <= r.hasta); },
  suma: l => l.reduce((s, g) => s + g.valor, 0)
};

/* Cambios de aceite, con la regla del ingeniero: el próximo cambio es el
   último más la frecuencia; vencido cuando ya no falta nada y próximo cuando
   faltan 4.000 km o menos (40 horas en las máquinas). La fecha estimada sale
   del promedio diario de las lecturas del último mes. */
const Aceite = {
  UMBRAL: { km: 4000, h: 40 },
  aplica: u => u.tipo === 'carga' || u.tipo === 'maquinaria',
  medida: u => (u.tipo === 'maquinaria' ? 'h' : 'km'),
  fmt(u, n) { return Math.round(n).toLocaleString('es-CO') + ' ' + this.medida(u); },
  lecturas: u => (Datos.lecturas || []).filter(l => l.unidad === u.id)
    .sort((a, b) => a.fecha.localeCompare(b.fecha) || a.valor - b.valor || (a.ts || 0) - (b.ts || 0)),
  actual(u) { const l = this.lecturas(u); return l.length ? l[l.length - 1] : null; },
  porDia(u) {
    const l = this.lecturas(u);
    if (l.length < 2) return null;
    const ult = l[l.length - 1], desde = Fecha.iso(new Date(Fecha.parse(ult.fecha).getTime() - 30 * 864e5));
    const base = l.find(x => x.fecha >= desde && x.fecha < ult.fecha);
    if (!base) return null;
    const dias = Math.round((Fecha.parse(ult.fecha) - Fecha.parse(base.fecha)) / 864e5);
    return dias >= 1 && ult.valor > base.valor ? (ult.valor - base.valor) / dias : null;
  },
  estado(u) {
    const a = u.aceite || {}, act = this.actual(u), med = this.medida(u);
    const e = { u, med, actual: act, frecuencia: a.frecuencia, ultimo: a.ultimo, ultimoFecha: a.ultimoFecha };
    if (!a.frecuencia || a.ultimo == null) return Object.assign(e, { k: 'nr', txt: 'Sin último cambio', orden: 3 });
    e.proximo = a.ultimo + a.frecuencia;
    if (!act) return Object.assign(e, { k: 'nr', txt: 'Sin lectura', orden: 3 });
    e.faltan = e.proximo - act.valor;
    e.k = e.faltan <= 0 ? 'bad' : e.faltan <= this.UMBRAL[med] ? 'warn' : 'ok';
    e.txt = { bad: 'Vencido', warn: 'Próximo', ok: 'Al día' }[e.k];
    e.orden = { bad: 0, warn: 1, ok: 2 }[e.k];
    e.porDia = this.porDia(u);
    if (e.porDia && e.faltan > 0) e.estimada = Fecha.iso(new Date(Fecha.parse(act.fecha).getTime() + Math.ceil(e.faltan / e.porDia) * 864e5));
    return e;
  },
  /* Las unidades con control, de la más urgente a la más holgada */
  todas() {
    return Datos.unidades.filter(this.aplica).map(u => this.estado(u))
      .sort((a, b) => a.orden - b.orden || (a.faltan == null ? 1e12 : a.faltan / this.UMBRAL[a.med]) - (b.faltan == null ? 1e12 : b.faltan / this.UMBRAL[b.med]));
  },
  /* Se guarda una lectura: del preoperacional, de un cambio o escrita a mano */
  leer(u, fecha, valor, fuente) {
    Datos.lecturas = Datos.lecturas || [];
    Datos.lecturas.push({ unidad: u.id, fecha, valor, fuente, ts: marca() });
  }
};

const Vistas = {
  /* ------------------------------------------------------------- Dashboard
     Lo que el jefe mira para decidir: el estado de la operación en números,
     el gasto por vehículo y por mes, lo que vence y lo que falta del mes. */
  inicio() {
    const u = Datos.unidades, p = UIState.dash, per = Tablero.periodo(p);
    const docs = Q.docsTodos();
    const venc = docs.filter(x => x.e.k === 'bad');
    const porv = docs.filter(x => x.e.k === 'warn');
    const enTaller = new Set(Datos.mantenimientos.filter(m => m.estado === 'taller').map(m => m.unidad));
    const operan = u.filter(x => !enTaller.has(x.id)).length;
    const compU = Q.conComparendos();
    const conComp = compU.filter(x => x.comp.estado === 'con');
    const mesTxt = Fecha.mes(null, true).toLowerCase();

    /* El gasto del período y el del anterior completo */
    const gastos = Tablero.en(per), total = Tablero.suma(gastos), antes = Tablero.suma(Tablero.en(per.antes));
    let delta = 'Sin gasto en ' + esc(per.antes.nombre);
    if (antes) {
      const pct = Math.round((total - antes) / antes * 100);
      delta = pct >= 0 ? '<span class="sube">' + Icon('sube', '', 12) + ' ' + pct + ' % más que en todo ' + esc(per.antes.nombre) + '</span>'
        : '<span class="baja">' + Icon('baja', '', 12) + ' ' + (-pct) + ' % menos que en todo ' + esc(per.antes.nombre) + '</span>';
    }

    /* Los vehículos que más gasto llevan en el período */
    const porU = {};
    gastos.forEach(g => { if (g.unidad) porU[g.unidad] = (porU[g.unidad] || 0) + g.valor; });
    const top = Object.keys(porU).map(id => ({ u: Q.unidad(id), v: porU[id] })).filter(x => x.u).sort((a, b) => b.v - a.v).slice(0, 6);
    const general = Tablero.suma(gastos.filter(g => !g.unidad || !Q.unidad(g.unidad)));
    const ranking = top.length ? '<div class="rk-lista">' + top.map(x =>
        '<div class="rk" data-act="irUnidad" data-u="' + x.u.id + '" data-tab="actividad" title="' + attr(UI.placaTxt(x.u) + ': ' + Money.format(x.v)) + '">' +
          '<span class="rk-l">' + esc(UI.placaTxt(x.u)) + '</span><span class="rk-t"><i style="width:' + Math.round(x.v / top[0].v * 100) + '%"></i></span>' +
          '<span class="rk-v">' + esc(Money.compacto(x.v)) + '</span></div>').join('') + '</div>'
      : UI.empty('pesos', 'Sin gastos en este período', 'Se llena con las órdenes de compra y el valor de los mantenimientos.');

    /* El gasto de cada mes: los últimos seis, o los doce del año */
    const y = HOY.getFullYear(), mo = HOY.getMonth();
    const meses = p === 'anio' ? Array.from({ length: 12 }, (_, i) => new Date(y, i, 1)) : Array.from({ length: 6 }, (_, i) => new Date(y, mo - 5 + i, 1));
    const porMes = meses.map(d => Tablero.suma(Tablero.en({ desde: Fecha.iso(d), hasta: Fecha.iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)) })));
    const tope = Math.max.apply(null, porMes.concat([1])), iMax = porMes.indexOf(Math.max.apply(null, porMes));
    const nombreMes = d => d.toLocaleDateString('es-CO', { month: 'short' }).replace('.', '');
    const columnas = '<div class="cols">' + meses.map((d, i) => {
        const v = porMes[i], actual = d.getMonth() === mo && d.getFullYear() === y;
        return '<div class="col" title="' + attr(Fecha.mes(d) + ': ' + Money.format(v)) + '">' +
          (v && (actual || i === iMax) ? '<span>' + esc(Money.compacto(v)) + '</span>' : '') +
          (v ? '<i style="height:' + Math.max(2, Math.round(v / tope * 100)) + '%"></i>' : '') + '</div>';
      }).join('') + '</div>' +
      '<div class="cols-x">' + meses.map(d => '<span' + (d > HOY ? ' class="fut"' : '') + '>' + esc(nombreMes(d)) + '</span>').join('') + '</div>';

    /* Lo que vence: primero lo vencido, luego lo que vence pronto */
    const proximos = venc.concat(porv).sort((a, b) => Fecha.hasta(a.d.vence) - Fecha.hasta(b.d.vence));
    const vence = proximos.length ? proximos.slice(0, 6).map(x =>
        '<div class="vrow" ' + (x.quien === 'u' ? 'data-act="irUnidad" data-u="' + x.ref.id + '" data-tab="docs"' : 'data-act="verConductor" data-c="' + x.ref.id + '"') + '>' +
          '<span class="' + (x.quien === 'u' ? 'mono ' : '') + 'fs12 trunc" style="font-weight:600">' + esc(x.quien === 'u' ? UI.placaTxt(x.ref) : x.ref.corto || x.ref.nombre) + '</span>' +
          '<div style="min-width:0"><b class="trunc">' + esc(DOC_TIPOS[x.t].nombre) + '</b><span class="d">' + esc(x.e.det) + '</span></div>' +
          UI.pill(x.e.k, x.e.txt) + '</div>').join('')
      : UI.empty('shieldOk', 'Todo al día', 'Ningún documento vence en los próximos ' + Config.diasAviso + ' días.');

    /* Lo que va del mes */
    const inspOk = u.filter(x => Est.insp(x).k === 'ok').length;
    const compRev = compU.filter(x => x.comp.estado !== 'pend').length;
    const inicioMes = Fecha.iso(new Date(y, mo, 1));
    const conDot = u.filter(HojaVida.conDotacion);
    const dotOk = conDot.filter(x => { const d = HojaVida.ultimaDotacion(x); return d && d.fecha >= inicioMes; }).length;
    const cum = (t, n, de, ir) => '<div class="cum" data-ir="' + ir + '"><div class="cum-t"><span>' + esc(t) + '</span><b>' + n + ' de ' + de + '</b></div>' + UI.barra(n, de) + '</div>';

    /* Cambios de aceite: cómo está la flota y los más urgentes. La línea es lo
       que va gastado del intervalo, así se comparan los km y las horas. */
    const aceite = Aceite.todas(), na = k => aceite.filter(e => e.k === k).length;
    const partes = [{ v: na('bad'), c: 'var(--dang-500)', t: 'Vencidos' }, { v: na('warn'), c: 'var(--warn-500)', t: 'Próximos' },
      { v: na('ok'), c: 'var(--brand-500)', t: 'Al día' }, { v: na('nr'), c: 'var(--ink-300)', t: 'Sin datos' }];
    const usado = e => Math.min(100, Math.max(2, Math.round((e.frecuencia - e.faltan) / e.frecuencia * 100)));
    const cambios = aceite.length ? '<div class="dn-wrap">' + UI.dona(partes, aceite.length, aceite.length === 1 ? 'unidad' : 'unidades',
        'Cambios de aceite: ' + partes.map(x => x.t.toLowerCase() + ' ' + x.v).join(', ')) +
        '<div class="dn-ley">' + partes.map(x => '<span><i style="background:' + x.c + '"></i>' + x.t + '<b>' + x.v + '</b></span>').join('') + '</div></div>' +
      '<div class="rk-lista">' + aceite.filter(e => e.faltan != null).slice(0, 5).map(e =>
        '<div class="rk" data-ir="aceite" title="' + attr(UI.placaTxt(e.u) + ': lleva el ' + usado(e) + ' % del intervalo') + '"><span class="rk-l">' + esc(UI.placaTxt(e.u)) + '</span>' +
          '<span class="rk-t pista"><i class="k-' + e.k + '" style="width:' + usado(e) + '%"></i></span>' +
          '<span class="rk-v' + (e.k === 'bad' ? ' tx-bad' : '') + '">' + esc(e.faltan > 0 ? Aceite.fmt(e.u, e.faltan) : 'pasó ' + Aceite.fmt(e.u, -e.faltan)) + '</span></div>').join('') + '</div>'
      : UI.empty('gota', 'Sin unidades con control', 'Los camiones y la maquinaria salen aquí cuando tengan su control de aceite.');

    /* Lo que llega cuando se registren el combustible, las llantas y el GPS */
    const pronto = (titulo, sub, nota, ir, anchos) => UI.card(titulo, '<div class="rk-lista">' + anchos.map(w =>
        '<div class="rk"><span class="rk-l">— — —</span><span class="rk-t"><i style="width:' + w + '%"></i></span><span class="rk-v txt-3">—</span></div>').join('') + '</div>',
      { flush: true, cls: 'pronto-c', sub, pie: Icon('clock', '', 13) + '<span>' + nota + ' <span class="link" data-ir="' + ir + '">Ver qué viene</span></span>' });

    const html =
      UI.head('Dashboard', esc(Fecha.larga(hoyISO)) + ' · ' + u.length + ' unidades',
        '<div class="seg">' + Object.keys(Tablero.PERIODOS).map(k => '<button class="' + (p === k ? 'on' : '') + '" data-act="periodoDash" data-v="' + k + '">' +
          esc(Tablero.PERIODOS[k]) + '</button>').join('') + '</div>') +
      '<div class="grid g4 mb16">' +
        UI.kpi({ label: 'En operación', valor: operan + '<small> de ' + u.length + '</small>', icono: 'truck', act: 'filtroMant', v: 'taller',
          meta: enTaller.size ? enTaller.size + ' en el taller · ' + Math.round(operan / u.length * 100) + ' % disponible' : 'Ninguna en el taller' }) +
        UI.kpi({ label: p === 'trimestre' ? 'Gasto del trimestre' : 'Gasto de ' + per.nombre, valor: esc(Money.compacto(total)), icono: 'pesos', color: 'var(--info-500)',
          meta: delta, ir: 'compras' }) +
        UI.kpi({ label: 'Documentos', valor: venc.length ? venc.length + (venc.length === 1 ? ' vencido' : ' vencidos') : 'Al día', icono: 'shield',
          color: venc.length ? 'var(--dang-500)' : 'var(--ok-500)', vcolor: venc.length ? 'var(--dang-500)' : '',
          meta: porv.length + (porv.length === 1 ? ' vence' : ' vencen') + ' en ' + Config.diasAviso + ' días', act: 'filtroDocs', v: venc.length ? 'bad' : 'warn' }) +
        UI.kpi({ label: 'Comparendos de ' + mesTxt, valor: conComp.length, icono: 'ticket', color: conComp.length ? 'var(--dang-500)' : 'var(--ok-500)', ir: 'comparendos',
          meta: conComp.length ? esc(Money.format(conComp.reduce((s, x) => s + (x.comp.valor || 0), 0)) + ' · ' + conComp.map(x => UI.placaTxt(x)).join(', '))
            : compRev + ' de ' + compU.length + ' unidades revisadas' }) +
      '</div>' +
      '<div class="grid g2 mb16">' +
        UI.card('Vehículos que más gasto llevan', ranking,
          { flush: true, sub: 'Compras y mantenimientos · ' + esc(Tablero.PERIODOS[p].toLowerCase()),
            pie: general ? Icon('cart', '', 13) + '<span>Además, ' + esc(Money.compacto(general)) + ' en compras generales, sin un vehículo.</span>' : '' }) +
        UI.card('Gasto por mes', columnas, { sub: p === 'anio' ? 'Los meses de ' + y : 'Últimos seis meses', act: '<span class="link fs12" data-ir="compras">Ver compras</span>' }) +
      '</div>' +
      '<div class="grid g3 mb16">' +
        UI.card('Documentos que vencen', vence, { flush: true, sub: 'Vencidos y en ' + Config.diasAviso + ' días',
          act: '<span class="link fs12" data-ir="documentos">Ver todos' + (proximos.length > 6 ? ' (' + proximos.length + ')' : '') + '</span>' }) +
        UI.card('Cambios de aceite', cambios, { flush: true, sub: 'Los más urgentes', act: '<span class="link fs12" data-ir="aceite">Ver todos</span>' }) +
        UI.card('Cumplimiento del mes', cum('Inspecciones visuales al día', inspOk, u.length, 'inspecciones') +
          cum('Revisión de comparendos de ' + mesTxt, compRev, compU.length, 'comparendos') +
          cum('Dotación revisada en ' + mesTxt, dotOk, conDot.length, 'flota'), { flush: true, sub: Fecha.mes() }) +
      '</div>' +
      '<div class="grid g3">' +
        pronto('Mayor consumo de combustible', 'Galones y kilómetros por galón', 'Cuando se registre el combustible.', 'pronto/combustible', [88, 64, 47, 30]) +
        pronto('Mayor gasto en llantas', 'Por vehículo', 'Cuando se registren las llantas.', 'pronto/llantas', [80, 57, 41, 26]) +
        pronto('Más tiempo en ralentí', 'Horas encendido y quieto', 'Cuando se conecte el GPS.', 'pronto/combustible', [84, 61, 39, 22]) +
      '</div>';
    return { titulo: 'Dashboard', sub: 'El balance de la operación', html };
  },

  /* ------------------------------------------------------- Flota (galería) */
  flota() {

    const segTipos = [['todas', 'Todas']].concat(ORDEN.map(t => [t, TIPOS[t].corto]));
    const estados = [['todos', 'Todos los estados'], ['bad', 'Con documentos vencidos'], ['warn', 'Por vencer'], ['miss', 'Les falta un documento'], ['ok', 'Al día'], ['nr', 'Sin documentos obligatorios']];
    const html =
      UI.head('Flota', Datos.unidades.length + ' unidades · ' + (f.sel ? 'haga clic en las que quiera seleccionar' : 'haga clic en una para ver toda su información'),
        '<div class="seg">' +
          '<button class="' + (f.modo === 'fotos' ? 'on' : '') + '" data-act="modoFlota" data-v="fotos">' + Icon('grid', '', 13) + 'Fotos</button>' +
          '<button class="' + (f.modo === 'lista' ? 'on' : '') + '" data-act="modoFlota" data-v="lista">' + Icon('list', '', 13) + 'Lista</button>' +
        '</div>' +
        (f.sel ? '<button class="btn" data-act="seleccionarFlota">' + Icon('x', '', 14) + 'Cancelar selección</button>'
          : '<button class="btn" data-act="seleccionarFlota">' + Icon('checkSquare', '', 14) + 'Seleccionar</button>') +
        '<button class="btn btn-primary" data-act="nuevaUnidad">' + Icon('plus', '', 14) + 'Nueva unidad</button>') +
      '<div class="toolbar">' +
        '<div class="seg">' + segTipos.map(s => '<button class="' + (f.tipo === s[0] ? 'on' : '') + '" data-act="tipoFlota" data-v="' + s[0] + '">' +
          esc(s[1]) + '<span class="seg-n">' + cuenta(s[0]) + '</span></button>').join('') + '</div>' +
        '<div class="tb-sp"></div>' +
        '<select class="inp inp-sm" id="fEstado" style="width:auto">' + estados.map(e => '<option value="' + e[0] + '"' + (f.estado === e[0] ? ' selected' : '') + '>' + e[1] + '</option>').join('') + '</select>' +
        '<div class="search-inline">' + Icon('search', '', 14) + '<input class="inp inp-sm" id="fQ" placeholder="Placa, marca o clase…" value="' + attr(f.q) + '"></div>' +
      '</div>' +
      '<div id="flotaRes"></div>';
    return {
      titulo: 'Flota', sub: 'Todas las unidades, con su foto', html,
      despues: () => {
        Vistas.flotaRes();
        $('#fEstado').addEventListener('change', e => { f.estado = e.target.value; Vistas.flotaRes(); });
        $('#fQ').addEventListener('input', e => { f.q = e.target.value; Vistas.flotaRes(); });
      }
    };
  },
  flotaRes() {
    const f = UIState.flota, el = $('#flotaRes');
    if (!el) return;
    const lista = Q.flota();
    const barra = f.sel ? UI.selBarra(lista) : '';
    if (!lista.length) { el.innerHTML = barra + '<div class="card">' + UI.empty('search', 'Ninguna unidad coincide', 'Pruebe con otra placa o quite los filtros.') + '</div>'; return; }
    el.innerHTML = barra + (f.modo === 'lista' ? this.flotaTabla(lista) : '<div class="ugrid">' + lista.map(u => this.tarjeta(u)).join('') + '</div>');
  },
  chipsDocs(u) {
    const req = Config.req[u.tipo] || [];
    if (!req.length) return '<span class="dchip nr">Sin documentos obligatorios</span>';
    return req.map(t => {
      const s = Est.doc(u.docs[t], t);
      return '<span class="dchip ' + s.k + '" title="' + attr(DOC_TIPOS[t].nombre + ': ' + s.txt + ' · ' + s.det) + '">' + esc(DOC_TIPOS[t].corto) + '</span>';
    }).join('');
  },
  tarjeta(u) {
    const e = Est.unidad(u), ins = Est.insp(u), c = Q.conductor(u.conductor), sel = UIState.flota.sel, on = Boolean(sel && sel.has(u.id));
    /* Mientras se selecciona, el clic marca la unidad en vez de abrirla */
    return '<article class="uc' + (sel ? ' selecting' + (on ? ' sel' : '') : '') + '" ' +
        (sel ? 'data-act="selUnidad" data-u="' + u.id + '" aria-pressed="' + on + '"' : 'data-ir="unidad/' + u.id + '"') + ' tabindex="0">' +
      '<div class="uc-ph">' + UI.foto(u) + (sel ? '<span class="uc-ck">' + UI.ck(on, 13) + '</span>' : '') +
        '<span class="uc-tag">' + Icon(TIPOS[u.tipo].icono, '', 12) + esc(u.clase) + '</span>' +
        (e.k !== 'nr' ? '<span class="uc-est">' + UI.pill(e.k, e.txt) + '</span>' : '') + '</div>' +
      '<div class="uc-b"><div class="uc-l1">' + UI.placa(u) + '<span class="uc-anio">' + esc(u.modelo || '') + '</span></div>' +

      '<div class="uc-f"><span>' + Icon('user', '', 12) + esc(UI.corto(c)) + '</span>' +
        '<span class="' + (ins.k !== 'ok' ? 'tx-' + ins.k : '') + '" title="Última inspección visual">' + Icon('clipboard', '', 12) + esc(u.insp ? Fecha.hace(u.insp) : 'Sin inspección') + '</span></div>' +

  flotaTabla(lista) {

    return '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr>' + (sel ? '<th class="td-ck"></th>' : '') +
      '<th>Unidad</th><th>Tipo</th><th>Conductor u operador</th><th>Documentos</th><th>Última inspección</th><th>Estado</th></tr></thead><tbody>' +
      lista.map(u => {
        const e = Est.unidad(u), i = Est.insp(u), c = Q.conductor(u.conductor), on = Boolean(sel && sel.has(u.id));
        return '<tr class="row-click' + (on ? ' sel' : '') + '" ' + (sel ? 'data-act="selUnidad" data-u="' + u.id + '" aria-pressed="' + on + '"' : 'data-ir="unidad/' + u.id + '"') + '>' +
          (sel ? '<td class="td-ck">' + UI.ck(on, 11) + '</td>' : '') + '<td>' + UI.unidadCelda(u) + '</td><td>' + esc(TIPOS[u.tipo].nombre) + '</td>' +

          '<td class="nowrap">' + esc(u.insp ? Fecha.corta(u.insp) : '—') + '<div class="dias d-' + i.k + '">' + esc(Fecha.hace(u.insp)) + '</div></td>' +
